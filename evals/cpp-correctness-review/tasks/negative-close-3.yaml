# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-003
name: Security buffer overflow via attacker size
description: |
  A buffer overflow question where harm depends on attacker control of size
  belongs to security review, not generic bounded correctness.
tags:
  - negative-close
inputs:
  prompt: |
    Review this C++ function: an attacker sends `user_size` bytes over the
    network. The code allocates a 256-byte stack buffer and calls `memcpy(buf,
    data, user_size)`. Is this a security vulnerability and what overflow
    protections should we add?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-correctness-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Target:"
        - "Contract:"
        - "Inputs/states reviewed:"
        - "Findings:"
        - "Severity:"
        - "Classification:"
        - "Evidence:"
        - "Rule:"
        - "Expected:"
        - "Actual:"
        - "Required guard:"
        - "Test expectation:"
        - "Checklist status:"
        - "Residual risk:"
