# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-003
name: Integer truncation silently changes result
description: |
  Review must activate on a size or count calculation that narrows, truncates,
  or multiplies to compute a buffer allocation and produces wrong behavior for
  values near the type boundary.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Review this C++ function for correctness. Contract: allocate and return a
    buffer large enough to hold `count` items of type `T`, or return nullptr if
    allocation fails. Callers pass `count >= 0`.

    ```cpp
    template<typename T>
    char* allocate_buffer(int count) {
      if (count < 0) return nullptr;
      std::uint16_t size = count * sizeof(T);
      return new (std::nothrow) char[size];
    }
    ```

    What are the findings when `count == 70000` and `sizeof(T) == 4`?
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-correctness-review/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cpp-correctness-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Target:'
        - '(?i)Contract:'
        - '(?i)Inputs/states reviewed:'
        - '(?i)Findings:'
        - '(?i)Severity:\s*(CRITICAL|HIGH)'
        - '(?i)Classification:\s*Confirmed issue'
        - '(?i)Evidence:'
        - '(?i)Rule:\s*numeric-size'
        - '(?i)(truncation|overflow|narrow|multiply|count.*sizeof|INT_MAX)'
        - '(?i)Expected:'
        - '(?i)Actual:'
        - '(?i)Required guard:'
        - '(?i)Test expectation:'
        - '(?i)Checklist status:'
        - '(?i)Residual risk:\s*[A-Za-z]'
      not_contains:
        - "Owners:"
        - "Thread safety:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response identifies the exact correctness bug: the line
        `std::uint16_t size = count * sizeof(T);` narrows the computed allocation
        size to 16 bits. When `count == 70000` and `sizeof(T) == 4`, the
        multiplication produces 280000 bytes, but storing it in `uint16_t`
        truncates the value to a much smaller allocation. Subsequent writes can
        overflow the heap.

        A correct response must:
        1. Identify the bug class: integer truncation or narrowing in size
          calculation.
        2. State the failing input: count == 70000 (or another large value),
          sizeof(T) == 4.
        3. Trace the result: computed size truncates to 16 bits, allocation is
          too small, heap corruption on use.
        4. Cite the contract violation: allocate enough for count*sizeof(T) bytes
          but instead allocate the truncated value.
        5. Prescribe the fix: store the size in a sufficiently wide type,
          validate before narrowing, or use a checked multiplication/conversion.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0

          1.0 = response identifies truncation/narrowing, failing input (70000 or
            large count), truncated result, heap corruption risk, contract
              violation, and safe guard.
          0.5 = response identifies the bug but omits one of: truncation mechanism,
            specific failing input, truncated result trace, or fix detail.
          0.0 = response is wrong, misses truncation/narrowing, or does not perform
              the skill.
      mode: independent
