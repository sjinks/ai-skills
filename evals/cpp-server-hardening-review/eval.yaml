# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: cpp-server-hardening-review-eval
description: |
  Evaluates the cpp-server-hardening-review skill: it activates for safe-by-default
  review of C++ network servers under untrusted load - first-request and idle
  timeouts, connection caps with accept-shed backpressure, guaranteed once-only
  teardown including TLS handshake failure, the install-after-teardown leak class,
  bounded per-id caches, fail-closed TLS/verification defaults, and read-time bound
  enforcement; stays silent on application authn/authz logic, pure HTTP-parser rule
  questions, and async-I/O strand/lifetime mechanics; and produces a structured
  `Verdict: BLOCK | CONCERNS | CLEAN` hardening report with severity-tagged
  findings, per-section checklist status, the hostile-client failure, the minimal
  fix, and the verification.
skill: cpp-server-hardening-review
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output applies the hardening checklist with the verdict report, names the hostile-client failure, the minimal fix, and the verification.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required safe-by-default hardening judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
