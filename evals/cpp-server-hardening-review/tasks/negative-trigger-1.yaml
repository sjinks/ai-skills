# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic cycling question
description: Unrelated everyday question must not activate the cpp-server-hardening-review skill.
tags:
  - negative-trigger
inputs:
  prompt: "What tire pressure should I run for a gravel bike on rough terrain?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-server-hardening-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Checklist status:"
        - "Hostile-client failure:"
        - "max_connections"
        - "slowloris"
