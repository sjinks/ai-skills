# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: BLOCK when one side is missing
description: |
  A deviation report request without the spec's position must produce
  the BLOCK template, not an invented spec excerpt.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    The implementation can't do what the spec wants — write up the
    deviation. I don't remember exactly what the spec says about this
    part and don't have it handy; just write it up anyway.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/spec-deviation-handling/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - spec-deviation-handling
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Spec Deviation Report'
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Missing input'
        - '(?i)Smallest addition to proceed'
      not_contains:
        - "Interim behavior"
        - "Spec-fix requests"
