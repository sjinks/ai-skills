# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Service decomposition is not PR slicing
description: |
  Architecture decomposition of a system into services is not a pending
  change-set split and must not activate the skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Our monolith handles orders, inventory, and shipping. We are considering
    decomposing it into separate services over the next two quarters. What
    boundaries would you draw, and what are the tradeoffs of splitting by
    domain versus by team ownership? This is architecture planning, not a
    pending code change.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/pr-scope-slicer/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Scope Slice Plan"
        - "Size signals"
        - "SINGLE-PASS-OK"
        - "SPLIT-REQUIRED"
