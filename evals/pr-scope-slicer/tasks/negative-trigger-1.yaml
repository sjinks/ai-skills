# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the pr-scope-slicer skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's a sensible packing list for a three-day autumn cycling trip with hostel stays?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/pr-scope-slicer/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Scope Slice Plan"
        - "Size signals"
        - "SINGLE-PASS-OK"
        - "SPLIT-REQUIRED"
        - "SPLIT-RECOMMENDED"
        - "Pre-Review Self-Audit Report"
