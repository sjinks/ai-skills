# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Pre-re-review hygiene check after fixes
description: |
  Author asks for a self-audit before requesting re-review; project checks
  exist but were not run.
tags:
  - positive-trigger
inputs:
  prompt: |
    Run a pre-review self-audit on my branch before I ask for re-review.

    Change intent: cache the exchange-rate lookup for 5 minutes.

    Diff summary:
    - src/rates/cache.ts: new in-memory cache wrapper around fetchRates(),
      including a `// TODO: handle clock skew?` comment I added today.
    - src/rates/index.ts: call site switched to the cached wrapper.
    - tests/rates.cache.test.ts: new test covering hit, miss, and expiry.

    Commit list: one commit, message "cache exchange rates for 5 minutes".

    The repository has package scripts `npm run lint` and `npm test` declared
    in package.json, but I have not run either yet in this environment, and
    you cannot run them here.

    PR description draft: "Cache exchange-rate lookups for 5 minutes to cut
    upstream API calls. Covered by new unit tests."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/pre-review-self-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - pre-review-self-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Pre-Review Self-Audit Report'
        - '(?i)\|\s*#\s*\|\s*Checklist item\s*\|\s*Status\s*\|\s*Notes\s*\|'
        - '(?i)npm run lint'
        - '(?i)npm test'
        - '(?i)outstanding'
        - '(?i)TODO'
        - '(?i)Verdict:\s*(CONCERNS|CLEAN)'
      not_contains:
        - "Gate decision:"
        - "Equivalence-Class Audit Report"
        - "Scope Slice Plan"
        - "Thread disposition:"
