# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the pre-review-self-audit skill.
tags:
  - negative-trigger
inputs:
  prompt: "How often should I water a snake plant kept in a low-light apartment?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/pre-review-self-audit/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Pre-Review Self-Audit Report"
        - "Checklist item"
        - "Verdict: CLEAN"
        - "Verdict: CONCERNS"
        - "Verdict: BLOCK"
        - "Gate decision:"
        - "Equivalence-Class Audit Report"
