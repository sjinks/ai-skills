# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: nestjs-testing-eval
description: |
  Evaluates the nestjs-testing skill: it activates on test-strategy / write-tests
  / fix-tests NestJS prompts, stays silent on pure build prompts (which belong
  to nestjs-development), pure-review prompts (which belong to nestjs-code-review),
  and plain non-Nest testing questions, is actually invoked when expected (and
  not when not), and produces a layered test plan and idiomatic @nestjs/testing
  code following the skill's layer-decision and assertion principles.
skill: nestjs-testing
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.3
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.2
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.35
    threshold: 0.8
    description: Output uses idiomatic NestJS testing patterns and avoids documented anti-patterns.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 12
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
