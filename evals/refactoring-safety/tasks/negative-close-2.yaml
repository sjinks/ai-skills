# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Intentional behavior change is not a refactor
description: |
  A performance optimization that intentionally changes observable
  output is behavior change, which the skill declares out of scope,
  and must not activate it.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Speed up our search endpoint by replacing exact result counts with
    estimated counts above 10k results — yes, the response values will
    change, that's the point, product signed off. Plan the
    implementation.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/refactoring-safety/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Refactoring Safety Plan"
        - "Tripwire events"
        - "characterization"
        - "accepted-uncovered"
