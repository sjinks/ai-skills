# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the refactoring-safety skill.
tags:
  - negative-trigger
inputs:
  prompt: "How do I reorganize my garage so the bikes and tools are both reachable?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/refactoring-safety/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Refactoring Safety Plan"
        - "Tripwire events"
        - "characterization"
        - "Verdict: BLOCK"
        - "Smallest addition to proceed"
