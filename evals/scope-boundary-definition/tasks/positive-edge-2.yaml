# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: BLOCK when no work item is described
description: |
  A request to scope a project without any description must produce the
  BLOCK template, not an invented work item.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Define the scope boundaries for the Q3 platform initiative. I can't
    share the brief here; just produce the scope document.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/scope-boundary-definition/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - scope-boundary-definition
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Scope Boundary Report'
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Missing input'
        - '(?i)Smallest addition to proceed'
      not_contains:
        - "### In scope"
        - "Creep risks"
