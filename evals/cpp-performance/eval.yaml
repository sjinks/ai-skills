# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: cpp-performance-eval
description: |
  Evaluates the cpp-performance skill: it activates for avoidable copies,
  pass-by-value of expensive types, range-for copies, misused std::move,
  missing noexcept on move/swap, missing reserve, and inefficient
  container/string/algorithm calls; stays silent on CERT security review,
  struct-layout reordering, and algorithmic redesign; and emits the skill's
  verdict, type costs, hot paths, findings, checklist status, and residual
  risk.
skill: cpp-performance
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output applies cost analysis, move/noexcept reasoning, severity/verdict mapping, and test/measurement expectations.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
