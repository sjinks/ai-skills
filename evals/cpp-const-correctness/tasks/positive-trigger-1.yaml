# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Never-mutated local value and reference
description: |
  Review must activate and const-qualify a never-reassigned local and a
  read-only local reference.
tags:
  - positive-trigger
inputs:
  prompt: |
    clang-tidy reports misc-const-correctness here. Which locals should be
    const, and how?

    ```cpp
    void render(const std::map<int, Node>& nodes, int key) {
      auto& entry = nodes.at(key);
      int width = entry.width();
      draw(entry, width);
    }
    ```

    Return the verdict, per-declaration findings, and checklist status.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-const-correctness/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cpp-const-correctness
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*(CLEAN|CONCERNS|BLOCK)'
        - '(?i)const\s+auto&|const auto&|auto const&'
        - '(?i)const\s+int|int const'
        - '(?i)(Category|Findings|Checklist status):'
