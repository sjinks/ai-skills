# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic travel question
description: Unrelated everyday question must not activate the const-correctness skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's the best month to visit Kyoto to see the autumn leaves?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-const-correctness/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Category:"
        - "Checklist status:"
