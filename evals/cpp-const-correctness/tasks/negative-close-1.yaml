# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Member-function const question
description: |
  Marking a member function const is a design/readability concern, not
  misc-const-correctness; the skill must not activate.
tags:
  - negative-close
inputs:
  prompt: |
    Should `size()` and `name()` on my class be declared const member
    functions? I'm trying to decide which methods belong in the const
    interface of the type and how that affects callers holding a const
    reference. This is about the member functions themselves, not any local
    variable.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-const-correctness/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Category:"
        - "Checklist status:"
