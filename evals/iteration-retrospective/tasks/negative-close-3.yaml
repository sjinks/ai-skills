# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-003
name: One failed attempt is not a retrospective
inputs:
  prompt: |
    My first attempt to fix a parsing bug failed. Retrospect that attempt and
    tell me what I should try next.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/iteration-retrospective/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Attempt Timeline:"
        - "Assessment:"
        - "Learnings:"
        - "Prevention:"
        - "Skill Candidate:"
        - "Retrospective:"
        - "Verdict:"