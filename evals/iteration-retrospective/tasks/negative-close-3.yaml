# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-003
name: One failed attempt is not a retrospective
inputs:
  prompt: |
    My first attempt to fix a parsing bug failed. Retrospect that attempt and
    tell me what I should try next. This is one attempt and I have not abandoned
    the approach. I cannot provide the concrete change, logs, or test evidence.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/iteration-retrospective/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - 'Retrospective Attempts:'
        - 'Retrospective Assessment:'
        - 'Retrospective Learnings:'
        - 'Retrospective Prevention:'
        - 'Retrospective Next Checks:'
        - 'Retrospective Skill Candidate:'
        - 'Retrospective:'
        - 'Retrospective Verdict:'
        - 'Retrospective Label Conflict:'
        - 'Retrospective Label Request:'
        - iteration-retrospective
