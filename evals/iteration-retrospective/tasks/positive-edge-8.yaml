# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-008
name: Invalid nonblocked labels require clarification instead of a report
inputs:
  prompt: |
    Retrospect a completed debugging history. Goal: correct an off-by-one count.
    A1 changed the wrong boundary and failed its sole success criterion; test output confirmed failure.
    A2 corrected the boundary and passed. The cause is confirmed, one deterministic boundary test prevents recurrence,
    and no uncertainty remains. There is one incident. Do not create artifacts.
    Use these exact top-level labels, in order: Goal:, Goal:, Attempts:, Lessons:, Controls:, Checks:, Candidate:, Result:.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/iteration-retrospective/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - iteration-retrospective
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Retrospective Label Conflict: .*([Dd]uplicate|[Dd]istinct|[Uu]nique|[Rr]epeated)'
        - '(?m)^Retrospective Label Request: .*([Pp]rovide|[Ss]upply|[Ss]end|[Cc]hoose|[Rr]eplace|[Ss]pecify).*([Ll]abel)'
        - '(?m)^Retrospective\ Label\ Conflict:'
      not_contains:
        - 'Retrospective Attempts:'
        - 'Retrospective Verdict:'
        - 'Retrospective Skill Candidate:'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/iteration-retrospective/check-report.py
        - --profile
        - label-clarification
        - --labels
        - 'Goal:'
        - 'Goal:'
        - 'Attempts:'
        - 'Lessons:'
        - 'Controls:'
        - 'Checks:'
        - 'Candidate:'
        - 'Result:'
      timeout: 30
