# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-003
name: Independent repeated failures warrant new skill
inputs:
  prompt: |
    Retrospect two independent repository incidents. In repo A and repo B, agents repeatedly fixed review comments one by one because each lacked a method to cluster equivalent findings. Both histories show the same root cause, a stable clustering procedure, and repeated review churn.
    Decide whether reusable guidance is warranted and cite the evidence.

    Treat each repository incident as one supplied attempt. Evidence establishes that clustering requires contextual judgment, the procedure has portable inputs/outputs, no established guidance covers it, and no deterministic check, helper, local instruction, or refactor resolves it.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/iteration-retrospective/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - iteration-retrospective
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Retrospective\ Verdict: CLEAN$'
        - '(?m)^Retrospective\ Skill\ Candidate: new skill$'
        - 'Retrospective Attempts:'
        - 'Evidence:'
        - 'Retrospective Skill Candidate: new skill'
        - 'Retrospective Prevention:'
        - 'Retrospective Next Checks:'
        - 'Retrospective Verdict: CLEAN'
        - '(?m)^Retrospective:'
      not_contains:
        - Fact-Check Summary
        - 'Gate decision:'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/iteration-retrospective/check-report.py
        - --verdict
        - CLEAN
        - --candidate
        - new skill
        - --attempt-count
        - '2'
        - --mechanisms
        - reusable skill
      timeout: 30
