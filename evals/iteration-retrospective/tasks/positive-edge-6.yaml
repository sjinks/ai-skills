# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-006
name: New repository guidance does not extend existing guidance
inputs:
  prompt: |
    Retrospect this local investigation. Goal: obtain required diagnostics before changing a parser and include required timestamps in diagnostic logs.
    A1 changed the parser without collecting diagnostics and failed to resolve the import failure. Its action, failure and missing diagnostics are recorded in the investigation log.
    A2 collected the required diagnostics, corrected the evidenced cause and passed validation. The log and validation output establish the cause and outcome.
    A3 changed the diagnostic log formatter, but its output omitted a required timestamp; validation recorded failure. This is a second confirmed failure pattern.
    There is no established debugging guidance in this repository. The selected smallest prevention is new repository guidance defining the diagnostic-evidence prerequisite. No deterministic check, shared helper or refactor addresses the workflow failure. For the timestamp pattern, both a deterministic check and a shared helper address recurrence. No dependency counts, workflow-step counts or cost bounds are available for either; neither can be ranked from evidence. This is one incident. Preserve the supported guidance selection, leave the timestamp prevention unresolved without inventing costs, and derive the candidate from selected mechanisms only. Do not create files.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/iteration-retrospective/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - iteration-retrospective
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - 'Retrospective Prevention:'
        - 'Retrospective Skill Candidate: no new skill'
        - 'Retrospective Verdict: CONCERNS'
        - '(?im)^- N[1-9][0-9]*: .*(cost|dependenc|workflow.step|step.count)'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/iteration-retrospective/check-report.py
        - --verdict
        - CONCERNS
        - --candidate
        - no new skill
        - --attempt-count
        - '3'
        - --mechanisms
        - repository guidance
      timeout: 30
