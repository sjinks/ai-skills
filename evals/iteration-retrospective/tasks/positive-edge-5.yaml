# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Caller labels and known failed outcome-5
inputs:
  prompt: |-
    Retrospect a completed debugging history. Goal: correct an off-by-one count. A1 changed the wrong boundary and failed its sole success criterion; the test output confirmed failure. A2 corrected the boundary and passed the success criterion, replacing the first approach. The cause is confirmed by the changed boundary and test output. A deterministic boundary test resolves recurrence. There is one incident and no unresolved validation or prevention decision.
    The boundary test and a shared helper both address recurrence, each with zero new dependencies and one new workflow step. Select the mechanism using the defined tie-break order.
    An established debugging checklist also lacks a boundary-check step. Updating it addresses recurrence but requires two new workflow steps and zero dependencies. Derive the skill recommendation from the selected mechanism.
    Use these exact top-level labels, in order: Goal:, Outcome:, Attempts:, Lessons:, Controls:, Checks:, Candidate:, Result:. Keep the normal row fields and enum values.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/iteration-retrospective/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - iteration-retrospective
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^- A1 \| Status: failed \|'
        - '(?m)^- A2 \| Status: worked \|'
        - 'Mechanism: deterministic check'
        - '(?m)^Goal:'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/iteration-retrospective/check-report.py
        - --verdict
        - CLEAN
        - --candidate
        - no new skill
        - --attempt-count
        - '2'
        - --mechanisms
        - deterministic check
        - --labels
        - 'Goal:'
        - 'Outcome:'
        - 'Attempts:'
        - 'Lessons:'
        - 'Controls:'
        - 'Checks:'
        - 'Candidate:'
        - 'Result:'
      timeout: 30
