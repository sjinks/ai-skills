# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: iteration-retrospective-eval
description: Evaluates evidence-bound retrospectives for multi-attempt work and prevention decisions.
skill: iteration-retrospective
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
  - name: task_completion
    weight: 0.40
    threshold: 0.8
  - name: efficiency
    weight: 0.15
    threshold: 0.7
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"