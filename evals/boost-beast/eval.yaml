# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: boost-beast-eval
description: |
  Evaluates the boost-beast skill: it activates for Beast HTTP, WebSocket,
  parser, serializer, body, stream, and protocol-hardening tasks; stays silent
  on generic HTTP/API or pure Asio executor tasks; and produces output that
  preserves protocol limits, parser policy, stream lifetime, and test evidence.
skill: boost-beast
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  parallel: true
  workers: 2
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.35
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: task_completion
    weight: 0.45
    threshold: 0.8
    description: Output applies Beast protocol, parser, serializer, lifetime, limits, and test-planning guidance.
  - name: efficiency
    weight: 0.20
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 150000
tasks:
  - "tasks/*.yaml"
