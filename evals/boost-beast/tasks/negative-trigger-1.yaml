# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Pure Asio timer cancellation
description: |
  Asio-specific timer and cancellation design without Beast protocol behavior.
tags:
  - negative-trigger
inputs:
  prompt: |
    In a C++ TCP service, explain in one short paragraph why a race-safe timeout
    wrapper for one pending read is a timer/cancellation concern rather than a
    protocol parser concern. Do not write code.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/boost-beast/SKILL.md
      mode: negative
      threshold: 0.85
  - type: text
    name: task_completion
    config:
      not_contains:
        - "request smuggling"
        - "Content-Length"
        - "Transfer-Encoding"
        - "body_limit"
