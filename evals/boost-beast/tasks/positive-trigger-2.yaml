# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Design Beast WebSocket endpoint
description: |
  Beast WebSocket design task requiring upgrade validation, limits, write
  serialization, close handling, and tests.
tags:
  - positive-trigger
inputs:
  prompt: |
    Design a Boost.Beast WebSocket endpoint for authenticated clients. It must
    validate the HTTP upgrade target and origin, pick a subprotocol, cap message
    size, serialize server push writes, handle ping/pong and close frames, and
    map abnormal disconnects into diagnostics. Answer concisely from this
    scenario only; do not inspect files. Use these section labels exactly:
    Upgrade policy, Stream ownership, Write serialization, Close handling,
    Tests.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/boost-beast/SKILL.md
      mode: positive
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)(upgrade|target|origin|subprotocol)"
        - "(?i)(message size|read_message_max|limit)"
        - "(?i)(serialize|write queue|single writer)"
        - "(?i)(ping|pong|close frame|abnormal disconnect)"
        - "(?i)(ownership|lifetime|stream)"
        - "(?i)(Tests|verification)"
