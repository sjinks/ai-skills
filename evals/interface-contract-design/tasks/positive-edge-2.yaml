# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: BLOCK when no boundary is described
description: |
  A request to design a contract with no boundary description must
  produce the BLOCK template, not an invented API.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Design the interface contract for the new service the data team is
    planning. I haven't seen their requirements — just write the
    contract.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/interface-contract-design/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - interface-contract-design
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Interface Contract'
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Missing input'
        - '(?i)Smallest addition to proceed'
      not_contains:
        - "### Operations"
        - "Idempotency: idempotent"
