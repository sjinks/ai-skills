# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json

name: agent-skill-audit-eval

description: |
  Evaluates the redesigned agent-skill-audit skill. It activates for holistic
  readiness audits of Agent Skills and custom agents, handles package and
  model-portability analysis, stays silent on instruction-quality diagnostics
  and direct rewrites, and emits stable readiness report markers.

skill: agent-skill-audit
version: "2.0"

config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2

metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Prompt-to-skill routing matches the expected audit mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: The readiness audit skill is invoked on positive tasks.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output follows the readiness contract and identifies material risks.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: The audit stays within tool-call and token budgets.

graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000

tasks:
  - "tasks/*.yaml"
