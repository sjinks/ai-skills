# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: negative-close-002

name: Direct skill rewrite

description: A direct rewrite without audit framing should not trigger the readiness audit.

tags:
  - negative-trigger
  - close-domain

inputs:
  prompt: |
    Rewrite this skill directly so it is concise and portable. Return the new
    SKILL.md, not an audit.

    ```markdown
    ---
    name: formatter
    description: Use when formatting text.
    ---
    Always plan first. Ask before every edit. Use the Bash tool.
    ```

expected:
  should_trigger: false

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: negative
      threshold: 0.45

  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Agent/Skill Readiness Audit"
        - "Audit:"
        - "## Audit Scope"
        - "## Readiness Ratings"
        - "## Material Findings"
        - "## Target-Model Compatibility"
        - "## Priority Changes"
        - "Verdict:"
