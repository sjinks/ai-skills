# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-duplicate-001

name: Confirmed duplicate sources are audited once

description: Exact duplicate artifacts should produce one report with both sources listed in scope.

tags:
  - positive-trigger
  - duplicate-input

inputs:
  prompt: |
    Audit these confirmed duplicate copies once and list both sources.

    `copy-a/SKILL.md`
    ```markdown
    ---
    name: approval-helper
    description: Use when deciding whether a change needs approval.
    ---
    Always ask for approval.
    Never ask for approval for reversible changes.
    ```

    `copy-b/SKILL.md`
    ```markdown
    ---
    name: approval-helper
    description: Use when deciding whether a change needs approval.
    ---
    Always ask for approval.
    Never ask for approval for reversible changes.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - agent-skill-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Agent/Skill Readiness Audit$"
        - '(?m)^Audit:.*copy-a/SKILL\.md'
        - "(?m)^## Audit Scope$"
        - 'Files included:[\s\S]*copy-a/SKILL\.md[\s\S]*copy-b/SKILL\.md'
        - 'Severity:\s*(CRITICAL|HIGH|MEDIUM|LOW)'
        - "(?m)^## Readiness Ratings$"
        - "(?m)^## Material Findings$"
        - "(?m)^## Target-Model Compatibility$"
        - "(?m)^## Priority Changes$"
        - "(?m)^Verdict:"
      not_contains:
        - "Audit: copy-b/SKILL.md"
        - "# Instruction Quality Audit"
