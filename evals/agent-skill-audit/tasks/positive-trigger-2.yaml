# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-agent-001

name: Readiness audit of a custom subagent

description: The audit should apply agent-specific delegation, authority, stopping, and return-contract checks.

tags:
  - positive-trigger
  - agent-artifact

inputs:
  prompt: |
    Assess whether this custom subagent is ready to use.

    ```markdown
    You are a repository investigator.

    Investigate whatever the parent asks.
    You may change files when useful.
    Do not change files.
    Keep working until the problem is solved.
    Return useful information.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - agent-skill-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Readiness Ratings$"
        - "(?m)^## Material Findings$"
        - "(?m)^## Target-Model Compatibility$"
        - "(?m)^## Priority Changes$"
        - "(?m)^Verdict:"
        - "(?m)^# Agent/Skill Readiness Audit$"
        - 'Artifact type:\s*Custom agent'
        - '(?i)(edit|change files)[\s\S]*(authority|conflict|read-only|permission)'
        - 'Severity:\s*(CRITICAL|HIGH|MEDIUM|LOW)'
        - "(?i)(return contract|parent|result returned)"
        - "(?i)(stopping|stop|completion)"
        - '(?m)^Verdict:\s*(Needs revision|Major redesign)$'
      not_contains:
        - "# Instruction Quality Audit"
