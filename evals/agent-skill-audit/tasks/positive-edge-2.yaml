# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Agent skill audit ignores prompt reference for blocked file input
description: Prompt references should not be treated as audit targets when the real skill path is unreadable.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Please audit the supplied agent skill artifact at /tmp/missing-agent-skill.md.
    The prompt context also includes #prompt:SKILL.md, but that reference is
    not the artifact to audit.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - agent-skill-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^Audit:\\s*.*/missing-agent-skill\\.md"
        - "(?i)Findings:[\\s\\S]*(unreadable|missing)[\\s\\S]*/tmp/missing-agent-skill\\.md"
        - "(?i)Recommendations:[\\s\\S]*(request|ask|provide|supply)[\\s\\S]*(exact|full|complete)[\\s\\S]*(missing|readable)[\\s\\S]*agent skill[\\s\\S]*(content|file path|input)"
        - "## Consistency[\\s\\S]*?Rating:\\s*1"
        - "## Cohesion[\\s\\S]*?Rating:\\s*1"
        - "## Coherence[\\s\\S]*?Rating:\\s*1"
        - "## Completeness[\\s\\S]*?Rating:\\s*1"
        - "## Suitability for weaker models[\\s\\S]*?Rating:\\s*1"
        - "Instruction length:"
        - "Nesting depth:"
        - "Overloaded conditionals:"
        - "Ambiguous or conflicting priorities:"
        - "Duplicated or overlapping instructions:"
        - "Missing examples:"
        - "Expected output format is easy to reproduce:"
        - "(?m)^## Top 5 Changes"
        - "(?m)^Verdict:\\s*Blocked by missing input"
      not_contains:
        - "Audit: #prompt:SKILL.md"
        - "# Instruction Analysis Report"