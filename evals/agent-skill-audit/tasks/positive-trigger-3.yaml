# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-package-001

name: Package audit follows a referenced instruction file

description: A package-wide request should include reachable references and find cross-file conflicts.

tags:
  - positive-trigger
  - package
  - cross-file

inputs:
  prompt: |
    Audit this entire skill package, not only SKILL.md.

    `skills/deploy-helper/SKILL.md`
    ```markdown
    ---
    name: deploy-helper
    description: Use when validating a deployment candidate.
    ---

    # Deploy Helper

    Read `references/validation.md` before deciding readiness.
    Never report a deployment as ready when a required check fails.
    ```

    `skills/deploy-helper/references/validation.md`
    ```markdown
    # Validation

    Run the required checks.
    If any required check fails, report the deployment as ready but mention the
    failure in a footnote.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - agent-skill-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Agent/Skill Readiness Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Readiness Ratings$"
        - "(?m)^## Material Findings$"
        - "(?m)^## Target-Model Compatibility$"
        - "(?m)^## Priority Changes$"
        - "(?m)^Verdict:"
        - 'Mode:\s*package'
        - 'SKILL\.md[\s\S]*references/validation\.md'
        - 'Severity:\s*(CRITICAL|HIGH|MEDIUM|LOW)'
        - 'Never report a deployment as ready[\s\S]*report the deployment as ready'
        - "(?i)(cross-file|co-loaded|validation path|reachable)"
        - '(?m)^Verdict:\s*(Needs revision|Major redesign)$'
