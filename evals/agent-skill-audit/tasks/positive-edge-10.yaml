# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-edge-010

name: Expanded model roster uses distinct compatibility rows

description: A default-set readiness audit should report every canonical model, including four distinct GPT-6 targets and Claude Opus 5.

tags:
  - positive-trigger
  - model-portability
  - output-contract

inputs:
  prompt: |
    Audit this custom agent for production readiness using the default target
    model set. Set Artifact type to Custom agent, Mode to core, Target models
    to default set, and Status to completed because this is one pasted
    artifact. In Target-Model
    Compatibility, report one separate table row
    for every default model using its exact canonical name and default-set
    order. Include each default model exactly once and no other model rows.
    Keep each GPT model's analysis attached to its own row. Across that row's
    Main risk and Required adaptation cells, mention at least two of these
    cues for GPT-6 Luna: short normal path, explicit defaults, simple output
    grammar. For GPT-6 Sol, mention at least two of: clear outcomes, evidence,
    adaptable tool use, side-effect boundaries. For GPT-6.1 Sol, mention at
    least two of: literal broad scope, invariants, or optional delegation only for
    independent workstreams (the delegation cue requires both parts and its scope). For GPT-6 Astra, mention at least two of: concise
    mission, hard boundaries, strategic freedom, pause conditions.

    ```markdown
    ---
    name: incident-coordinator
    description: Use when coordinating a complex incident investigation.
    ---
    Follow this exact 30-step tool sequence for every incident. Always split
    the investigation into five subagents, even when their work depends on
    shared context. Resolve conflicting evidence into one confident answer.
    Continue into adjacent systems until every inconsistency is explained.
    Report completion from reasoning when runtime verification is unavailable.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - agent-skill-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^ {0,3}# Agent/Skill Readiness Audit$'
        - '(?m)^ {0,3}Audit: .+'
        - '(?m)^ {0,3}## Readiness Ratings$'
        - '(?m)^ {0,3}## Material Findings$'
        - '(?m)^ {0,3}Verdict: (Ready|Ready with limitations|Needs revision|Major redesign)$'
        - '(?i)conflicting evidence|side-effect boundaries|independent workstreams|pause conditions'


  - type: program
    name: output_contract
    config:
      command: python3
      args:
        - evals/agent-skill-audit/check-report.py
      timeout: 30

  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the readiness report follows its output contract and
        performs model-specific analysis rather than repeating generic profile
        descriptions. Use Artifact type: Custom agent and Mode: core for this
        one pasted target. Use Target models: default set. It must use each
        top-level marker exactly once and in
        order, end with the Verdict line, include exactly the five canonical
        readiness-rating rows with no additional rows, provide Priority Changes
        content or exact None. with no more than five numbered corrective
        tasks, and include exactly one
        complete compatibility row for every canonical default model with no
        additional model rows. This supplied agent has material defects, so
        Material Findings must contain at least one complete finding with fields
        ordered Severity, Area, Locations,
        Evidence, Risk, Correction; do not combine None. with findings.

        The report must substantively distinguish these changed profiles and
        apply them to the supplied agent: GPT-6 Luna checks a short normal path,
        explicit defaults, and a simple output grammar; GPT-6 Sol checks clear
        outcomes, evidence, adaptable tool use, and side-effect boundaries;
        GPT-6.1 Sol checks literal broad scope, invariants, evidence preservation,
        and optional delegation only for independent workstreams; GPT-6 Astra
        checks a concise mission, hard boundaries, strategic freedom, and pause
        conditions;
        Claude Haiku 4.5 checks explicit defaults, material parameters, bounded
        steps, or missing-input/tool fallbacks; Claude Opus 5 checks current-state
        tool triggers and preservation of uncertainty or disagreement.
        Generic boilerplate, swapped profile reasoning, or prompt echo without
        applying the checks to the audited agent cannot receive full credit.

        Assess every default model; do not mark a model Not assessed. The
        supplied single artifact is fully readable, so use Status: completed.

        The final readiness verdict must agree with the ratings and corrective
        work: any rating 1 requires Major redesign; any rating 2 or 3, material
        finding, or priority change requires Needs revision unless Major
        redesign applies. Ready and Ready with limitations require all ratings
        to be 4 or 5 and both corrective sections to be None.; select Ready
        with limitations only for a model, runtime, or unavailable-evidence
        limitation, and Ready when it is None. This supplied agent is readable,
        so do not use the blocked-report branch or Verdict: Blocked. Major
        redesign requires at least one rating 1, or multiple rating-2 areas
        whose risks or findings substantively establish that the architecture
        is fundamentally wrong. Accept equivalent wording and supporting
        evidence; do not require an exact phrase or a particular cell.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.

        Full success: the report satisfies the scope, structure, roster, verdict,
        and table contracts, and all six substantive profile checks.
        Partial completion (fail): structure and roster are correct but one profile is generic or blurred.
        Failure: structure or roster is incomplete, or multiple profiles are wrong.
      mode: independent
