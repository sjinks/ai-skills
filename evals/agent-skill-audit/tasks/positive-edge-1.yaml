# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-adapters-001

name: Mutually exclusive runtime adapters are not contradictions

description: The package audit should distinguish mutually exclusive Claude and Codex adapters.

tags:
  - positive-trigger
  - package
  - runtime-adapters

inputs:
  prompt: |
    Audit this package for Claude Code and Codex portability.

    `SKILL.md`
    ```markdown
    ---
    name: repository-search
    description: Use when searching a repository for relevant symbols.
    ---

    # Repository Search

    Load exactly one runtime adapter for the active host.
    ```

    `adapters/claude.md`
    ```markdown
    Use the Grep tool for repository search.
    ```

    `adapters/codex.md`
    ```markdown
    Use the repository search capability available in Codex.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - agent-skill-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Agent/Skill Readiness Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Readiness Ratings$"
        - "(?m)^## Material Findings$"
        - "(?m)^## Priority Changes$"
        - "(?m)^Verdict:"
        - 'Mode:\s*package'
        - '(?i)claude[\s\S]*codex'
        - "(?i)(mutually exclusive|exactly one runtime adapter|separate adapter)"
        - "(?m)^## Target-Model Compatibility$"
        - '(?m)^Verdict:\s*(Ready|Ready with limitations|Needs revision)$'
      not_contains:
        - "Use the Grep tool for repository search. conflicts with Use the repository search capability available in Codex."
