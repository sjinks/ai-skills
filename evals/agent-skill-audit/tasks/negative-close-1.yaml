# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Instruction quality audit overlap request
description: Explicit instruction-quality-audit framing should route to that skill, not agent-skill-audit.
tags:
  - negative-trigger
  - close-domain
  - overlap-disambiguation
inputs:
  prompt: |
    Please review this prompt template for contradictions, ambiguity, persona
    consistency, cognitive load, duplication, semantic coverage, missing error
    handling, and the custom diagnostic below.

    Custom diagnostic: Flag any instruction that asks for hidden chain of
    thought.

    ```markdown
    You are a terse release assistant.
    Be warm and expansive in every reply.
    Summarize the change in a few bullets.
    Include detailed private reasoning before the final answer.
    If input is missing, proceed anyway.
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Findings:"
        - "Audit:"
        - "## Consistency"
        - "## Cohesion"
        - "## Coherence"
        - "## Completeness"
        - "## Suitability for weaker models"
        - "Top 5 Changes"
        - "Verdict:"