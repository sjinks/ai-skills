# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: negative-close-001

name: Compare two single-instruction phrasings

description: A narrow wording comparison should not trigger a readiness audit.

tags:
  - negative-trigger
  - close-domain
  - overlap-disambiguation

inputs:
  prompt: |
    Which single instruction is clearer for an assistant to follow? Choose A or
    B and give one brief reason. Do not audit a larger artifact or rewrite
    either option.

    A. If the incident is still active after the first response, gather the
    unresolved evidence and escalate it to the incident lead.
    B. Gather evidence and escalate active incidents when needed.

expected:
  should_trigger: false

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: negative
      threshold: 0.45

  - type: text
    name: task_completion
    config:
      not_contains:
        - "agent-skill-audit"
        - "# Agent/Skill Readiness Audit"
        - "Audit:"
        - "## Audit Scope"
        - "## Readiness Ratings"
        - "## Material Findings"
        - "## Target-Model Compatibility"
        - "## Priority Changes"
        - "Verdict:"
