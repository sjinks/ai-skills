# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: negative-close-001

name: Exact instruction-quality diagnostic request

description: An exhaustive defect diagnostic belongs to instruction-quality-audit.

tags:
  - negative-trigger
  - close-domain
  - overlap-disambiguation

inputs:
  prompt: |
    Diagnose this prompt for exact contradictions, precedence gaps, ambiguous
    terms, authority conflicts, closure gaps, harmful duplication, and output
    contract defects. Cite exact excerpts and give corrective wording.

    ```markdown
    Always use tools.
    Never use tools.
    If the input is JSON, parse it.
    If the input is YAML, parse it.
    ```

expected:
  should_trigger: false

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: negative
      threshold: 0.45

  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Agent/Skill Readiness Audit"
        - "Audit:"
        - "## Audit Scope"
        - "## Readiness Ratings"
        - "## Material Findings"
        - "## Target-Model Compatibility"
        - "## Priority Changes"
        - "Verdict:"
