# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: negative-trigger-001

name: Ordinary code review

description: Normal code review is outside the readiness-audit scope.

tags:
  - negative-trigger

inputs:
  prompt: |
    Review this TypeScript function for bugs and suggest a fix.

    ```ts
    export function first(values: string[]) {
      return values[1];
    }
    ```

expected:
  should_trigger: false

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/agent-skill-audit/SKILL.md
      mode: negative
      threshold: 0.45

  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Agent/Skill Readiness Audit"
        - "Audit:"
        - "## Audit Scope"
        - "## Readiness Ratings"
        - "## Material Findings"
        - "## Target-Model Compatibility"
        - "## Priority Changes"
        - "Verdict:"
