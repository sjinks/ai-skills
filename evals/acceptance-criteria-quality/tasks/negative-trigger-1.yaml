# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the acceptance-criteria-quality skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's a good route for a first-time visitor spending two days in Lisbon?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/acceptance-criteria-quality/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Smallest addition to proceed"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Acceptance Criteria Quality Report"
        - "needs-owner-input"
        - "Verify by"
        - "Proposed additions"
