# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the requirement-sharpening skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's a good dough hydration ratio for a chewy weeknight pizza crust?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirement-sharpening/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Requirement Sharpening Report"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: SHARP"
        - "Verdict: insufficient-context"
        - "Open items (flag, do not fabricate)"
        - "Quote:"
        - "Fix:"
        - "Sharpened Requirements"
