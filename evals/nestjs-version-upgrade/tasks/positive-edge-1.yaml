# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Express-to-Fastify adapter swap during upgrade
description: |
  An Express-to-Fastify adapter swap is a request/response behavior migration, not
  a drop-in bump — a documented hard behavior the skill must call out and isolate.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    While upgrading NestJS we also want to move from the Express adapter to
    Fastify for throughput. Some handlers reach into the raw `res` object to set
    headers and stream responses. How should we approach this as part of the
    upgrade?
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/nestjs-version-upgrade/SKILL.md
      mode: positive
      threshold: 0.5
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - nestjs-version-upgrade
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)fastify'
        - '(?i)(separate step|its own step|not a drop-in|behavior migration|isolate)'
        - '(?i)(req|res|request|response)'
        - '(?i)(verif|boot|e2e)'
