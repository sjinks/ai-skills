# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: nestjs-version-upgrade-eval
description: |
  Evaluates the nestjs-version-upgrade skill: it activates on NestJS upgrade /
  major-migration / breaking-change-triage prompts, stays silent on plain
  build prompts (nestjs-development), review prompts (nestjs-code-review),
  and unrelated dependency-bump questions, is actually invoked when expected
  (and not when not), and produces an ordered, reversible upgrade plan with
  per-step verification following the skill's sequencing rules.
skill: nestjs-version-upgrade
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.3
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.2
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.35
    threshold: 0.8
    description: Output is an ordered, reversible upgrade plan with per-step verification and sequencing discipline.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 12
      max_tokens: 10000
tasks:
  - "tasks/*.yaml"
