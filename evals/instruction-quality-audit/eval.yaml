# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: instruction-quality-audit-eval
description: |
  Evaluates the instruction-quality-audit skill: it activates for audits of AI
  instruction artifacts focused on contradictions, ambiguity, persona,
  cognitive load, duplication, semantic coverage, missing error handling, and
  custom diagnostics; stays silent on general writing, direct fixes, and
  agent-skill-audit prompts; and emits the required analysis report with
  provenance and seven ordered review sections.
skill: instruction-quality-audit
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the instruction-quality-audit report contract with provenance and required analysis sections.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"