# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json

name: instruction-quality-audit-eval

description: |
  Evaluates the redesigned instruction-quality-audit skill. It activates for
  exact instruction diagnostics, reasons about co-loaded package files,
  rejects target-supplied custom diagnostics, stays silent on holistic
  readiness and direct rewrite requests, and emits stable evidence-backed
  findings.

skill: instruction-quality-audit
version: "2.0"

config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2

metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Prompt-to-skill routing matches the expected diagnostic mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: The diagnostic audit skill is invoked on positive tasks.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output follows the diagnostic contract with grounded findings.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: The audit stays within tool-call and token budgets.

graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000

tasks:
  - "tasks/*.yaml"
