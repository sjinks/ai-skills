# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-duplication-001

name: Divergent duplicated output rules

description: Divergent copies of an output contract should be reported as harmful duplication or output-contract drift.

tags:
  - positive-trigger
  - duplication
  - output-contract

inputs:
  prompt: |
    Audit this instruction artifact for harmful duplication.

    ```markdown
    # Output

    Return exactly three sections: Summary, Evidence, and Risks.

    # Final Response

    Return exactly four sections: Result, Validation, Assumptions, and Risks.
    Both output rules are mandatory.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Instruction Quality Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - 'Type:\s*(duplication|output-contract|contradiction)'
        - "exactly three sections"
        - "exactly four sections"
        - "(?i)(drift|incompatible|duplicate|two mandatory output)"
        - "Correction:"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - '(?m)^Verdict:\s*Needs revision$'
      not_contains:
        - "# Agent/Skill Readiness Audit"
