# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: negative-close-002

name: Direct prompt rewrite

description: A direct rewrite without audit framing should not trigger the diagnostic audit.

tags:
  - negative-trigger
  - close-domain

inputs:
  prompt: |
    Rewrite these instructions directly and return only the improved prompt:

    ```markdown
    Be clear. Do the work. Use tools as needed.
    ```

expected:
  should_trigger: false

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: negative
      threshold: 0.45

  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Instruction Quality Audit"
        - "Audit:"
        - "## Audit Scope"
        - "## Findings"
        - "## Unresolved Questions"
        - "## Summary"
        - "Verdict:"
