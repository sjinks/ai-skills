# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Direct frontmatter fix request
description: Direct YAML frontmatter fixing or prompt rewriting without audit framing should not trigger the skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Fix the YAML frontmatter and rewrite these prompt instructions directly.
    Return the corrected prompt, not an audit or report.

    ```markdown
    ---
    name prompt-polisher
    description Use when polishing prompt wording.
    ---

    # Prompt Polisher

    Make the prompt clearer.
    Preserve the user's intent.
    Ask for missing context when needed.
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Instruction Analysis Report"
        - "Provenance:"
        - "## Contradictions"
        - "## Ambiguity Issues"
        - "## Custom Diagnostics"