# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: negative-trigger-001

name: Ordinary prose proofreading

description: Normal prose editing is outside instruction-quality auditing.

tags:
  - negative-trigger

inputs:
  prompt: |
    Proofread this paragraph and improve its grammar:

    The project were completed yesterday and the results is ready.

expected:
  should_trigger: false

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: negative
      threshold: 0.45

  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Instruction Quality Audit"
        - "Audit:"
        - "## Audit Scope"
        - "## Findings"
        - "## Unresolved Questions"
        - "## Summary"
        - "Verdict:"
