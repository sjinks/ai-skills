# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-trigger-001

name: Contradiction diagnostic

description: An explicit request for exact instruction defects should trigger the diagnostic audit.

tags:
  - positive-trigger
  - contradiction

inputs:
  prompt: |
    Audit these instructions for exact contradictions and ambiguity. Cite the
    relevant wording and suggest a correction.

    ```markdown
    Always close duplicate tickets immediately.
    Never close any ticket without human approval.
    Use all available tools before responding.
    Do not use tools unless the ticket contains a customer ID.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^## Unresolved Questions$"
        - "(?m)^Verdict:"
        - "(?m)^# Instruction Quality Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^### IQA-001"
        - 'Type:\s*(contradiction|precedence)'
        - 'Always close duplicate tickets immediately\.'
        - 'Never close any ticket without human approval\.'
        - "Behavioral risk:"
        - "Correction:"
        - "(?m)^## Summary$"
        - '(?m)^Verdict:\s*Needs revision$'
      not_contains:
        - "# Agent/Skill Readiness Audit"
        - "I updated"
        - "Here is the rewritten prompt"
