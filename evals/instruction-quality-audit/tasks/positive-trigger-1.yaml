# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Instruction quality audit of a prompt artifact
description: Explicit instruction quality audit request should trigger the skill and report contradictions and ambiguity.
tags:
  - positive-trigger
inputs:
  prompt: |
    Please perform an instruction quality audit on this short prompt artifact.
    It likely has a contradiction and ambiguous scope.

    ```markdown
    You are a customer-support assistant for refund requests.
    Always approve refund requests immediately.
    Never approve a refund without manager confirmation.
    Keep replies brief and helpful.
    Use the customer's account history when available.
    If account history is unavailable, decide based on context.
    Summarize a few important details before the decision.
    ```
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Instruction Analysis Report"
        - "(?m)^Provenance:"
        - "(?m)^- Readable:\\s*yes\\s*$"
        - "(?m)^## Contradictions"
        - "(?m)^## Ambiguity Issues"
        - "(?m)^## Persona Issues"
        - "(?m)^## Cognitive Load"
        - "(?m)^## Duplication"
        - "(?m)^## Coverage Analysis"
        - "(?m)^## Custom Diagnostics"
        - "(?m)^Severity:\\s*`?(error|warning|info)`?"
        - "Always approve refund requests immediately\\.[\\s\\S]*Never approve a refund without manager confirmation\\."
        - "(?i)Explanation:[\\s\\S]*(conflict|contradict|cannot both|would)"
        - "(?m)^Suggestion:\\s*(Replace|Remove|Require|Rewrite|Add)\\b"
      not_contains:
        - "Audit:"
        - "Top 5 Changes"
        - "Verdict:"
        - "Suggestion: Clarify"