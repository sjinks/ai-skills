# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-package-001

name: Cross-file contradiction on a reachable path

description: The diagnostic should follow a normative reference and cite both files.

tags:
  - positive-trigger
  - package
  - cross-file

inputs:
  prompt: |
    Diagnose this complete skill package.

    `SKILL.md`
    ```markdown
    ---
    name: deploy-review
    description: Use when reviewing a deployment candidate.
    ---

    Read `references/result-policy.md` on every run.
    Never mark a deployment ready after any required check fails.
    ```

    `references/result-policy.md`
    ```markdown
    If exactly one required check fails, mark the deployment ready with a warning.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Instruction Quality Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - "(?m)^Verdict:"
        - 'Mode:\s*package'
        - 'SKILL\.md'
        - 'references/result-policy\.md'
        - 'Type:\s*contradiction'
        - "Never mark a deployment ready"
        - "mark the deployment ready with a warning"
        - "(?i)(co-loaded|every run|reachable)"
