# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-contract-partial-snippet-001

name: Partial no-finding snippet appears complete

description: The audit should detect a partial exceptional-case snippet that omits mandatory opening markers without saying so

tags:
  - positive-trigger
  - output-contract
  - partial-snippet

inputs:
  prompt: |
    Audit this output contract and example.
    
    ```markdown
    Every report must begin with:
    # Instruction Quality Audit
    Audit: <target>
    ## Audit Scope
    
    ## No-Finding Report
    
    Use:
    
    ## Findings
    None.
    ## Summary
    Errors: 0
    Verdict: No material defects
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Instruction Quality Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - '(?m)^Verdict:\s*Needs revision$'
        - 'Type:\s*output-contract'
        - "# Instruction Quality Audit"
        - "## Findings"
        - "(?i)(partial snippet|mistaken for a complete|omits|required opening)"
        - "Correction:"
      not_contains:
        - "# Agent/Skill Readiness Audit"
