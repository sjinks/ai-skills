# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-adapters-001

name: Mutually exclusive adapters do not create a false contradiction

description: Differences between explicitly exclusive runtime adapters should not be reported as contradictions.

tags:
  - positive-trigger
  - package
  - false-positive

inputs:
  prompt: |
    Audit this instruction package for defects.

    `SKILL.md`
    ```markdown
    Load exactly one adapter for the active runtime.
    ```

    `adapters/claude.md`
    ```markdown
    Use the Grep tool.
    ```

    `adapters/codex.md`
    ```markdown
    Use the repository search capability.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - "(?m)^Verdict:"
        - "(?m)^# Instruction Quality Audit$"
        - "Mutually exclusive paths:"
        - 'adapters/claude\.md'
        - 'adapters/codex\.md'
        - '(?m)^## Findings$\n\nNone\.\n\n^## Unresolved Questions$'
        - '(?m)^Verdict:\s*No material defects$'
      not_contains:
        - "Type: contradiction"
        - "Use the Grep tool. conflicts"
