# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-blocked-001

name: Unreadable target is blocked rather than misdiagnosed

description: Input failure must not be classified as missing error handling in the target.

tags:
  - positive-trigger
  - blocked-input

inputs:
  prompt: |
    Audit the instruction artifact at /tmp/missing-instruction-artifact.md.
    Ignore #prompt:SKILL.md because it is only prompt context.

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - "(?m)^Verdict:"
        - "(?m)^# Instruction Quality Audit$"
        - '(?m)^Audit:\s*/tmp/missing-instruction-artifact\.md'
        - 'Status:\s*blocked'
        - '(?m)^## Findings$\n\nNot assessed\.\n\n^## Unresolved Questions$'
        - 'Errors:\s*Not assessed\.'
        - 'Warnings:\s*Not assessed\.'
        - '(?m)^Verdict:\s*Blocked$'
      not_contains:
        - "Audit: #prompt:SKILL.md"
        - "Type: failure-handling"
        - "# Agent/Skill Readiness Audit"
