# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-closure-001

name: Reachable decision tree has no catch-all

description: The diagnostic should report an uncovered reachable case as closure.

tags:
  - positive-trigger
  - closure

inputs:
  prompt: |
    Audit this routing instruction for missing cases.

    ```markdown
    If the input is JSON, parse it with the JSON parser.
    If the input is YAML, parse it with the YAML parser.
    Return the parsed object.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Instruction Quality Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - "(?m)^Verdict:"
        - 'Type:\s*closure'
        - "input is JSON"
        - "input is YAML"
        - "(?i)(otherwise|other format|neither|catch-all|uncovered)"
        - "Correction:"
