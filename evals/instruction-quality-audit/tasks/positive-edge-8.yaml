# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-output-contract-001

name: Repository eval contract requires stable labels

description: The diagnostic should identify prose-only output wording that cannot align with required marker checks.

tags:
  - positive-trigger
  - output-contract
  - eval-alignment

inputs:
  prompt: |
    Audit this skill and its eval contract.

    `SKILL.md`
    ```markdown
    ## Output
    Return the finished artifact, assumptions, adapters, and compatibility
    limitations in a clear response.
    ```

    `eval.yaml`
    ```yaml
    task_completion:
      regex_match:
        - '(?m)^## Cross-Model Instruction Artifact$'
        - '(?m)^## Cross-Model Authoring Notes$'
    ```

    Negative tasks forbid those two exact headings.

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Instruction Quality Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - "(?m)^Verdict:"
        - 'Type:\s*output-contract'
        - "Cross-Model Instruction Artifact"
        - "Cross-Model Authoring Notes"
        - "(?i)(prose-only|stable label|marker|regex|mismatch)"
        - "Correction:"
