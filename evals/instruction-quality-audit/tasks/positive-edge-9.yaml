# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: positive-precedence-001

name: Missing precedence between co-applicable rules

description: The diagnostic should distinguish a precedence gap from a direct contradiction.

tags:
  - positive-trigger
  - precedence

inputs:
  prompt: |
    Find instruction defects in this policy.

    ```markdown
    For security incidents, notify the security lead.
    For incidents affecting more than 1,000 users, notify the incident commander.
    Send only one notification.
    ```

expected:
  should_trigger: true

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: positive
      threshold: 0.45

  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - instruction-quality-audit
      mode: any_order

  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?m)^# Instruction Quality Audit$"
        - "(?m)^Audit:"
        - "(?m)^## Audit Scope$"
        - "(?m)^## Findings$"
        - "(?m)^## Unresolved Questions$"
        - "(?m)^## Summary$"
        - "(?m)^Verdict:"
        - 'Type:\s*precedence'
        - "security incidents"
        - "more than 1,000 users"
        - "(?i)(both apply|tiebreaker|ordering|which governs)"
        - "Correction:"
