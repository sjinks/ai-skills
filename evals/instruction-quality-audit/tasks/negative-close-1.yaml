# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json

id: negative-close-001

name: Holistic readiness and model certification request

description: A ratings-and-readiness request belongs to agent-skill-audit.

tags:
  - negative-trigger
  - close-domain
  - overlap-disambiguation

inputs:
  prompt: |
    Assess this skill for production readiness. Rate discovery, architecture,
    operational completeness, model portability across GPT-5.4 mini through
    Fable 5, and maintainability. Give a final readiness verdict and top five
    changes.

expected:
  should_trigger: false

graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/instruction-quality-audit/SKILL.md
      mode: negative
      threshold: 0.45

  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Instruction Quality Audit"
        - "Audit:"
        - "## Audit Scope"
        - "## Findings"
        - "## Unresolved Questions"
        - "## Summary"
        - "Verdict:"
