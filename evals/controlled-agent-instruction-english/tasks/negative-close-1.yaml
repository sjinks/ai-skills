# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-1
name: Ordinary prose editing
description: Ordinary prose editing
tags:
- negative-close
inputs:
  prompt: |-
    Make this customer-facing newsletter paragraph warmer and shorter: Our autumn workshop starts at ten. Bring a notebook and enjoy coffee with the team. This is ordinary marketing copy for people to read.
    Answer using the supplied scenario only. Do not inspect or modify workspace files.
expected:
  should_trigger: false
graders:
- type: trigger
  name: trigger_accuracy
  config:
    skill_path: skills/controlled-agent-instruction-english/SKILL.md
    mode: negative
    threshold: 0.45
- type: text
  name: task_completion
  config:
    not_contains:
    - 'CAIE mode:'
    - 'CAIE artifact:'
    - 'CAIE findings:'
    - 'CAIE status:'
    - controlled-agent-instruction-english
