# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-4
name: Combined audit and rewrite preserves source findings
description: Combined audit and rewrite preserves mandatory-modality diagnosis alongside the corrected artifact.
tags:
- positive-edge
inputs:
  prompt: 'Audit and rewrite these agent instructions. Testing is mandatory, and publication is permitted only after successful testing. Supplied snippet line 1: "You should run the tests before publishing." Report the meaningful source defect with its evidence and correction, then return the complete corrected instructions. Do not make testing optional. Answer from this scenario only; do not inspect or modify scenario workspace files. You may read the invoked skill and its bundled references.'
expected:
  should_trigger: true
graders:
- type: trigger
  name: trigger_accuracy
  config:
    skill_path: skills/controlled-agent-instruction-english/SKILL.md
    mode: positive
    threshold: 0.45
- type: skill_invocation
  name: skill_invocation
  config:
    required_skills:
    - controlled-agent-instruction-english
    mode: any_order
- type: text
  name: task_completion
  config:
    regex_match:
    - '(?m)^CAIE mode: author$'
    - '(?m)^CAIE artifact:'
    - '(?m)^CAIE findings:'
    - '(?m)^CAIE status: Authored$'
    - '(?m)^- error \| N4 \| supplied snippet:1 \|'
- type: program
  name: report_contract
  config:
    command: python3
    args:
    - evals/controlled-agent-instruction-english/check-report.py
    - author-findings
    timeout: 30
- type: prompt
  name: task_completion_substance
  config:
    prompt: Call set_waza_grade_pass only if the artifact makes testing mandatory and permits publication only after successful testing, and the source finding has severity error, cites supplied snippet:1 and N4, quotes or identifies "should", explains optionality, and supplies a mandatory correction. Reject findings None, optional testing, lost diagnosis, or contradictory instructions. Otherwise call set_waza_grade_fail. Make exactly one grading tool call, set_waza_grade_pass when every criterion holds, otherwise set_waza_grade_fail. Put the reasoning in the tool call's reason argument; do not return a numeric grade as response text.
    mode: independent
