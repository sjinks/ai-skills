# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-1
name: Unrelated arithmetic
description: Unrelated arithmetic
tags:
- negative-trigger
inputs:
  prompt: |-
    A puzzle box holds 43 amber beads and 29 violet beads. How many beads are in the box altogether? Show the addition.
    Answer using the supplied scenario only. Do not inspect or modify workspace files.
expected:
  should_trigger: false
graders:
- type: trigger
  name: trigger_accuracy
  config:
    skill_path: skills/controlled-agent-instruction-english/SKILL.md
    mode: negative
    threshold: 0.45
- type: text
  name: task_completion
  config:
    not_contains:
    - 'CAIE mode:'
    - 'CAIE artifact:'
    - 'CAIE findings:'
    - 'CAIE status:'
    - controlled-agent-instruction-english
