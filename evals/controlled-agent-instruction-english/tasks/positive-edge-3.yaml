# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-3
name: Missing audit input
description: Missing audit input
tags:
- positive-edge
inputs:
  prompt: |-
    Audit the agent instructions for ambiguous modality, scope, precedence, and termination. I have not supplied any instruction text or a readable file path. Report the input needed to perform the audit.
    Answer using the supplied scenario only. Do not inspect or modify scenario workspace files. You may read the invoked skill and its bundled references.
expected:
  should_trigger: true
graders:
- type: trigger
  name: trigger_accuracy
  config:
    skill_path: skills/controlled-agent-instruction-english/SKILL.md
    mode: positive
    threshold: 0.45
- type: skill_invocation
  name: skill_invocation
  config:
    required_skills:
    - controlled-agent-instruction-english
    mode: any_order
- type: text
  name: task_completion
  config:
    regex_match:
    - '(?m)^CAIE mode:'
    - '(?m)^CAIE artifact:'
    - '(?m)^CAIE findings:'
    - '(?m)^CAIE status:'
    - '(?m)^CAIE mode: blocked$'
    - '(?m)^CAIE artifact: None\.$'
    - '(?m)^CAIE findings: None\.$'
    - '(?m)^CAIE status: Blocked; Missing: .*(instruction|text|artifact)'
- type: program
  name: report_contract
  config:
    command: python3
    args:
    - evals/controlled-agent-instruction-english/check-report.py
    - blocked
    timeout: 30
