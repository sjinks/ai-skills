# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: unicode-text-security-review-eval
description: |
  Evaluates the unicode-text-security-review skill: it activates for
  security-sensitive Unicode text handling, strict UTF-8 decoding,
  normalization, parser-consumer drift, identifier spoofing, and storage/index
  equivalence risks; stays silent on ordinary Unicode display or troubleshooting
  questions; and emits the skill's required structured output.
skill: unicode-text-security-review
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output applies the Unicode text security contract, findings, checklist status, adversarial tests, and residual risk guidance.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 12000
tasks:
  - "tasks/*.yaml"