# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: single-pass-review-completeness-eval
description: |
  Evaluates the single-pass-review-completeness skill: it activates on
  complete-single-round review structuring, stays silent on merge gates and
  fix implementation, and produces the single-pass report with the
  eight-dimension coverage declaration and verdict labels.
skill: single-pass-review-completeness
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the single-pass report, full coverage declaration, dimension-tagged findings, and verdict labels.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
