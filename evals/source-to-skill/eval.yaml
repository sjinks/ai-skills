# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: source-to-skill-eval
description: |
  Evaluates the source-to-skill skill: it activates for converting source
  material into reusable agent skills, analyze-only review, extract-only source
  conversion, URL-source limitations, and update-existing workflows; stays
  silent on plain summaries or direct skill-editing requests; and preserves the
  documented destination, helper-resolution, provenance, validation, and
  public-contract rules.
skill: source-to-skill
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.25
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.35
    threshold: 0.8
    description: Output carries the source-to-skill mode, destination, extraction, provenance, validation, and preservation contract.
  - name: task_completion_substance
    weight: 0.10
    threshold: 0.7
    description: LLM judge verifies representative positive tasks satisfy the mode-specific source-to-skill substance contract.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 12
      max_tokens: 12000
tasks:
  - "tasks/*.yaml"