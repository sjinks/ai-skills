# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-009
name: Profile recommendation rejects name-only adaptation
description: |
  A new target model with no behavioral evidence needs a task-derived profile
  and an evidence plan, not a family-specific patch inferred from its name.
tags:
  - positive-trigger
  - positive-edge
  - model-portability
inputs:
  prompt: |
    Recommend a cross-model instruction profile for a newly deployed
    code-specialized model. The task is to make bounded repository changes with
    explicit scope, verification, and a definition of done. We have no model
    evaluation results, provider guidance, or observed failures.

    Do not write the instruction artifact. Return exactly these headings in
    order: `Profile recommendation:`, `Justified behavioral patches:`, and
    `Evidence still needed:`. Select the least-prescriptive suitable profile,
    apply no model-specific behavioral patch merely from the model name, and
    state the smallest evaluation needed before any patch is introduced.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cross-model-instruction-authoring/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cross-model-instruction-authoring
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?ms)^Profile recommendation:$.*?^Justified behavioral patches:$.*?^Evidence still needed:$'
        - '(?m)^- coding-agent$'
        - '(?i)(none|no model-specific patch|no patch)'
        - '(?i)(eval|evaluation|reproducible failure)'
        - '(?i)(scope|verification|definition of done)'
      not_contains:
        - 'Finished artifact:'
        - 'Material assumptions:'
        - 'Runtime adapter:'
        - 'Compatibility note:'
  - type: program
    name: profile_recommendation_contract
    config:
      command: python3
      args:
        - evals/cross-model-instruction-authoring/check-profile-recommendation.py
        - --expected-profile
        - coding-agent
        - --expected-no-patches
      timeout: 30
