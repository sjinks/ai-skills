# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-010
name: Evaluated failure justifies a narrow behavioral patch
description: |
  A reproducible model failure permits the smallest scoped behavioral patch;
  the recommendation must retain its evidence and removal condition.
tags:
  - positive-trigger
  - positive-edge
  - model-portability
inputs:
  prompt: |
    Recommend a cross-model instruction profile for a coding agent that makes
    bounded repository changes. In three reproducible evaluations using the
    same runtime and tool access, it returned after a failed required test
    without reporting the failure or attempting the specified fallback check.

    Do not write the instruction artifact. Return exactly `Profile
    recommendation:`, `Justified behavioral patches:`, and `Evidence still
    needed:` in order. Select the suitable profile and add only the narrow
    completion-persistence patch, citing EVAL_EVIDENCE, its scope, and a
    retest/removal condition. Do not add family-specific folklore.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cross-model-instruction-authoring/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cross-model-instruction-authoring
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?ms)^Profile recommendation:$.*?^Justified behavioral patches:$.*?^Evidence still needed:$'
        - '(?i)coding-agent'
        - '(?i)completion-persistence'
        - '(?i)EVAL_EVIDENCE'
        - '(?i)(scope|bounded repository changes|failed required test)'
        - '(?i)(retest|remove|removal|stops reproducing)'
      not_contains:
        - 'Finished artifact:'
        - 'Material assumptions:'
        - 'Runtime adapter:'
        - 'Compatibility note:'
  - type: program
    name: profile_recommendation_contract
    config:
      command: python3
      args:
        - evals/cross-model-instruction-authoring/check-profile-recommendation.py
        - --expected-profile
        - coding-agent
      timeout: 30
