# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-011
name: Non-reproducing patch is removed
description: |
  A model-specific behavioral patch is removed when the cited failure no
  longer reproduces; a target name alone cannot retain it.
tags:
  - positive-trigger
  - positive-edge
  - model-portability
inputs:
  prompt: |
    Recommend a cross-model instruction profile for a coding agent that makes
    bounded repository changes. A previous completion-persistence patch was
    added after a tool failure, but the same evaluation has now passed across
    the supported runtime settings without reproducing that failure.

    Do not write the instruction artifact. Return exactly `Profile
    recommendation:`, `Justified behavioral patches:`, and `Evidence still
    needed:` in order. Select the suitable profile, remove the stale patch,
    and state the smallest ongoing evaluation needed to detect regression.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cross-model-instruction-authoring/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cross-model-instruction-authoring
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?ms)^Profile recommendation:$.*?^Justified behavioral patches:$.*?^Evidence still needed:$'
        - '(?i)coding-agent'
        - '(?i)(none|no patch|remove.*completion-persistence|completion-persistence.*remove)'
        - '(?i)(retest|evaluation|regression|reproduce)'
      not_contains:
        - 'Finished artifact:'
        - 'Material assumptions:'
        - 'Runtime adapter:'
        - 'Compatibility note:'
  - type: program
    name: profile_recommendation_contract
    config:
      command: python3
      args:
        - evals/cross-model-instruction-authoring/check-profile-recommendation.py
        - --expected-profile
        - coding-agent
        - --expected-no-patches
      timeout: 30
