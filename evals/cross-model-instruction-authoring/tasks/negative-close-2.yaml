# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Single-model prompt tuning only
description: |
  A prompt that explicitly excludes portability and cross-model adaptation
  should not activate the skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    I only need instructions for GPT-5.5. Do not make this portable to other
    models, and do not add runtime adapters or compatibility notes.

    I want a model-specific prompt tuned just for one runtime.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cross-model-instruction-authoring/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Finished artifact:"
        - "Material assumptions:"
        - "Runtime adapter:"
        - "Compatibility note:"