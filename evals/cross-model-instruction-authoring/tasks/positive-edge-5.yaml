# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Unclear requirements decision policy
description: |
  A universal implementation skill should replace vague judgment language with
  an explicit ask-versus-assume policy and safe reversible defaults.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Create a universal implementation skill. When requirements are unclear,
    it should use its judgment.

    Return a finished skill that replaces the vague instruction with an
    explicit ask-versus-assume decision policy and safe reversible defaults.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cross-model-instruction-authoring/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cross-model-instruction-authoring
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)(ask-versus-assume|safe reversible defaults|explicit decision policy|material assumptions)"
        - "(?i)(Required outcomes|Invariants|Default workflow|Completion criteria)"
        - "(?i)Material assumptions"