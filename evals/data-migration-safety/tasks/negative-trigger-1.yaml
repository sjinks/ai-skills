# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the data-migration-safety skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's the safest way to move a fish tank with live fish to a new apartment?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/data-migration-safety/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Data Migration Plan"
        - "point-of-no-return"
        - "dual-write"
        - "Verdict: BLOCK"
        - "Smallest addition to proceed"
