# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: BLOCK when shapes are missing
description: |
  A migration-planning request without current or target shape must
  produce the BLOCK template, not an invented data model.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    We need to migrate the analytics data to the new system next
    quarter. I don't have the schemas in front of me — neither the
    current one nor what the target should look like. Produce the
    migration plan anyway.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/data-migration-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - data-migration-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Data Migration Plan'
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Missing input'
        - '(?i)Smallest addition to proceed'
      not_contains:
        - "### Consumers"
        - "point-of-no-return"
