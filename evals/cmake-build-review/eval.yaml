# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: cmake-build-review-eval
description: |
  Evaluates the cmake-build-review skill: it activates for target-based
  CMake review, visibility propagation, dependency policy, install/export
  correctness, and configuration hygiene; stays silent on C++ source review
  and CI pipeline structure; and emits the skill's verdict, project shape,
  findings, checklist status, and residual risk.
skill: cmake-build-review
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output applies target/visibility/dependency/export analysis with severity/verdict mapping and verification expectations.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required build-correctness judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 12000
tasks:
  - "tasks/*.yaml"
