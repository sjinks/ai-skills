# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic photography question
description: Unrelated everyday question must not activate the CMake skill.
tags:
  - negative-trigger
inputs:
  prompt: "What aperture should I use for portraits with a blurry background?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cmake-build-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Project shape:"
        - "Dependency policy:"
        - "Checklist status:"
