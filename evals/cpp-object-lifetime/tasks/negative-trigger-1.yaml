# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic gardening request
description: Unrelated everyday question must not activate the lifetime skill.
tags:
  - negative-trigger
inputs:
  prompt: "Which herbs grow well together in a small balcony planter box?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-object-lifetime/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Owners:"
        - "Borrowers:"
        - "Checklist status:"
        - "Verdict:"
        - "Findings:"
