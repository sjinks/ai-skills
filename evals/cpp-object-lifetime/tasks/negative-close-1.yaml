# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Coroutine frame lifetime question
description: |
  Coroutine frame/promise lifetime is explicitly out of scope; the skill must
  not activate on a coroutine mechanics question.
tags:
  - negative-close
inputs:
  prompt: |
    My C++20 coroutine crashes: the task's coroutine_handle is destroyed in
    final_suspend while a continuation still resumes it. How should
    promise_type and final_suspend be structured so the frame isn't destroyed
    early?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-object-lifetime/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Owners:"
        - "Borrowers:"
        - "Checklist status:"
        - "Verdict:"
        - "Findings:"
