# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: review-cycle-gatekeeper-eval
description: |
  Evaluates the review-cycle-gatekeeper skill: it activates on merge-gate /
  fix-cycle / waiver-validation prompts, stays silent on initial review
  requests (those belong to adversarial-review or domain review skills),
  is actually invoked when expected (and not when not), and emits the
  skill's required gate output (decision, findings matrix, blockers).
skill: review-cycle-gatekeeper
version: "1.1"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the gate decision contract and applies severity-aware closure rules.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
