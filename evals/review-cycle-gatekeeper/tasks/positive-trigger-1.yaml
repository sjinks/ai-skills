# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Merge-gate decision after fix cycle
description: |
  Reviewer findings + fix summary + verification — the canonical case for the
  gatekeeper to declare pass/fail/BLOCK.
tags:
  - positive-trigger
inputs:
  prompt: |
    Decide go/no-go for merge using the review-cycle-gatekeeper.

    Findings from round 1:
    - F-001 (High): Missing tenant ACL check on `/exports/:id`.
    - F-002 (Medium): N+1 query in `OrdersService.listForUser`.
    - F-003 (Low): Inconsistent error envelope on 4xx responses.

    Fix cycle:
    - F-001 marked fixed by commit `a1b2c3d` adding a guard; no new tests.
    - F-002 marked owned-with-remediation-plan by @alice, target 2026-06-15,
      issue #142.
    - F-003 not addressed.

    Unresolved threads: none.

    Apply the gate rules and return a pass / fail / BLOCK decision with the
    findings matrix and blockers to clear.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/review-cycle-gatekeeper/SKILL.md
      mode: positive
      threshold: 0.4
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - review-cycle-gatekeeper
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)Gate decision:\\s*(pass|fail|BLOCK)"
        - "(?i)Findings matrix:"
        - "(?i)Blockers to clear:"
        - "(?i)(F-001.*(no\\s+test|insufficient\\s+verification|missing\\s+test\\s+evidence)|reopen\\s+F-001|Gate\\s+Rule\\s+4)"
      not_contains:
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response:
        - Reaches Gate decision FAIL (or BLOCK).
        - Reports F-001 as state `fixed` BUT flags it as failing Gate Rule 4
          (no test evidence), so the gate cannot pass on F-001 either.
        - Reports F-002 as `owned-with-remediation-plan` and accepts it for
          Medium severity per Gate Rule 2.
        - Reports F-003 as `open` and correctly says Low severity does not
          block per Gate Rule 3.
        - Lists at least one concrete blocker to clear (F-001 verification
          evidence).

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or hedges substantially.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent
