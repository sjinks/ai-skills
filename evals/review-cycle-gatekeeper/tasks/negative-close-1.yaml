# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Initial code review request
description: |
  An initial code-review request (no fix cycle, no findings list, no
  verification evidence) is not a gatekeeper task; it belongs to an upstream
  review skill. The gatekeeper should stay silent.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Please review this small TypeScript helper for any issues:

    ```ts
    export function clamp(value: number, min: number, max: number): number {
      return Math.max(min, Math.min(max, value));
    }
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/review-cycle-gatekeeper/SKILL.md
      mode: negative
      threshold: 0.4
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Gate decision:"
        - "Findings matrix:"
        - "Blockers to clear:"
        - "owned-with-remediation-plan"
        - "waived-with-rationale"
