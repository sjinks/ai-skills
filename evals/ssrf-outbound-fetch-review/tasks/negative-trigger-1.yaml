# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic workout request
description: Unrelated everyday question must not activate the SSRF review skill.
tags:
  - negative-trigger
inputs:
  prompt: "Suggest a 20-minute upper-body workout I can do at home with no equipment."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/ssrf-outbound-fetch-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Findings:"
        - "Egress policy:"
        - "Adversarial tests:"
        - "Checklist status:"
