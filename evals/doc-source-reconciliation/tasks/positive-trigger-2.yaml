# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: README "excluded" dependency is now used by an example
description: |
  A README claims a dependency is excluded/absent; the example manifest shows it
  is now linked. Re-check the absent claim instead of preserving it.
tags:
  - positive-trigger
inputs:
  prompt: |
    This README section says it "reflects the current build". Confirm it against
    the manifests below before we publish it.

    README says:
    > OpenSSL is intentionally excluded; the library has no TLS dependency.

    Actual `examples/tls_echo/CMakeLists.txt`:
    ```cmake
    add_executable(tls_echo main.cpp)
    target_link_libraries(tls_echo PRIVATE httpx OpenSSL::SSL OpenSSL::Crypto)
    ```

    Answer from this scenario only. Tell us whether the "excluded" claim still
    holds and what to correct.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/doc-source-reconciliation/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - doc-source-reconciliation
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)(excluded|absent|no .{0,10}dependency).{0,60}(stale|wrong|no longer|incorrect|outdated|not true)'
        - '(?i)OpenSSL|TLS'
        - '(?i)(example|tls_echo).{0,40}(link|use|depend|pull)'
        - '(?i)(re-?check|reconfirm|verify|confirm).{0,30}(absent|excluded|still)'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response re-checks the "excluded" claim:
        - It flags that "OpenSSL is excluded / no TLS dependency" is now stale,
          because the tls_echo example links OpenSSL::SSL and OpenSSL::Crypto.
        - It cites the example's CMakeLists as evidence.
        - It does not preserve the "excluded/absent" claim as still true.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).
