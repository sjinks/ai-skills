# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: negative-close-002
name: Fastify handler review
description: |
  Plain Fastify handler — Node web framework but not NestJS. Review skill should not activate.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Anything wrong with this Fastify handler?

    ```ts
    app.get('/users/:id', async (req, reply) => {
      const user = await db.users.findById(req.params.id);
      if (!user) reply.code(404).send({ error: 'not found' });
      return user;
    });
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/nestjs-code-review/SKILL.md
      mode: negative
      threshold: 0.5
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Critical (must fix)"
        - "Warnings (should fix)"
        - "Suggestions (consider improving)"
        - "Severity: Critical"
        - "Severity: Warning"
        - "## Critical"
        - "## Warning"
        - "## Suggestion"
        - "ValidationPipe"
        - "JwtAuthGuard"
