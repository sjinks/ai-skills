# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: positive-trigger-002
name: NestJS module and DI review
description: |
  Module wiring, exports, providers, forwardRef, and DI scope review — the
  Module Architecture and DI surface of the skill checklist.
tags:
  - positive-trigger
inputs:
  prompt: |
    Code review for this NestJS feature module. We use Nest 10 with Prisma.

    ```ts
    @Module({
      imports: [forwardRef(() => OrdersModule), forwardRef(() => UsersModule)],
      controllers: [BillingController],
      providers: [
        BillingService,
        { provide: 'PAYMENT_GATEWAY', useValue: new StripeGateway('sk_live_...') },
      ],
      exports: [BillingModule],
    })
    export class BillingModule {}
    ```

    Report findings classified Critical / Warning / Suggestion with file and
    line evidence and a concrete fix per finding.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/nestjs-code-review/SKILL.md
      mode: positive
      threshold: 0.5
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - nestjs-code-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)Critical"
        - "(?i)(Warning|Suggestion)"
        - "(?i)(module\\s+(re-?)?exports?\\s+itself|exports\\s+self|self-?export|circular\\s+module|forwardRef\\s+(overuse|smell|anti-?pattern|design)|provider\\s+token)"
        - "(?i)(hardcoded\\s+secret|secret\\s+in\\s+source|move\\s+to\\s+ConfigService|read\\s+from\\s+environment|env(ironment)?\\s+variable)"
      not_contains:
        - "Lenses applied:"
        - "Gate decision:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
