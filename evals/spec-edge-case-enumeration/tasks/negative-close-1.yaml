# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Hunting missed edge cases in code is not spec enumeration
description: |
  A request to find edge cases a finished implementation fails to handle
  is code review, not spec-stage enumeration, and must not activate the
  skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Find the edge cases this implementation misses:

    ```javascript
    function paginate(items, page, perPage) {
      const start = page * perPage;
      return items.slice(start, start + perPage);
    }
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/spec-edge-case-enumeration/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Smallest addition to proceed"
        - "Verdict: BLOCK"
        - "Edge Case Enumeration Report"
        - "spec-decision"
        - "Spec decisions needed"
