# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Flag deep surfaces without performing the deep review
description: |
  A case that opens a specialized surface (security-sensitive filename
  handling) must be flagged for deep review with the surface named, not
  expanded into the deep review itself.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Enumerate edge cases for this spec.

    Feature: users upload attachments to tickets. The original filename
    is preserved, shown in the UI, and used when other agents download
    the file. Attachments are scanned and stored in object storage.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/spec-edge-case-enumeration/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - spec-edge-case-enumeration
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Edge Case Enumeration Report'
        - '(?i)flag-for-deep-review'
        - '(?i)Flagged for deep review'
        - '(?i)(filename|file name|unicode|path|injection|sanitiz)'
      not_contains:
        - "Unicode Text Security Review Report"
