# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: filesystem-path-safety-eval
description: |
  Evaluates the filesystem-path-safety skill: it activates when code builds
  filesystem paths from external input and then reads, creates, mutates, or
  deletes files under a trusted root, stays silent on path-handling
  questions that lack an external-input surface or that fall outside path
  safety (such as archive-entry traversal), is actually invoked when
  expected (and not when not), and emits the skill's required structured
  output (verdict, trusted root, external-input surface, operation kind,
  findings, checklist evidence, coverage summary, cross-cutting
  recommendations, residual risk) — including the insufficient-context
  template when required context is missing.
skill: filesystem-path-safety
version: "1.1"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the filesystem-path-safety review contract and identifies the specific path-safety risks the prompt asks about.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 12000
tasks:
  - "tasks/*.yaml"
