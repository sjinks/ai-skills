# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic hiking recommendation
description: Unrelated everyday question must not activate the filesystem-path-safety review skill.
tags:
  - negative-trigger
inputs:
  prompt: "Recommend three weekend hiking trails near the Cascade foothills for someone with moderate fitness."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/filesystem-path-safety/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Findings:"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Trusted root:"
        - "External-input surface:"
        - "Coverage summary:"
