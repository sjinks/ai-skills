# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-003
name: Quick output depth for path safety
description: |
  The quick output-depth control should focus on blockers and concerns for a
  concrete path-safety target.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use filesystem-path-safety in quick mode for this target. Only report
    target-specific blockers and concerns.

    ```ts
    import { rmSync } from 'node:fs';
    import { join } from 'node:path';
    export function deleteTenantFile(root: string, tenant: string, name: string) {
      rmSync(join(root, tenant, name));
    }
    ```

    Trusted root: `root`. External-input surface: `tenant` and `name` from an
    HTTP request. Operation kind: delete.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/filesystem-path-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - filesystem-path-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)Verdict:\\s*BLOCK"
        - "(?i)(quick|target-specific|blockers|concerns)"
        - "(?i)(containment|trusted root|symlink|re-validat|delete)"
      not_contains:
        - "Egress policy:"
        - "Adversarial tests:"
        - "PLAN-READY"