# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: perf-measurement-eval
description: |
  Evaluates the perf-measurement skill: it activates for empirical server/hot-path
  performance methodology - choosing a noise-resistant metric for the change size,
  counting allocations directly, isolating layer cost with control servers,
  profiling and bucketing under load, and changing one thing then re-measuring;
  stays silent on the source-level transformation itself, framework-internal
  mechanics, and correctness/lifetime review; and produces a measurement plan with
  the metric, tool, conditions, and keep/revert decision tied to a number.
skill: perf-measurement
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output picks a metric matched to the change size, isolates cost, and ties the keep/revert decision to a number.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required measure-not-guess methodology judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
