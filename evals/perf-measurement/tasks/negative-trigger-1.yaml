# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic recipe question
description: Unrelated everyday question must not activate the perf-measurement skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's a good substitute for buttermilk when baking pancakes?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/perf-measurement/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "LD_PRELOAD"
        - "mallocount"
        - "reference server"
        - "Metric:"
        - "Decision:"
        - "Hypothesis:"
