# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: test-quality-review-eval
description: |
  Evaluates the test-quality-review skill: it activates for auditing or writing
  an individual test (not a test plan) for whether it can fail for one
  behavioral reason, targets observable behavior over incidental detail, is
  deterministic and isolated, and covers the negative/boundary paths it claims;
  stays silent on choosing what to test, framework mechanics, and diagnosing an
  already-flaky CI test; and produces a per-test solid/weak/cannot-fail verdict
  with checklist-keyed findings and concrete rewrites.
skill: test-quality-review
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output applies the quality checklist, the would-it-fail question, and a per-test verdict with concrete fixes.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required can-it-fail / behavioral-focus judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
