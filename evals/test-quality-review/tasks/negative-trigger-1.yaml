# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic coffee question
description: Unrelated everyday question must not activate the test-quality-review skill.
tags:
  - negative-trigger
inputs:
  prompt: "How should I arrange a small spice rack so I can find jars quickly?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-quality-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "cannot-fail"
        - "solid"
        - "weak"
        - "quality checklist"
        - "per-test verdict"
        - "tautology"
