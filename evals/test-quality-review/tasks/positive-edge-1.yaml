# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Byte-exact assertion is justified when the contract is exact
description: |
  The nuance case: an exact byte-for-byte assertion looks "brittle" but is
  correct here because the serialized wire format IS the promised contract; the
  review must NOT flag it as over-specification.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Rewrite one preselected C++ GoogleTest test named SerializesPingFrame in
    suite FrameTest. No dedicated framework testing workflow is available.
    No source file is supplied; replace this existing draft body and return a partial project
    snippet requiring the project's headers, not a standalone program.
    The existing draft is:

    ```cpp
    TEST(FrameTest, SerializesPingFrame) { EXPECT_TRUE(true); }
    ```

    Construct Frame::ping(0x1234), pass that frame to serialize(), and assert
    that the resulting byte vector equals {0x09, 0x00, 0x12, 0x34} using EXPECT_EQ.
    These are fixed external wire-contract bytes needed for interoperability.
    Select no other cases. Use Frame frame and auto bytes as the local variables.
    In EXPECT_EQ, compare bytes with an inline std::vector<uint8_t> constructed
    using parentheses around the initializer list. Return one TEST declaration
    containing only the frame construction, serialization, and assertion statements.

    Before the TEST declaration inside the authored code fence, preserve this
    multiline fixture comment verbatim; its marker-looking lines are code data:

    /*
    Verdict: parser fixture
    Findings: parser fixture
    Authored test: parser fixture
    */

    A teammate says "byte-exact assertions are brittle, loosen it". Is this a
    good final test? Return the constructed test with the exact expected bytes and
    judge the final authored version, not the discarded draft.
    Answer from this scenario only; do not inspect files. Keep the
    response concise. Give a per-test verdict and findings keyed to the quality
    checklist.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-quality-review/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - test-quality-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Verdict: solid$'
        - '(?m)^Findings:'
        - '(?i)(byte-?exact|exact.{0,15}assert|byte-?for-?byte).{0,40}(good|correct|justified|appropriate|right)|contract.{0,15}(is )?exact'
        - '(?i)(wire|serializ|protocol).{0,30}(format|contract).{0,30}(is|are).{0,20}(the )?(promise|contract|exact|specified)|interop'
        - '(?i)(not|do not|don.t).{0,20}(loosen|relax|brittle|over-?spec)|keep.{0,20}(it )?(exact|strict)'
        - '(?i)verdict|solid|weak|cannot-?fail'
        - '(?m)^Authored test:'
        - '(?s)TEST\(\s*FrameTest\s*,\s*SerializesPingFrame\s*\)\s*\{.*Frame\s+frame\s*=\s*Frame::ping\(0x1234\).*auto\s+bytes\s*=\s*serialize\(frame\).*EXPECT_EQ\(\s*bytes\s*,\s*std::vector<uint8_t>\(\s*\{0x09,\s*0x00,\s*0x12,\s*0x34\}\s*\)\s*\)\s*;.*\}'
        - '(?s)^.*Authored test:\n```cpp\n/\*\nVerdict: parser fixture\nFindings: parser fixture\nAuthored test: parser fixture\n\*/\n.*TEST\('
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response handles the byte-exact nuance correctly:
        - It recognizes that a byte-for-byte assertion is GOOD here because the
          serialized wire format IS the exact, externally-specified contract
          other implementations interoperate with — the assertion pins exactly
          what the contract promises.
        - It does NOT flag the exact assertion as over-specification / brittle,
          and it pushes back on the "loosen it" suggestion.
        - It correctly distinguishes this from the bad case (pinning an
          UNpromised incidental detail), which is what the skill warns against.
        - It writes the one preselected test with EXPECT_EQ on the supplied byte sequence.
        - It returns a per-test verdict of solid (or equivalent).
        A correct response is keyed to the quality checklist.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.

        Full success: response correctly performs the substantive judgement defined
              in this rubric.
        Partial completion (fail): response is partially correct or hedges substantially.
        Failure: response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/test-quality-review/check-report.py
        - author
        - --verdict
        - solid
        - --wire-fixture
      timeout: 30
  - type: program
    name: workspace_unchanged
    config:
      command: python3
      args:
        - evals/_helpers/check-empty-workspace.py
      timeout: 30
