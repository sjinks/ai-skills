# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Byte-exact assertion is justified when the contract is exact
description: |
  The nuance case: an exact byte-for-byte assertion looks "brittle" but is
  correct here because the serialized wire format IS the promised contract; the
  review must NOT flag it as over-specification.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Review this C++ test for quality. `serialize()` produces the on-the-wire
    bytes of a protocol frame, and the wire format is a fixed, externally-specified
    contract that other implementations must interoperate with.

    ```cpp
    TEST(FrameTest, SerializesPingFrame) {
      Frame f = Frame::ping(0x1234);
      auto bytes = serialize(f);
      EXPECT_EQ(bytes, std::vector<uint8_t>({0x09, 0x00, 0x12, 0x34}));
    }
    ```

    A teammate says "byte-exact assertions are brittle, loosen it". Is this a
    good test? Answer from this scenario only; do not inspect files. Keep the
    response concise. Give a per-test verdict and findings keyed to the quality
    checklist.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-quality-review/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - test-quality-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)(byte-?exact|exact.{0,15}assert|byte-?for-?byte).{0,40}(good|correct|justified|appropriate|right)|contract.{0,15}(is )?exact'
        - '(?i)(wire|serializ|protocol).{0,30}(format|contract).{0,30}(is|are).{0,20}(the )?(promise|contract|exact|specified)|interop'
        - '(?i)(not|do not|don.t).{0,20}(loosen|relax|brittle|over-?spec)|keep.{0,20}(it )?(exact|strict)'
        - '(?i)verdict|solid|weak|cannot-?fail'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response handles the byte-exact nuance correctly:
        - It recognizes that a byte-for-byte assertion is GOOD here because the
          serialized wire format IS the exact, externally-specified contract
          other implementations interoperate with — the assertion pins exactly
          what the contract promises.
        - It does NOT flag the exact assertion as over-specification / brittle,
          and it pushes back on the "loosen it" suggestion.
        - It correctly distinguishes this from the bad case (pinning an
          UNpromised incidental detail), which is what the skill warns against.
        - It returns a per-test verdict of solid (or equivalent).
        A correct response is keyed to the quality checklist.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or hedges substantially.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent
