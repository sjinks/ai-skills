# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Diagnosing an already-flaky CI test
description: |
  Close-domain: root-causing why an existing test intermittently fails in CI is
  flake diagnosis, not auditing a test's assertion/behavioral quality. The skill
  must not activate.
tags:
  - negative-close
inputs:
  prompt: |
    One of our C++ tests intermittently fails on the CI runners but always passes
    on my laptop, maybe one run in ten. Help me force the intermittent CI failure
    to happen reliably — which repeat/shuffle/parallel run settings should I use
    to make it show up on demand so I can investigate it?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-quality-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "cannot-fail"
        - "solid"
        - "weak"
        - "quality checklist"
        - "per-test verdict"
        - "tautology"
