# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Missing expected behavior blocks isolated authoring
description: Authoring without a contract requests the missing expected result and emits no invented test.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Write one preselected test for assertion quality for normalize(value).
    I cannot provide its expected behavior, return value or error contract yet.
    Do not choose cases, infer semantics from the name, inspect files, or invent
    expected output. No source file or test body exists. State exactly which
    missing input is required and do not emit test code.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-quality-review/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - test-quality-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Verdict: insufficient-context$'
        - '(?im)^Findings: Missing: .*(contract|expected|behavior|result)'
      not_contains:
        - 'Authored test:'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/test-quality-review/check-report.py
        - missing
        - --verdict
        - insufficient-context
      timeout: 30
  - type: program
    name: workspace_unchanged
    config:
      command: python3
      args:
        - evals/_helpers/check-empty-workspace.py
      timeout: 30
