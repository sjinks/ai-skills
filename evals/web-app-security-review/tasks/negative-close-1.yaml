# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Generic code-quality review of a web utility
description: |
  Looks like code review and mentions web-ish data, but explicitly asks only
  for readability/style cleanup, not security review.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Please review this Express helper only for readability and code style. I
    am not asking for security analysis or threat modeling.

    ```ts
    export function pageNumber(req) {
      const raw = req.query.page || '1';
      const n = Number(raw);
      return Number.isFinite(n) && n > 0 ? n : 1;
    }
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/web-app-security-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
