# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic dinner planning request
description: Unrelated everyday request must not activate the web-app security review skill.
tags:
  - negative-trigger
inputs:
  prompt: "Plan a simple vegetarian dinner for four people using lentils, rice, and whatever vegetables are in the fridge."
expected:
  should_trigger: false
graders:
