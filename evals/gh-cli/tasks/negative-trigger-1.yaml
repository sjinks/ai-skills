# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic gardening question
description: Unrelated everyday question must not activate the gh-cli skill.
tags:
  - negative-trigger
inputs:
  prompt: "How often should I water a basil plant on a sunny windowsill?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/gh-cli/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "gh api"
        - "--raw-field"
        - "body=@-"
        - "GitHub CLI"
        - "/replies"
        - "--paginate"
