# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Query the API with pagination and jq
description: |
  Should activate and recommend --paginate and --jq for a list query that
  may exceed one page.
tags:
  - positive-trigger
inputs:
  prompt: |
    With `gh api`, how do I fetch all review comments on a pull request and
    print just the id, path, and body for each? My current command only
    seems to return some of them.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/gh-cli/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - gh-cli
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)--paginate'
        - '(?i)--jq|jq'
        - '(?i)gh api'
