# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Parallel-only flake from a shared fixed port
description: |
  Canonical flake diagnosis: a test that passes solo but fails under -j because
  it binds a fixed port; reproduce, classify, fix at the source, verify.
tags:
  - positive-trigger
inputs:
  prompt: |
    One of our C++ integration tests passes when run alone but fails
    intermittently when the suite runs with `ctest -j8`. It starts a test server
    on a hard-coded port 8080 and connects to it. The failure is "bind: address
    already in use" maybe one run in five under load.

    Answer from this scenario only; do not inspect files. Keep the response
    concise. Use these section labels exactly: Reproduce, Root cause, Fix,
    Verify.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/flaky-test-diagnosis/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - flaky-test-diagnosis
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)(-j|parallel|concurren).{0,40}(reproduce|repeat|force|raise|elevate)|repeat.{0,20}until.?fail|--repeat'
        - '(?i)(shared|fixed|hard-?coded).{0,20}port|port 0|ephemeral'
        - '(?i)(unique|ephemeral|port 0|per-?test).{0,30}(port|resource)'
        - '(?i)(not|never|do not|avoid).{0,20}(sleep|retry|disable)'
        - '(?i)(Reproduce|Root cause|Fix|Verify):'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response diagnoses the parallel-only flake correctly:
        - It reproduces deterministically by elevating the failure rate (run
          under high -j / repeat) rather than trusting one green run.
        - It classifies the root cause as a shared external resource (the
          hard-coded fixed port) that collides under parallelism.
        - The fix is a source-level fix: bind an ephemeral port (port 0) or a
          unique per-test resource — NOT a sleep, retry wrapper, or disabling.
        - It verifies by re-running under the same parallelism.
        A correct response uses the requested section labels.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or hedges substantially.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent
