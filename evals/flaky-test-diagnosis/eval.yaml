# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: flaky-test-diagnosis-eval
description: |
  Evaluates the flaky-test-diagnosis skill: it activates for non-deterministic
  test failures (flaky, order-dependent, parallel/sanitizer-only, CI-only),
  reproducing with elevated failure rate, classifying the root cause against the
  symptom-to-fix table, separating a test bug from a real code race/leak, and
  fixing at the source rather than by sleep/retry/disable; stays silent on
  authoring a brand-new test, judging a stable test's quality, and generic
  green-build feature work; and produces a reproduction, classified root cause,
  source-level fix, and post-fix verification.
skill: flaky-test-diagnosis
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output reproduces, classifies the root cause, gives a source-level fix, and names the post-fix verification.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required test-bug-vs-code-bug judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
