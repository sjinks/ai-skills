# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Insufficient context for standard-dependent rule
description: |
  A signal-handler question with no code and no language standard must
  produce the reduced BLOCK template without guessed execution context.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    We have a signal handler somewhere in our C or C++ codebase and I was told
    it might violate a CERT rule about what it's allowed to call. I can't paste
    the code or tell you the language standard we build with. What's the
    verdict?
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-cert/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cpp-cert
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Open question'
        - '(?i)(code|standard|context|language)'
        - '(?i)(unknown|missing|cannot|unavailable|not\s+(shared|provided|supplied|shown|available))'
      not_contains:
        - "Checklist status:"
        - "Execution context: signal"
