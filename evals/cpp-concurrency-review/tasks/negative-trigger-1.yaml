# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic travel question
description: Unrelated everyday question must not activate the concurrency skill.
tags:
  - negative-trigger
inputs:
  prompt: "What is the best month to see the northern lights in Tromsø?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-concurrency-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Shared state:"
        - "Thread topology:"
        - "Checklist status:"
