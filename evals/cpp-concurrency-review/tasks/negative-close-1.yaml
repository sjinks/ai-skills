# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Asio strand design question
description: |
  Executor/strand-based async I/O design is explicitly out of scope; the
  skill must not activate.
tags:
  - negative-close
inputs:
  prompt: |
    In Boost.Asio, should I serialize handler execution for one TCP session
    with a strand, or is binding all handlers to a single-threaded io_context
    enough? How do strands interact with co_spawn?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-concurrency-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Shared state:"
        - "Thread topology:"
        - "Checklist status:"
