# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Irrelevant section is omitted, not padded
description: |
  A genuinely irrelevant section must be omitted rather than filled with
  filler or N/A, even when a default structure lists it.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Draft a PR title and body with pr-description-quality. No repo
    template; use a sensible default structure.

    Change: fix a typo in the README installation heading. Documentation
    only — nothing to test, no runtime impact, no risks, no linked issue.
    Do not pad the body with empty or "N/A" sections.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/pr-description-quality/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - pr-description-quality
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)PR Description Quality Report'
        - '(?i)Structure:\s*default'
        - '(?im)^(docs|fix)(\(\w[\w-]*\))?:\s'
        - '(?i)(omit|no tests|documentation-only|not run)'
      not_contains:
        - "Commit Message Quality Report"
        - "N/A"
        - "Gate decision:"
