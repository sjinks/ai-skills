# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Harden an integration plan with stated SLOs
description: |
  An integration design with supplied SLOs is swept; timeouts and
  bounds are taken from or based on the supplied budgets, and unbounded
  retries are rejected.
tags:
  - positive-trigger
inputs:
  prompt: |
    We're integrating our search indexer with the product catalog
    service. Indexer pulls changed products every minute and writes to
    Elasticsearch. Catalog p99 is 300 ms with a 1 s SLO; ES bulk writes
    occasionally reject under load. Current plan says "retry until it
    works" — please design the actual failure behavior.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/failure-mode-design/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - failure-mode-design
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Failure Mode Design Report'
        - '(?is)(retry until it works|unbounded|infinite).{0,400}(finding|bound|reject|replace|instead)'
        - '(?i)(dead-letter|TTL|queue depth|bounded|backoff)'
        - '(?i)Signal'
      not_contains:
        - "Architecture Decision Record"
        - "Dependency Choice Review"
