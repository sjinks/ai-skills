# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the fix-blast-radius skill.
tags:
  - negative-trigger
inputs:
  prompt: "How do I keep cut basil fresh for a week without it turning black in the fridge?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/fix-blast-radius/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Fix Blast Radius Report"
        - "Impact trace"
        - "SAFE-TO-PUSH"
        - "VERIFY-FIRST"
        - "Regression cross-check"
