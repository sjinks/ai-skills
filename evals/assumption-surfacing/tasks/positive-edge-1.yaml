# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Structural damage forces verify-before-build
description: |
  An assumption whose failure is structural (schema/contract) must be
  classified verify-before-build by the tie-break rule even when the
  user calls it very likely.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Surface the assumptions in this plan. Note: we're 99% sure the events
    table has a unique constraint on (tenant_id, event_id) — it almost
    certainly does — so feel free to treat that as safe.

    Plan: deduplicate incoming webhook events by upserting on
    (tenant_id, event_id) and dropping rows older than 90 days. The
    dedup logic depends entirely on that unique constraint existing.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/assumption-surfacing/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - assumption-surfacing
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Assumption Surfacing Report'
        - '(?is)(unique constraint|tenant_id).{0,500}verify-before-build'
        - '(?i)Verification:'
      not_contains:
        - "Scope Boundary Report"
