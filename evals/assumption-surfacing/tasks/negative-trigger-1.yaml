# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the assumption-surfacing skill.
tags:
  - negative-trigger
inputs:
  prompt: "Explain the difference between sourdough starter and commercial yeast for home baking."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/assumption-surfacing/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Smallest addition to proceed"
        - "Verdict: BLOCK"
        - "Assumption Surfacing Report"
        - "verify-before-build"
        - "accept-with-risk"
        - "Earliest signal"
