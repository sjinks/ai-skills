# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic cooking question
description: Unrelated everyday question must not activate the API/ABI skill.
tags:
  - negative-trigger
inputs:
  prompt: "How long should I proof sourdough in a cold kitchen during winter?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-api-abi-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Compatibility promise:"
        - "Checklist status:"
