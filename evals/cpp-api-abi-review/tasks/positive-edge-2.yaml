# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Insufficient context without a compatibility promise
description: |
  An ABI question with no stated promise, distribution model, or header must
  produce the reduced BLOCK template.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    A teammate says renaming a parameter in one of our exported C++ functions
    is an ABI break. I can't paste the header and I'm not sure what
    compatibility we promise. Who is right?
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-api-abi-review/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cpp-api-abi-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Open question'
        - '(?i)(promise|header|distribution)'
        - '(?i)(unknown|missing|cannot|unavailable|unstated|not\s+(shared|provided|supplied|shown|available|stated))'
      not_contains:
        - "Checklist status:"
        - "Residual risk:"
