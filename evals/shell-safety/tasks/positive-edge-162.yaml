# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-162
name: Confirmed silent command redirects both streams
description: OR3 adds stderr suppression only on confirmed intent.
tags: [positive-edge]
inputs:
  prompt: |
    Review `noisy-check > /dev/null`. I confirm that both stdout and stderr must be
    silenced. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*OR3 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(stderr|error stream))(?=[^\n]*(visible|suppressed|silenced))(?=[^\n]*rewrite)[^\n]*$', '(?m)^Command:\s*noisy-check > /dev/null 2>&1\s*$', '(?mi)^Required checks:(?=[^\n]*(confirm|confirmed))(?=[^\n]*(both streams|stdout.*stderr))[^^\n]*$']
      not_contains: ['Result: SAFE', 'Command: noisy-check > /dev/null$', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether OR3 preserves stderr unless both streams are explicitly confirmed for suppression, then adds 2>&1. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
