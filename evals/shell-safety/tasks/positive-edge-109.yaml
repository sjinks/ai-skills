# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-109
name: Uncovered mutation preserves orthogonal matches
description: |
  Fail-closed mutation handling must not erase an independently matched record.
tags: [positive-edge]
inputs:
  prompt: |
    Review `cp -f $source destination.txt`. `$source` is confirmed to represent
    one non-secret path, but no loaded record classifies the external overwrite
    effect on the existing destination. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?m)^Result:\s*BLOCKED\s*$'
        - '(?m)^Matched patterns:\s*Q1 \(Command construction\)\s*$'
        - '(?mi)^Assessment:[^\n]*(overwrite|destination|mutation)[^\n]*(uncovered|no rule|no record)[^\n]*$'
        - '(?m)^Command:\s*Not provided\s*$'
        - '(?is)Required checks:.*(overwrite|copy|destination).*(rule|record|classification)'
      not_contains: ['Matched patterns: None', 'Result: SAFE', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the uncovered copy overwrite remains blocked while Q1 is
        retained as an independent match. Last line: 1.0, 0.5, or 0.0 only.
      mode: independent