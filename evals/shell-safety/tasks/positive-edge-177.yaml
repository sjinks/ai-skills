# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-177
name: Passphrase leaves argv
description: GP6 rewrites an argv passphrase to normal pinentry.
tags: [positive-edge]
inputs:
  prompt: |
    Review `gpg --passphrase <redacted> --decrypt file.gpg`. This is an interactive
    operation, so normal pinentry is available. Return every shell-safety field and
    do not disclose the passphrase.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?m)^Result:\s*REWRITE\s*$'
        - '(?m)^Matched patterns:\s*GP6 \(Host/repository\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*(passphrase|argv))(?=[^\n]*(process list|history|expos))[^\n]*$'
        - '(?m)^Command:\s*gpg --decrypt file\.gpg\s*$'
        - '(?m)^Required checks:\s*None\s*$'
      not_contains: ['Result: SAFE', '--passphrase', '<redacted>', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether GP6 rewrites the interactive decrypt to normal pinentry by removing the argv passphrase, identifies process-list/history exposure, and does not print the secret. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
