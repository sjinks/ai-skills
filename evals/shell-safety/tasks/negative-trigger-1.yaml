# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic cooking question
description: Unrelated everyday question must not activate the shell-safety skill.
tags:
  - negative-trigger
inputs:
  prompt: "How long should I rest a steak after grilling it medium-rare?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: negative_trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: negative_task_completion
    config:
      not_contains:
        - "Matched patterns:"
        - "Required checks:"
        - "Result: BLOCKED"
        - "Result: SAFE"
      regex_not_match:
        - '(?im)^[ \t]*(result|matched patterns|assessment|command|required checks):'