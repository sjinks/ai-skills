# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-012
name: SSH dynamic arguments lack argv boundary
description: |
  Appended SSH arguments must not be presented as an argv-safe rewrite.
tags:
  - positive-edge
inputs:
  prompt: |
    Is this a safe way to preserve a dynamic argument that may contain spaces,
    semicolons, and dollar signs?

    ```bash
    ssh host bash -s "$USER_VALUE" < local-script.sh
    ```

    No structured transport or remote decoder exists. Return every shell-safety
    output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Result:\s*BLOCKED'
        - '(?s)Matched patterns:.*(NS6/RX1) \(Remote delivery\)'
        - '(?i)Assessment:.*(remote|pars|argument|argv|structured)'
        - '(?i)Command:\s*Not provided'
        - '(?i)Required checks:.*(transport|encoding|decoder)'
      not_contains:
        - "Result: REWRITE"
        - "Verdict:"
        - "Checklist status:"