# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-077
name: Unquoted dollar-star preserves no boundaries
description: |
  Unquoted dollar-star is not the IFS-joined behavior of quoted dollar-star.
tags:
  - positive-edge
inputs:
  prompt: |
    Validate and rewrite this POSIX shell snippet so both original positional
    arguments remain intact:

    ```sh
    set -- 'a b' '*.txt'
    printf '<%s>\n' $*
    ```

    Return every shell-safety output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?mi)^Result:\s*REWRITE\s*$'
        - '(?mi)^Matched patterns:\s*Q5 \(Command construction\)\s*$'
        - '(?mi)^Assessment:[^\n]*each positional[^\n]*(separate|parameter)[^\n]*(word split|pathname|glob)[^\n]*(not|only)[^\n]*(join|IFS)[^\n]*$'
        - '(?m)^Command:\s*set -- ''a b'' ''\*\.txt''; printf ''<%s>\\n'' "\$@"\s*$'
        - '(?mi)^Required checks:\s*None\s*$'
      not_contains:
        - 'Command: printf ''<%s>\n'' "$*"'
        - 'Verdict:'
        - 'Checklist status:'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response explains that unquoted `$*` expands the
        positional parameters separately before further splitting/globbing and
        rewrites to quoted `"$@"` to preserve both boundaries.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the last line, write only: 1.0, 0.5, or 0.0

        1.0 = expansion semantics and quoted-dollar-at rewrite are exact.
        0.5 = rewrite is safe but the unquoted-dollar-star explanation is weak.
        0.0 = unquoted dollar-star is described as one IFS-joined string.
      mode: independent