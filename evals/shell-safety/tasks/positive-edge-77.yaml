# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-077
name: Unquoted dollar-star preserves no boundaries
description: |
  Unquoted dollar-star is not the IFS-joined behavior of quoted dollar-star.
tags:
  - positive-edge
inputs:
  prompt: |
    Validate and rewrite this POSIX shell snippet so both original positional
    arguments remain intact:

    ```sh
    set -- 'a b' '*.txt'
    printf '<%s>\n' $*
    ```

    Return every shell-safety output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?mi)^Result:\s*REWRITE\s*$'
        - '(?m)^Matched patterns:\s*Q5 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*[^\n]*[^\n]*[^\n]*each positional[^\n]*(separate|parameter)[^\n]*(word split|pathname|glob)[^\n]*(not|only)[^\n]*(join|IFS)[^\n]*)[^\n]*$'
        - '(?m)^Command:\s*set -- ''a b'' ''\*\.txt''; printf ''<%s>\\n'' "\$@"\s*$'
        - '(?m)^Required checks:\s*None\s*$'
      regex_not_match:
        - '(?m)^Command:[^\n]*printf ''<%s>\\n''[ \t]+"\$\*"[^\n]*$'
      not_contains:
        - 'Verdict:'
        - 'Checklist status:'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response explains that unquoted `$*` expands the
        positional parameters separately before further splitting/globbing and
        rewrites to quoted `"$@"` to preserve both boundaries.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.

        Full success: expansion semantics and quoted-dollar-at rewrite are exact.
        Partial completion (fail): rewrite is safe but the unquoted-dollar-star explanation is weak.
        Failure: unquoted dollar-star is described as one IFS-joined string.
      mode: independent
