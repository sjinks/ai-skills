# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-004
name: Quoted backtick rewrite preserves command semantics
description: |
  Modernizing backtick syntax must not replace the output command or alter the
  existing quoted argument boundary.
tags:
  - positive-edge
inputs:
  prompt: |
    Validate and rewrite ``echo "today is `date`"`` for POSIX `sh`. The
    substitution is intentionally inside one double-quoted argument, and I want
    to preserve `echo` and its output semantics. Return every safety field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?m)^Result:\s*REWRITE\s*$'
        - '(?m)^Matched patterns:\s*CS1 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*[^\n]*[^\n]*(backtick|command substitution))(?=[^\n]*[^\n]*[^\n]*(quoted|one argument|boundary))(?=[^\n]*[^\n]*[^\n]*(preserv|same))[^\n]*$'
        - '(?m)^Command:\s*echo "today is \$\(date\)"\s*$'
        - '(?m)^Required checks:\s*None\s*$'
      not_contains:
        - "Command: printf"
        - "CS2 (Command construction)"
        - "Verdict:"
        - "Checklist status:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether only the backtick syntax changes to `$(date)` while the
        original `echo`, fixed text, double-quoted single argument, and output
        semantics remain unchanged. Last line: 1.0, 0.5, or 0.0 only.
      mode: independent
