# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-004
name: Rewrite unquoted variable
description: |
  A deterministic quoting correction should return a safe rewrite rather than
  authorizing the original or blocking without a replacement.
tags:
  - positive-edge
inputs:
  prompt: |
    Validate and rewrite this Bash command. `HOME` is a normal non-secret
    variable and I only want to print its value:

    ```bash
    printf '%s\n' $HOME
    ```

    Return every shell-safety output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Result:\s*REWRITE'
        - '(?s)Matched patterns:.*Q1 \(Command construction\)'
        - '(?i)Assessment:.*(quote|split|glob|expansion)'
        - '(?mi)^Command:\s*printf ''%s\\n'' "\$HOME"\s*$'
        - '(?i)Required checks:\s*None'
      not_contains:
        - "Verdict:"
        - "Checklist status:"