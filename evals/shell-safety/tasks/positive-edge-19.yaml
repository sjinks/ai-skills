# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-019
name: Commit message avoids temporary path reopen
description: |
  Exclusive temporary-file creation does not preserve object identity when the
  path is reopened for writing and later consumption.
tags:
  - positive-edge
inputs:
  prompt: |
    Validate this proposed safe rewrite for a multi-line commit message:

    ```bash
    message_file="$(mktemp /tmp/commit-message.XXXXXX)"
    cat > "$message_file" <<'EOF'
    feat: add report

    Explain why this is needed.
    EOF
    git commit -F "$message_file"
    ```

    Return every shell-safety output field and provide a path-race-free rewrite.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Result:\s*REWRITE'
        - '(?i)Matched patterns:.*GC1'
        - '(?i)Assessment:.*(path|reopen|replace|identity|race)'
        - '(?is)Command:.*git commit -F -.*<<''EOF''.*feat: add report.*Explain why this is needed'
        - '(?i)Required checks:\s*None'
      not_contains:
        - "git commit -F \"$message_file\""
        - "git commit -F <("
        - "Verdict:"
        - "Checklist status:"