# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-123
name: Scalar command substitution is quoted in place
description: |
  Resolved single-argument intent permits a semantics-preserving CS2 rewrite.
tags: [positive-edge]
inputs:
  prompt: |
    Rewrite `echo $(printf '%s' 'a b')` for POSIX `sh`. The substitution is
    confirmed to produce one scalar argument containing `a b`; no pathname
    expansion or multiple arguments are intended. Preserve the original `echo`,
    fixed command body, and substitution position. Return every safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?m)^Result:\s*REWRITE\s*$'
        - '(?m)^Matched patterns:\s*CS2 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*[^\n]*[^\n]*[^\n]*(one|single|scalar)[^\n]*(argument|boundary)[^\n]*(quote|preserv)[^\n]*)[^\n]*$'
        - '(?m)^Command:\s*echo "\$\(printf ''%s'' ''a b''\)"\s*$'
        - '(?m)^Required checks:\s*None\s*$'
      not_contains: ['Command: printf', 'Result: BLOCKED', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether scalar intent quotes the substitution in place without
        changing echo, the producer, or its position. Last line: 1.0, 0.5, or
        0.0 only.
      mode: independent
