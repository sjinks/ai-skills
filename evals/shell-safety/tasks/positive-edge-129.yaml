# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-129
name: Unquoted backticks reclassify under CS2
description: |
  Syntax modernization cannot bypass unresolved splitting and globbing intent.
tags: [positive-edge]
inputs:
  prompt: |
    Review ``echo `printf '%s' 'a b'``` for POSIX `sh`. The backtick body has no
    escape-sensitive syntax, but I have not established whether its unquoted
    output is one scalar or multiple arguments, nor whether pathname expansion
    is intended. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?m)^Result:\s*BLOCKED\s*$'
        - '(?m)^Matched patterns:\s*CS1 \(Command construction\), CS2 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*[^\n]*backtick)(?=[^\n]*[^\n]*(split|glob|argv))(?=[^\n]*[^\n]*(unknown|unresolved))[^\n]*$'
        - '(?m)^Command:\s*Not provided\s*$'
        - '(?ims)^Required checks:(?=(?:(?!^[A-Z][A-Za-z ]*:).)*(scalar|multiple))(?=(?:(?!^[A-Z][A-Za-z ]*:).)*(argument|argv))(?=(?:(?!^[A-Z][A-Za-z ]*:).)*(glob|pathname))(?=(?:(?!^[A-Z][A-Za-z ]*:).)*(modern|\$\(\)))(?:(?!^[A-Z][A-Za-z ]*:).)*(?=^[A-Z][A-Za-z ]*:|\Z)'
      not_contains: ['Result: REWRITE', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether simple unquoted backtick modernization reports CS1 then
        CS2 and remains blocked until argv and pathname-expansion intent is known.
        Last line: 1.0, 0.5, or 0.0 only.
      mode: independent
