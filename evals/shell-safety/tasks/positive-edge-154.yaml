# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-154
name: Confirmed single path with spaces is quoted in place
description: Q6 preserves a confirmed one-path operand.
tags: [positive-edge]
inputs:
  prompt: |
    Review `cat /tmp/my file.txt`. I confirm this is one path operand, exactly
    `/tmp/my file.txt`, not two arguments. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*Q6 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(space|two paths|argument))(?=[^\n]*(single.path|one path))(?=[^\n]*rewrite)[^\n]*$', '(?m)^Command:\s*cat "/tmp/my file\.txt"\s*$', '(?mi)^Required checks:(?=[^\n]*(confirm|confirmed))(?=[^\n]*(single.path|one path))[^^\n]*$']
      not_contains: ['Result: SAFE', 'Command: Not provided', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether Q6 quotes only the confirmed single path in place while preserving cat and its operand position. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
