# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-016
name: POSIX pipeline cannot use pipefail
description: |
  A POSIX-sh pipeline must not receive a Bash-only pipefail rewrite.
tags:
  - positive-edge
inputs:
  prompt: |
    This script must remain portable `/bin/sh`:

    ```sh
    set -e
    produce | consume
    ```

    Failure in either command must be detected, but no non-pipeline flow has
    been designed yet. Return every shell-safety output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Result:\s*BLOCKED'
        - '(?i)Matched patterns:.*CS6'
        - '(?i)Assessment:.*(POSIX|sh|pipeline|component|interpreter)'
        - '(?i)Command:\s*Not provided'
        - '(?i)Required checks:.*(non.pipeline|status|flow|interpreter)'
      not_contains:
        - "Command: set -o pipefail"
        - "Command: set -euo pipefail"
        - "Verdict:"
        - "Checklist status:"