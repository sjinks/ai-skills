# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-153
name: Unicode commit message requires verified UTF-8 terminal
description: GC8 preserves reviewed Unicode bytes only under verified UTF-8.
tags: [positive-edge]
inputs:
  prompt: |
    Review `git commit -m "🎉 ship"`. The terminal locale is verified UTF-8 and the exact
    literal UTF-8 subject `🎉 ship` was reviewed. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*GC8 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(Unicode|UTF-8|multi.byte))(?=[^\n]*(terminal|locale))(?=[^\n]*rewrite)[^\n]*$', '(?ms)^Command: \|\n  git commit --cleanup=verbatim -F - <<''EOF''\n  🎉 ship\n  EOF\s*$', '(?mi)^Required checks:(?=[^\n]*(UTF-8|locale))(?=[^\n]*(review|literal))[^^\n]*$']
      not_contains: ['Result: SAFE', 'Command: git commit -m', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether GC8 requires a verified UTF-8 terminal and puts reviewed literal Unicode text into the quoted heredoc. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
