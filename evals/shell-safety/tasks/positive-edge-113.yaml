# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-113
name: Escape-sensitive backticks remain blocked
description: |
  Backtick-specific escaping must not be mechanically converted to `$()`.
tags: [positive-edge]
inputs:
  prompt: |
    Review this POSIX `sh` command:

    ```sh
    echo "`printf '\\n'`"
    ```

    The backtick body contains backslash-sensitive text, and no parser-backed
    equivalence proof or caller-supplied modern command exists. Return every
    shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?m)^Result:\s*BLOCKED\s*$'
        - '(?m)^Matched patterns:\s*CS1 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*[^\n]*[^\n]*(backslash|escaping))(?=[^\n]*[^\n]*[^\n]*(backtick|\$\(\)))(?=[^\n]*[^\n]*[^\n]*(semantic|parse|equivalence))[^\n]*$'
        - '(?m)^Command:\s*Not provided\s*$'
        - '(?ims)^Required checks:(?=(?:(?!^[A-Z][A-Za-z ]*:).)*(parser|equivalence|caller.supplied))(?=(?:(?!^[A-Z][A-Za-z ]*:).)*(modern|\$\(\)|command))(?:(?!^[A-Z][A-Za-z ]*:).)*(?=^[A-Z][A-Za-z ]*:|\Z)'
      not_contains: ['Result: REWRITE', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether escape-sensitive CS1 stays blocked without a parser-backed
        equivalence proof or caller-supplied modern command. Last line: 1.0,
        0.5, or 0.0 only.
      mode: independent
