# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-147
name: Repeated commit message flags require reviewed stdin
description: GC2 must replace repeated message flags with one reviewed literal message.
tags: [positive-edge]
inputs:
  prompt: |
    Review `git commit -m "Fix parser" -m "Explain why" -m "- preserve tabs"`.
    The subject and two body paragraphs are the exact reviewed message bytes. Return every
    shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?m)^Result:\s*REWRITE\s*$'
        - '(?m)^Matched patterns:\s*GC2 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*(repeated|multiple).*(?:-m|message))(?=[^\n]*(paragraph|body))(?=[^\n]*rewrite)[^\n]*$'
        - '(?ms)^Command: \|\n  git commit --cleanup=verbatim -F - <<''EOF''\n  Fix parser\n  \n  Explain why\n  \n  - preserve tabs\n  EOF\s*$'
        - '(?mi)^Required checks:(?=[^\n]*(review|exact).*(literal|message bytes))(?=[^\n]*heredoc)[^\n]*$'
      not_contains: ['Result: SAFE', 'Command: git commit -m', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether GC2 replaces repeated -m flags with one reviewed quoted stdin heredoc that preserves the exact subject and paragraph boundaries. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
