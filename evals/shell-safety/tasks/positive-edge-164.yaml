# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-164
name: zsh equals expansion quotes bare triple equals
description: SM5 keeps literal equals text from zsh expansion.
tags: [positive-edge]
inputs:
  prompt: |
    Review `echo ===` under zsh with equals expansion enabled. The intended output is the
    literal three equals characters. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*SM5 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(zsh|equals expansion))(?=[^\n]*(===|bare))(?=[^\n]*rewrite)[^\n]*$', '(?m)^Command:\s*echo ''===''\s*$', '(?mi)^Required checks:(?=[^\n]*(zsh|equals expansion))(?=[^\n]*(literal|three equals))[^^\n]*$']
      not_contains: ['Result: SAFE', 'Command: echo ===', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether SM5 quotes the bare zsh === expression so it remains literal text. Call set_waza_grade_pass exactly once only when all full-success criteria in this prompt hold. Otherwise, including partial completion, call set_waza_grade_fail exactly once. Put the reasoning in the tool call''s reason argument; do not return a numeric grade as response text.', mode: independent}
