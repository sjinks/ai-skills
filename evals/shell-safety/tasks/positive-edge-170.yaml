# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-170
name: Byte-stable sort pins the locale
description: EN3 changes locale only for explicitly required cross-host byte order.
tags: [positive-edge]
inputs:
  prompt: |
    Review `sort names.txt`. I require bytewise, cross-host-stable ordering of this file.
    Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*EN3 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(locale|collation))(?=[^\n]*(bytewise|cross.host|stable))(?=[^\n]*rewrite)[^\n]*$', '(?m)^Command:\s*LC_ALL=C sort names\.txt\s*$', '(?mi)^Required checks:(?=[^\n]*(bytewise|cross.host))(?=[^\n]*(locale|LC_ALL=C))[^^\n]*$']
      not_contains: ['Result: SAFE', 'Command: sort names.txt', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether EN3 sets LC_ALL=C specifically because bytewise cross-host-stable sort semantics are required. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
