# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-041
name: IFS mutation is command-scoped
description: |
  A fallible read under set -e must not leave a manually restored IFS mutation
  behind.
tags:
  - positive-edge
inputs:
  prompt: |
    Rewrite this Bash fragment so `IFS` cannot remain changed if `read` fails
    under `set -e`:

    ```bash
    OLDIFS=$IFS
    IFS=,
    read -r a b c <<< "$line"
    IFS=$OLDIFS
    ```

    Return every shell-safety output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?mi)^Result:\s*REWRITE\s*$'
        - '(?m)^Matched patterns:\s*SM6 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*[^\n]*[^\n]*IFS)(?=[^\n]*[^\n]*[^\n]*(set -e|fail|nonzero))(?=[^\n]*[^\n]*[^\n]*(persist|restore|scope))[^\n]*$'
        - '(?m)^Command:[ \t]*`?IFS=, read -r a b c <<< "\$line"`?[ \t]*$'
        - '(?m)^Required checks:\s*None\s*$'
      not_contains:
        - "Verdict:"
        - "Checklist status:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response replaces manual save/restore with the
        command-scoped Bash assignment `IFS=, read -r a b c <<< "$line"`, so a
        failing read cannot persist IFS. A subshell is acceptable for a larger
        multi-command parsing block.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.

        Full success: IFS lifetime is automatic and failure-safe.
        Partial completion (fail): persistence is recognized but the replacement is incomplete.
        Failure: manual restoration remains or failure can leak IFS.
      mode: independent
