# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-156
name: Unbalanced mixed quote remains blocked
description: Q8 cannot choose the intended quote boundary.
tags: [positive-edge]
inputs:
  prompt: |
    Review `echo "it's $name`. I have not supplied the intended closing quote boundary or
    whether `$name` belongs in the output. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*BLOCKED\s*$', '(?m)^Matched patterns:\s*Q8 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(unbalanced|closing quote|quote boundary))(?=[^\n]*(unknown|unresolved|missing))(?=[^\n]*block)[^\n]*$', '(?m)^Command:\s*Not provided\s*$', '(?mi)^Required checks:(?=[^\n]*(intended text|quote boundary))(?=[^\n]*(confirm|supply|resolve))[^^\n]*$']
      not_contains: ['Result: REWRITE', 'printf ''%s\\n'' "it''s $name"', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether Q8 stays blocked until the intended text and closing quote boundary are known, without inventing a rewrite. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
