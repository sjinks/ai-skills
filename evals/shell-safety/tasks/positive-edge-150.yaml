# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-150
name: Commit backticks are resolved before literal message
description: GC5 removes difficult nested backtick syntax.
tags: [positive-edge]
inputs:
  prompt: |
    Review `git commit -m "ship at \`date\`"`. The date was resolved and reviewed as
    `ship at 2026-08-31`. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*GC5 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*backtick)(?=[^\n]*(nest|escape))(?=[^\n]*rewrite)[^\n]*$', '(?ms)^Command: \|\n  git commit --cleanup=verbatim -F - <<''EOF''\n  ship at 2026-08-31\n  EOF\s*$', '(?mi)^Required checks:(?=[^\n]*(resolve|date))(?=[^\n]*(review|exact))[^^\n]*$']
      not_contains: ['`date`', 'Result: SAFE', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether GC5 resolves and reviews the backtick date before emitting it as literal text in a quoted heredoc. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
