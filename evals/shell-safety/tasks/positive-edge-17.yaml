# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-017
name: POSIX strict mode excludes pipefail
description: |
  A reviewed POSIX script without pipelines can receive a portable strict-mode
  rewrite without Bash syntax.
tags:
  - positive-edge
inputs:
  prompt: |
    This `/bin/sh` script has no pipelines, and I reviewed every expected
    nonzero path. Rewrite it to stop on errors and unset variables without
    changing interpreters:

    ```sh
    #!/bin/sh
    render_report
    publish_report
    ```

    Return every shell-safety output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?mi)^Result:\s*REWRITE\s*$'
        - '(?m)^Matched patterns:\s*SM1 \(Command construction\)\s*$'
        - '(?mi)^Assessment:(?=[^\n]*[^\n]*[^\n]*(POSIX|sh|unset|error))[^\n]*$'
        - '(?ms)^Command: \|\n  #!/bin/sh\n  set -eu\n  render_report\n  publish_report\n(?=^Required checks:)'
        - '(?m)^Required checks:\s*None\s*$'
      not_contains:
        - "set -euo pipefail"
        - "#!/usr/bin/env bash"
        - "Verdict:"
        - "Checklist status:"
