# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-157
name: Dash-leading filename is terminated as operand
description: Q10 prevents option parsing of a filename.
tags: [positive-edge]
inputs:
  prompt: |
    Review `rm -file`. `-file` is the exact intended filename. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*Q10 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(filename|name))(?=[^\n]*(option|dash|hyphen))(?=[^\n]*rewrite)[^\n]*$', '(?m)^Command:\s*rm -- -file\s*$', '(?mi)^Required checks:(?=[^\n]*(target|filename))(?=[^\n]*(confirm|exact))[^^\n]*$']
      not_contains: ['Result: SAFE', 'Command: rm -file', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether Q10 uses -- so the exact dash-leading filename is not parsed as options. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
