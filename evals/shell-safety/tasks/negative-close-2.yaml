# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Generic shell explanation
description: |
  A request to explain shell syntax without validating a command for execution
  must not activate the shell-safety output contract.
tags:
  - negative-close
inputs:
  prompt: |
    In bash, what does `chmod +x ./script.sh` mean, and why would I use it on
    a local script file?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: negative_trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: negative_task_completion
    config:
      not_contains:
        - "Result:"
        - "Matched patterns:"
        - "Assessment:"
        - "Command:"
        - "Required checks:"