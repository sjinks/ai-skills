# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-152
name: Single quote commit subject needs heredoc
description: GC7 handles apostrophes without invalid single-quote escaping.
tags: [positive-edge]
inputs:
  prompt: |
    Review `git commit -m 'it\'s broken'`. The intended literal subject is exactly `it's broken`.
    GD9 repository, staged-index, branch/parent, author/signing, cleanup, and hook
    checks are absent. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*BLOCKED\s*$', '(?m)^Matched patterns:\s*GC7 \(Command construction\), GD9 \(Host/repository\)\s*$', '(?mi)^Assessment:(?=[^\n]*(apostrophe|single quote))(?=[^\n]*(literal|heredoc))(?=[^\n]*(GD9|hook|index|commit))(?=[^\n]*block)[^\n]*$', '(?m)^Command:\s*Not provided\s*$', '(?ims)^Required checks:(?=[\s\S]*(literal subject|exact literal).*(heredoc|stdin))(?=[\s\S]*(staged|index))(?=[\s\S]*(repository|branch|parent))(?=[\s\S]*(hook|cleanup))(?=[\s\S]*(author|signing|identity))[\s\S]*$']
      not_contains: ['Result: SAFE', 'Result: REWRITE', 'Command: git commit', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether GC7 identifies the literal heredoc replacement but reports GC7 and GD9 and remains BLOCKED until ordinary-commit prerequisites are supplied. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
