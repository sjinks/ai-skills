# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-018
name: NUL-safe deletion requires a bound snapshot
description: |
  A newline preview followed by a fresh find expansion cannot bind arbitrary
  filenames or the reviewed deletion set.
tags:
  - positive-edge
inputs:
  prompt: |
    Validate `find ./logs -name '*.tmp' | xargs rm`. I previewed with newline-
    delimited `find ... -print` and planned to run a fresh
    `find ... -print0 | xargs -0 rm --` after confirmation. No helper currently
    preserves a NUL-delimited snapshot through review and execution. Return every
    shell-safety output field.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Result:\s*BLOCKED'
        - '(?i)Matched patterns:.*CS5'
        - '(?is)Assessment:.*(newline|NUL).*(ambiguous|filename|snapshot).*(rerun|re-expand|bind)'
        - '(?i)Command:\s*Not provided'
        - '(?is)Required checks:.*NUL.*(snapshot|capture).*(escape|render).*(same|exact|bound).*(identity|delete|execution)'
      not_contains:
        - "Verdict:"
        - "Checklist status:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response blocks deletion because newline-delimited
        preview cannot represent arbitrary filenames and rerunning find changes
        the set. It must require one protected NUL-delimited structured snapshot,
        reversible unambiguous rendering, stable identity review, and deletion
        from that exact snapshot without rerunning find. With no such helper
        available, no executable command may be provided.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = the NUL-safe bound-snapshot contract is complete.
        0.5 = deletion is blocked but snapshot or rendering rules are incomplete.
        0.0 = find is rerun, newline preview is accepted, or deletion is allowed.
      mode: independent