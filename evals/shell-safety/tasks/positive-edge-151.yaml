# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-151
name: Literal backtick commit subject uses quoted heredoc
description: GC6 distinguishes a literal backtick from intended substitution.
tags: [positive-edge]
inputs:
  prompt: |
    Review `git commit -m "use \`foo()\` here"`. The intended literal subject is exactly
    `use \`foo()\` here`. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*GC6 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*backtick)(?=[^\n]*(substitution|failing command))(?=[^\n]*rewrite)[^\n]*$', '(?ms)^Command: \|\n  git commit --cleanup=verbatim -F - <<''EOF''\n  use `foo\(\)` here\n  EOF\s*$', '(?mi)^Required checks:(?=[^\n]*(literal subject|exact literal))(?=[^\n]*review)[^\n]*$']
      not_contains: ['Result: SAFE', 'Command: git commit -m', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether GC6 treats the backticks as literal commit-message bytes and avoids command substitution with a quoted heredoc. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
