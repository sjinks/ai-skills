# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-155
name: Intended expansion cannot remain single quoted
description: Q7 rewrites only when expansion is wanted.
tags: [positive-edge]
inputs:
  prompt: |
    Review `echo '$HOME'`. I want the current HOME value expanded, followed by exactly one
    newline. Return every shell-safety field.
expected: {should_trigger: true}
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config: {skill_path: skills/shell-safety/SKILL.md, mode: positive, threshold: 0.45}
  - type: skill_invocation
    name: skill_invocation
    config: {required_skills: [shell-safety], mode: any_order}
  - type: text
    name: positive_task_completion
    config:
      regex_match: ['(?m)^Result:\s*REWRITE\s*$', '(?m)^Matched patterns:\s*Q7 \(Command construction\)\s*$', '(?mi)^Assessment:(?=[^\n]*(single quote|quoted))(?=[^\n]*(expand|literal))(?=[^\n]*rewrite)[^\n]*$', '(?m)^Command:\s*printf ''%s\\n'' "\$HOME"\s*$', '(?mi)^Required checks:(?=[^\n]*(expansion|expand))(?=[^\n]*(wanted|intent))[^^\n]*$']
      not_contains: ['Result: SAFE', 'Command: echo', 'Verdict:', 'Checklist status:']
  - type: prompt
    name: task_completion_substance
    config: {prompt: 'Grade whether Q7 replaces single quotes only because HOME expansion is intended, using printf with a quoted expansion. Last line: 1.0, 0.5, or 0.0 only.', mode: independent}
