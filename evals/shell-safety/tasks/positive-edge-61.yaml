# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-061
name: Autonomous command composition emits safety fields
description: |
  The output contract applies when the assistant is asked to run a nontrivial
  command even without an explicit validation request.
tags:
  - positive-edge
inputs:
  prompt: |
    Please run `printf '%s\n' $HOME` in the terminal and tell me the output.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: positive_trigger_accuracy
    config:
      skill_path: skills/shell-safety/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-safety
      mode: any_order
  - type: text
    name: positive_task_completion
    config:
      regex_match:
        - '(?i)Result:\s*REWRITE'
        - '(?s)Matched patterns:.*Q1 \(Command construction\)'
        - '(?is)Assessment:.*(unquoted|split|glob|expansion)'
        - '(?i)Command:.*printf.*"\$HOME"'
        - '(?i)Required checks:\s*None'
      not_contains:
        - "Verdict:"
        - "Checklist status:"