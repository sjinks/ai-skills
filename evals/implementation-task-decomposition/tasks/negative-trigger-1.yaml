# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the implementation-task-decomposition skill.
tags:
  - negative-trigger
inputs:
  prompt: "Plan a four-course dinner menu for six guests, one of whom is vegetarian."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/implementation-task-decomposition/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Implementation Step Plan"
        - "walking-skeleton"
        - "Must not touch"
        - "Verdict: BLOCK"
        - "Smallest addition to proceed"
