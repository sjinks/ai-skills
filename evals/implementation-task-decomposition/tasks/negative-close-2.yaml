# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Sprint estimation is not step decomposition
description: |
  Estimating and assigning tickets across a team for sprint planning
  is project management, not implementation step decomposition, and
  must not activate the skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    We have five tickets in the backlog for next sprint. Estimate each
    in story points, balance them across our three engineers by
    seniority, and tell me what fits in a two-week sprint.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/implementation-task-decomposition/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Implementation Step Plan"
        - "Must not touch"
        - "walking-skeleton"
        - "### Blocked on"
