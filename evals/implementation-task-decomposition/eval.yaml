# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: implementation-task-decomposition-eval
description: |
  Evaluates the implementation-task-decomposition skill: it activates on
  pre-coding decomposition of approved specs into step plans, stays
  silent on PR splitting, estimation, and off-topic prompts, and
  produces the step plan with verification checks, boundaries,
  dependencies, and blocked-on items.
skill: implementation-task-decomposition
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the step plan table with Verify by, dependencies, risk, step details, and blocked-on entries.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 10000
tasks:
  - "tasks/*.yaml"
