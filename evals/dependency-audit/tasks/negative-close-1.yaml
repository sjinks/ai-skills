# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Library selection without dependency risk audit
description: Close-domain library choice prompt, but no security/license/health audit is requested.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    I am choosing between Zod and Valibot for form validation in a small
    TypeScript app. Compare their API ergonomics, bundle-size tradeoffs, docs,
    and learning curve. I am not asking for a security, license, or dependency
    audit.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/dependency-audit/SKILL.md
      mode: negative
      threshold: 0.50
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Findings:"
        - "license-risk"
        - "known-vulnerability"
        - "supply-chain-integrity"
