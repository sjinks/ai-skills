# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: archive-extraction-safety-eval
description: |
  Evaluates the archive-extraction-safety skill: it activates for ZIP/TAR
  extraction safety reviews and designs, stays silent on archive-adjacent
  prompts with no extraction, is actually invoked when expected, and emits
  the skill's required output (verdict, archive parser, destination root,
  allowed entry types, resource limits, findings, checklist status, and
  residual risk).
skill: archive-extraction-safety
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the archive extraction safety contract and identifies the specific extraction risks the prompt asks about.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"