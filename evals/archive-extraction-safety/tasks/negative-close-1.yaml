# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Archive download URL review with no extraction
description: |
  Close-domain archive prompt, but it asks only about outbound download URL
  policy and explicitly says no extraction happens.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Review whether this service may download a user-supplied archive URL.
    The file is stored as an opaque blob and is never extracted or unpacked.
    I only care about URL validation, redirects, DNS, proxy behavior, and
    response size limits for the outbound HTTP request.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/archive-extraction-safety/SKILL.md
      mode: negative
      threshold: 0.50
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Findings:"
        - "Archive format/parser:"
        - "Destination root:"
        - "Allowed entry types:"
        - "Checklist status:"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Zip Slip"
        - "Tar Slip"