# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: ZIP extraction review with traversal and link risks
description: |
  Canonical ZIP extraction review: entry names are joined to the destination
  root and written without containment, link, overwrite, or resource-limit
  controls.
tags:
  - positive-trigger
inputs:
  prompt: |
    Review this ZIP extraction helper for archive extraction safety.

    ```ts
    import AdmZip from 'adm-zip';
    import { mkdirSync, writeFileSync } from 'node:fs';
    import { dirname, join } from 'node:path';

    export function unpackPlugin(zipBytes: Buffer, dest: string) {
      const zip = new AdmZip(zipBytes);
      for (const entry of zip.getEntries()) {
        const target = join(dest, entry.entryName);
        if (entry.isDirectory) {
          mkdirSync(target, { recursive: true });
          continue;
        }
        mkdirSync(dirname(target), { recursive: true });
        writeFileSync(target, entry.getData());
      }
    }
    ```

    Context: ZIP parser is `adm-zip`; destination root is a per-job plugin
    staging directory; archives come from tenant uploads; only regular files
    and directories should be allowed; no current file count, decompressed
    size, compression ratio, overwrite, or cleanup policy is documented.

    Return the archive extraction safety verdict, findings, checklist status,
    and residual risk.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/archive-extraction-safety/SKILL.md
      mode: positive
      threshold: 0.50
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - archive-extraction-safety
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)Verdict:\\s*(BLOCK|CONCERNS)"
        - "(?i)Archive format/parser:"
        - "(?i)Destination root:"
        - "(?i)Allowed entry types:"
        - "(?i)Resource limits:"
        - "(?i)Findings:"
        - "(?i)Checklist status:"
        - "(?i)(Zip Slip|traversal|\\.\\.)"
        - "(?i)(destination containment|containment|canonical)"
        - "(?i)(file count|decompressed size|compression ratio)"
      not_contains:
        - "Egress policy:"
        - "Trusted root:"
        - "Verdict: PLAN-READY"
        - "Gate decision:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response identifies that this ZIP extractor lacks
        containment after joining the entry name to the destination, does not
        reject traversal or absolute paths after normalization, has no
        documented link/special-file policy, lacks overwrite and partial
        cleanup policy, and lacks file count, decompressed-size, and
        compression-ratio limits. A correct response should use the archive
        extraction safety output sections and return BLOCK or CONCERNS.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or hedges substantially.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent