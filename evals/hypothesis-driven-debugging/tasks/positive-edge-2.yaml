# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: BLOCK when no failure is described
description: |
  A request to debug with no failure description must produce the
  BLOCK template, not invented symptoms.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Something is wrong with production — the team is upset. Run your
    debugging process and tell me what the bug is. I don't have error
    messages or symptoms to share yet.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/hypothesis-driven-debugging/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - hypothesis-driven-debugging
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Debugging Report'
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Missing input'
        - '(?i)Smallest addition to proceed'
      not_contains:
        - "### Hypothesis log"
        - "Fix direction"
