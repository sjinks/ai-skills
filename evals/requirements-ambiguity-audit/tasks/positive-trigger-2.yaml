# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Conflicting requirements in a user story
description: |
  A user story containing two requirements that cannot both hold is
  audited; the conflict is found, both statements quoted, and a blocker
  severity assigned.
tags:
  - positive-trigger
inputs:
  prompt: |
    Check these requirements for ambiguity and conflicts before sprint
    planning. Route any open questions to the product owner:

    As an admin, I can delete a workspace.

    Requirements:
    - R1: Deleting a workspace permanently removes all its data immediately.
    - R2: A deleted workspace can be restored by support within 30 days.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - requirements-ambiguity-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Requirements Ambiguity Report'
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)\|\s*#\s*\|\s*Class\s*\|\s*Severity\s*\|\s*Location\s*\|'
        - '(?im)^\s*\|\s*[`*_]*\d+[`*_]*\s*\|\s*[`*_]*conflicting-requirements[`*_]*\s*\|\s*[`*_]*blocker[`*_]*\s*\|(?:\\\||[^|\\\r\n])*[^|\s\\][ \t]*\|[ \t\r]*$'
        - '(?im)^[ \t]*-[ \t]*[*_]*Quote:'
        - '(?ims)^### Findings[ \t]*$\r?\n(?:(?!^### Open questions)[\s\S])*?^[ \t]*-[ \t]*[*_]*Conflict:[*_]*[ \t]*\S[^\r\n]*'
        - '(?ims)^### Findings[ \t]*$\r?\n(?:(?!^### Open questions)[\s\S])*?^[ \t]*-[ \t]*[*_]*Proposed rewrite:[*_]*[^\r\n]*OPEN QUESTION'
        - '(?ims)^### Findings[ \t]*$\r?\n(?:(?!^### Open questions)[\s\S])*?^[ \t]*-[ \t]*[*_]*Quote:[*_]*(?=(?:(?!\r?\n[ \t]*-[ \t]*[*_]*(?:Conflict|Proposed rewrite):)[\s\S])*permanently\s+removes\s+all\s+its\s+data\s+immediately)(?=(?:(?!\r?\n[ \t]*-[ \t]*[*_]*(?:Conflict|Proposed rewrite):)[\s\S])*restored\s+by\s+support\s+within\s+30\s+days)(?:(?!\r?\n[ \t]*-[ \t]*[*_]*(?:Conflict|Proposed rewrite):)[\s\S])*(?=\r?\n[ \t]*-[ \t]*[*_]*(?:Conflict|Proposed rewrite):)'
        - '(?im)^### Findings[ \t]*$'
        - '(?im)^### Open questions \(product decisions, not findings\)[ \t]*$'
        - '(?ims)^### Open questions \(product decisions, not findings\)[ \t]*$\r?\n(?:[ \t]*\r?\n)*[ \t]*-[^\r\n]*product owner'
      not_contains:
        - "Finding Quality Report"
        - "Scope Slice Plan"
        - "Readings:"
