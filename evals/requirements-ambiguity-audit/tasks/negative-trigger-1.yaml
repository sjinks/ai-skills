# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the requirements-ambiguity-audit skill.
tags:
  - negative-trigger
inputs:
  prompt: "Recommend three beginner-friendly houseplants that survive a north-facing window."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      regex_not_match:
        - '(?im)^### Findings[ \t]*\r?$\r?\n(?:[ \t]*\r?\n)*[ \t]*(?:#{1,6}[ \t]*)?[*_]*Finding[ \t]+\d+[*_]*:'
      not_contains:
        - "Requirements Ambiguity Report"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "| # | Class | Severity | Location |"
        - "### Findings"
        - "### Open questions (product decisions, not findings)"
        - "Missing input:"
        - "Smallest addition to proceed"
        - "| vague-quantifier |"
        - "| undefined-term |"
        - "| missing-actor |"
        - "| conflicting-requirements |"
        - "| placeholder |"
        - "| unspecified-path |"
        - "| ambiguous-reference |"
        - "| untestable-wording |"
