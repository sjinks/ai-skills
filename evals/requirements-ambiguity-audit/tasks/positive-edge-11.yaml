# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-011
name: BLOCK when spec text is unreadable
description: |
  A request whose only specification source is unreadable must produce the
  exact reduced BLOCK template without fabricated findings.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Run a requirements ambiguity audit on the attached legacy specification.
    The only available attachment is corrupted and renders as unreadable bytes;
    no specification text can be recovered.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - requirements-ambiguity-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?is)\A[ \t]*##[ \t]+Requirements Ambiguity Report[ \t]*\r?\n([ \t]*\r?\n)*[ \t]*[*_]*Verdict:[*_ \t]*BLOCK[*_]*\.?[*_]*[ \t]*\r?\n([ \t]*\r?\n)*[ \t]*-[ \t]*[*_]*Missing input:[*_]*[ \t]*\S[^\r\n]*\r?\n([ \t]*\r?\n)*[ \t]*-[ \t]*[*_]*Smallest addition to proceed:[*_]*[ \t]*\S[^\r\n]*(?:[ \t]*\r?\n)*[ \t]*\z'
        - '(?im)^[ \t]*-[ \t]*[*_]*Missing input:[*_]*[^\r\n]*((attachment|file|specification|source)[^\r\n]*(unreadable|corrupt|garbl|cannot be (read|recovered))|(unreadable|corrupt|garbl|cannot be (read|recovered))[^\r\n]*(attachment|file|specification|source))[^\r\n]*\r?$'
        - '(?im)^[ \t]*-[ \t]*[*_]*Smallest addition to proceed:[*_]*[ \t]*((please[ \t]+)?(provide|send|supply|attach|upload|replace)[^\r\n]*(spec|specification|copy|file|attachment|source|text)|[^\r\n]*(spec|specification|copy|file|attachment|source|text)[^\r\n]*please[ \t]+(provide|send|supply|attach|upload|replace)([ \t]+it)?|[^\r\n]*please[ \t]+(provide|send|supply|attach|upload|replace)[^\r\n]*(spec|specification|copy|file|attachment|source|text))[^\r\n]*\r?$'
        - '(?im)^[ \t]*-[ \t]*[*_]*Smallest addition to proceed:[*_]*[^\r\n]*(readable|uncorrupt|replac(e|ed|ement)|working[ \t]+copy)[^\r\n]*\r?$'
      regex_not_match:
        - '(?im)^[ \t]*-[ \t]*[*_]*(Missing input|Smallest addition to proceed):[*_]*[^\r\n]*(Missing input|Smallest addition to proceed):'
        - '(?ims)^[ \t]*((#{1,6}|[-+*]|[0-9]+[.)])[ \t]+|>+[ \t]*)*[*_]*Verdict:[^\r\n]*\r?$[\s\S]*?^[ \t]*((#{1,6}|[-+*]|[0-9]+[.)])[ \t]+|>+[ \t]*)*[*_]*Verdict:'
        - '(?im)^[ \t]*\|[^\r\n]*\|[^\r\n]*(?:vague-quantifier|undefined-term|missing-actor|conflicting-requirements|placeholder|unspecified-path|ambiguous-reference|untestable-wording)[^\r\n]*\|[ \t]*\r?$'
        - '(?im)^[ \t]*-[ \t]*[*_]*Smallest addition to proceed:[*_]*[^\r\n]*(do not|don''t|cannot|can''t|never|no need to|must not|should not)[ \t]+(provide|send|supply|attach|upload|replace)[^\r\n]*\r?$'
        - '(?im)^[ \t]*-[ \t]*[*_]*Smallest addition to proceed:[*_]*[^\r\n]*(provide|send|supply|attach|upload|replace)[^\r\n]*((no|without)[ \t]+((readable|replacement|uncorrupt|working)[ \t]+)?(spec|specification|copy|file|attachment|source|text)|(none|nothing)[ \t]*[.!?]?[ \t]*$)[^\r\n]*\r?$'
        - '(?im)^[ \t]*-[ \t]*[*_]*Smallest addition to proceed:[*_]*[^\r\n]*\b(I|we)([ \t]+(will|plan|intend|expect)|[''’](ll|d))[ \t]+(provide|send|supply|attach|upload|replace)[^\r\n]*\r?$'
        - '(?im)^[ \t]*-[ \t]*[*_]*Smallest addition to proceed:[*_]*[^\r\n]*(provide|send|supply|attach|upload|replace)[^\r\n]*(but[ \t]+)?not([ \t]+now|[ \t]+yet|[ \t]+until|[ \t]*$)[^\r\n]*\r?$'
      not_contains:
        - "Readings:"
        - "Proposed rewrite:"
        - "Quote:"
        - "Conflict:"
        - "Missing:"
        - "Untestable because:"
        - "| # | Class | Severity | Location |"
        - "| vague-quantifier |"
        - "| undefined-term |"
        - "| missing-actor |"
        - "| conflicting-requirements |"
        - "| placeholder |"
        - "| unspecified-path |"
        - "| ambiguous-reference |"
        - "| untestable-wording |"
