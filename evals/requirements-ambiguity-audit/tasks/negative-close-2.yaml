# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Auditing an AI prompt is not a requirements audit
description: |
  A request to audit an AI assistant prompt for ambiguity targets an
  instruction artifact, not a product spec, and must not activate the
  skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Audit this system prompt for ambiguity before I ship it to our
    support bot:

    "You are a helpful support agent. Answer quickly and keep responses
    short. Escalate when appropriate. Never promise refunds."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Missing input:"
        - "Smallest addition to proceed"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Requirements Ambiguity Report"
        - "### Findings"
        - "### Open questions"
        - "| vague-quantifier |"
        - "| conflicting-requirements |"
        - "| unspecified-path |"
