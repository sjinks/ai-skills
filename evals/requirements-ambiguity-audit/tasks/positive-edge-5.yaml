# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Unspecified rejection path is found
description: |
  A requirement set naming a validation behavior without stating its
  rejection outcome must yield an unspecified-path finding as a table
  row with readings and a rewrite.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Audit these requirements for ambiguity:

    Requirements:
    - R1: The import service validates each uploaded CSV row against the
      contact schema.
    - R2: Valid rows are inserted into the contacts table within one
      batch transaction per file.
    - R3: The import service emails the uploader a summary report after
      the batch transaction commits.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - requirements-ambiguity-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Requirements Ambiguity Report'
        - '(?i)Verdict:\s*(BLOCK|CONCERNS)'
        - '(?im)^\s*\|\s*[`*_]*\d+[`*_]*\s*\|\s*[`*_]*unspecified-path[`*_]*\s*\|\s*[`*_]*(blocker|should-fix|suggestion)[`*_]*\s*\|(?:\\\||[^|\\\r\n])*[^|\s\\][ \t]*\|[ \t\r]*$'
        - '(?i)Quote:'
        - '(?i)Readings:'
        - '(?i)Proposed rewrite:'
      not_contains:
        - "Finding Quality Report"
        - "Verdict: CLEAN"
