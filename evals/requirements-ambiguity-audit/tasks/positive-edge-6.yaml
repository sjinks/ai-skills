# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-006
name: Objectively untestable wording is found
description: |
  A requirement expressing a subjective quality with no observable
  pass/fail condition must yield an untestable-wording finding and its
  class-specific replacement marker.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Audit this requirement for ambiguity before implementation. Route open
    questions to the product owner:

    Requirement R1: The account settings page must feel intuitive to
    account owners.

    Glossary:
    - account settings page: the web page at /settings/account.
    - account owner: an authenticated user who owns the account.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - requirements-ambiguity-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Requirements Ambiguity Report'
        - '(?i)Verdict:\s*(BLOCK|CONCERNS)'
        - '(?i)\|\s*#\s*\|\s*Class\s*\|\s*Severity\s*\|\s*Location\s*\|'
        - '(?im)^\s*\|\s*[`*_]*\d+[`*_]*\s*\|\s*[`*_]*untestable-wording[`*_]*\s*\|\s*[`*_]*(blocker|should-fix|suggestion)[`*_]*\s*\|(?:\\\||[^|\\\r\n])*[^|\s\\][ \t]*\|[ \t\r]*$'
        - '(?ims)^### Findings[ \t]*$\r?\n(?:(?!^### Open questions).)*?^[ \t]*-[ \t]*[*_]*Quote:[*_]*[^\r\n]*must feel intuitive'
        - '(?ims)^### Findings[ \t]*$\r?\n(?:(?!^### Open questions)[\s\S])*?^[ \t]*-[ \t]*[*_]*Untestable because:[*_]*[ \t]*\S[^\r\n]*'
        - '(?ims)^### Findings[ \t]*$\r?\n(?:(?!^### Open questions)[\s\S])*?^[ \t]*-[ \t]*[*_]*Proposed rewrite:[*_]*[^\r\n]*OPEN QUESTION'
        - '(?im)^### Findings[ \t]*$'
        - '(?im)^### Open questions \(product decisions, not findings\)[ \t]*$'
        - '(?ims)^### Open questions \(product decisions, not findings\)[ \t]*$\r?\n(?:[ \t]*\r?\n)*[ \t]*-[^\r\n]*product owner'
      regex_not_match:
        - '(?im)^\s*\|\s*[`*_]*\d+[`*_]*\s*\|\s*[`*_]*vague-quantifier[`*_]*\s*\|'
      not_contains:
        - "Finding Quality Report"
        - "Verdict: CLEAN"
        - "Readings:"