# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: BLOCK when no spec text is provided
description: |
  A request to audit a spec without providing any spec text must produce
  the BLOCK template, not fabricated findings.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Run a requirements ambiguity audit on our checkout-redesign spec. I
    haven't pasted it here and you don't have access to it — tell me what
    you need.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - requirements-ambiguity-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Requirements Ambiguity Report'
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Missing input'
        - '(?i)Smallest addition to proceed'
      not_contains:
        - "Readings:"
        - "Proposed rewrite:"
        - "Quote:"
        - "Conflict:"
        - "Missing:"
        - "Untestable because:"
        - "| # | Class | Severity | Location |"
