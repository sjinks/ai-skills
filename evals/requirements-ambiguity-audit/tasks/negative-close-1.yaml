# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Reviewing code against a spec is not a spec audit
description: |
  A request to check whether code implements a spec correctly is code
  review, not requirements ambiguity auditing, and must not activate
  the skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Our spec says "sessions expire after 30 minutes of inactivity". Does
    this implementation match the spec?

    ```python
    def is_expired(session):
        return time.time() - session.created_at > 1800
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/requirements-ambiguity-audit/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      regex_not_match:
        - '(?im)^### Findings[ \t]*\r?$\r?\n(?:[ \t]*\r?\n)*[ \t]*(?:#{1,6}[ \t]*)?[*_]*Finding[ \t]+\d+[*_]*:'
      not_contains:
        - "Requirements Ambiguity Report"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "| # | Class | Severity | Location |"
        - "### Findings"
        - "### Open questions (product decisions, not findings)"
        - "Missing input:"
        - "Smallest addition to proceed"
        - "| vague-quantifier |"
        - "| undefined-term |"
        - "| missing-actor |"
        - "| conflicting-requirements |"
        - "| placeholder |"
        - "| unspecified-path |"
        - "| ambiguous-reference |"
        - "| untestable-wording |"
