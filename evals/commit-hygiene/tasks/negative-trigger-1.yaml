# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the commit-hygiene skill.
tags:
  - negative-trigger
inputs:
  prompt: "Plan a three-day vegetarian meal prep for two people with a $60 grocery budget, including a shopping list."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/commit-hygiene/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Commit Hygiene Report"
        - "Verdict:"
        - "### Rebase plan"
        - "Merge style:"
