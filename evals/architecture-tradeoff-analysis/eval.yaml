# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: architecture-tradeoff-analysis-eval
description: |
  Evaluates the architecture-tradeoff-analysis skill: it activates on
  structured comparisons of candidate architectures, stays silent on
  decision recording and off-topic prompts, and produces the analysis
  with the score table, per-option costs, evidence needs, and a
  recommendation or deciding question.
skill: architecture-tradeoff-analysis
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the tradeoff table, per-option costs, score rationale, evidence needs, and recommendation.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 10000
tasks:
  - "tasks/*.yaml"
