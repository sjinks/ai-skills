# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Hard constraint eliminates an option
description: |
  An option violating a hard compliance constraint must be marked
  eliminated and excluded from the recommendation while staying in the
  table.
tags:
  - positive-trigger
inputs:
  prompt: |
    Compare these two options for storing our EU customers' documents:
    a US-region-only object store the team already loves, or our
    existing EU-region storage cluster. Hard constraint: data residency
    requires EU storage — that's compliance, not preference. Attributes:
    developer experience and cost.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/architecture-tradeoff-analysis/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - architecture-tradeoff-analysis
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Architecture Tradeoff Analysis'
        - '(?i)eliminated'
        - '(?is)(residency|compliance|EU)'
        - '(?i)### Recommendation'
      not_contains:
        - "Architecture Decision Record"
        - "Dependency Choice Review"
