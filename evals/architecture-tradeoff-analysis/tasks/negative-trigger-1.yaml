# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the architecture-tradeoff-analysis skill.
tags:
  - negative-trigger
inputs:
  prompt: "Which houseplants tolerate overwatering best for a beginner?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/architecture-tradeoff-analysis/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Architecture Tradeoff Analysis"
        - "Per-option costs"
        - "deciding question"
        - "Verdict: BLOCK"
        - "Smallest addition to proceed"
