# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Compare three search architectures
description: |
  Canonical case: three named options with supplied attributes are
  compared; every option gets at least one weak/unknown cell and the
  analysis ends with a recommendation or deciding question.
tags:
  - positive-trigger
inputs:
  prompt: |
    Run a tradeoff analysis for our product-search choice. Options:
    Elasticsearch (self-hosted), Postgres full-text search, Algolia.

    Attributes we care about, in order: operability (we have no search
    expertise on the team), cost (hard ceiling $500/month at our
    volume — Algolia's quote is $450), and result quality for fuzzy
    queries. We already run Postgres.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/architecture-tradeoff-analysis/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - architecture-tradeoff-analysis
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Architecture Tradeoff Analysis'
        - '(?i)\|\s*Attribute\s*\|'
        - '(?i)(strong|adequate|weak|unknown)'
        - '(?i)### Per-option costs'
        - '(?i)makes worse'
        - '(?i)### Recommendation'
      not_contains:
        - "Architecture Decision Record"
        - "Failure Mode Design Report"
        - "Revisit triggers"
