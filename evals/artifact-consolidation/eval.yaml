# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: artifact-consolidation-eval
description: |
  Evaluates the artifact-consolidation skill: it activates when merging two or
  more same-kind planning artifacts (specs, architectures, test plans) into one
  without losing or renumbering any stable ID, resolving ID collisions by
  concern-prefix namespacing, building one deduplicated open-questions ledger,
  and marking superseded sources for removal; stays silent on revising a single
  artifact and on merging artifacts of different kinds; and emits an ID change
  summary with a Consolidated line and the namespace mapping.
skill: artifact-consolidation
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output preserves every source ID, namespaces collisions, and emits an ID change summary.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks resolve ID collisions by namespacing rather than renumbering.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
