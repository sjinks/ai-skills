# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic recipe question
description: Unrelated everyday question must not activate the artifact-consolidation skill.
tags:
  - negative-trigger
inputs:
  prompt: "What is a good substitute for buttermilk when baking pancakes?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/artifact-consolidation/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Consolidation Plan"
        - "ID Change Summary"
        - "Superseded Sources"
