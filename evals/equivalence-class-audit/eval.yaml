# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: equivalence-class-audit-eval
description: |
  Evaluates the equivalence-class-audit skill: it activates when a concrete
  finding implies a bounded class audit, stays silent on unrelated or
  pre-finding prompts, and produces the required single report with strict
  Presence, Disposition, and Evidence columns.
skill: equivalence-class-audit
version: "1.1"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.25
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.30
    threshold: 0.8
    description: Output carries the skill's required audit report, Presence/Disposition vocabulary, and candidate dispositions.
  - name: report_contract
    weight: 0.20
    threshold: 0.9
    description: Program validation enforces report structure, metadata, summary, and task-specific row contracts.
  - name: efficiency
    weight: 0.10
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"