# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Explicit deferral without owner blocks disposition
description: |
  An explicit deferral requirement without the required owner must block that
  disposition instead of falling through to the default fix-now behavior.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Apply equivalence-class-audit.

    Triggering finding: `maxRetries` accepts `0`, which disables retries.

    Locked audit scope: `config/retry.yml` and the Retry Configuration section
    of `docs/operations.md`.

    Known facts:
    - The configuration defect must be fixed now.
    - The documentation has the same defect and must be deferred.
    - No named owner, owning team, or reason for the required documentation
      deferral was supplied.

    Return the standard audit. Do not silently change the required documentation
    deferral to fix-now; block it and ask for the missing owner and reason.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/equivalence-class-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - equivalence-class-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Equivalence-Class Audit Report'
        - '(?is)### Defects to fix now.*### Deferred follow-ups.*### Out-of-scope candidates discovered.*### Blocking questions.*### Test/doc implications'
        - '(?im)^Output depth:\s*standard\s*$'
        - '(?im)^Verdict:\s*BLOCK\s*$'
        - '(?im)^Severity:\s*(CRITICAL|HIGH|MEDIUM|LOW|UNASSESSED)\s*$'
        - '(?im)^\|[ \t]*Axis[ \t]*\|[ \t]*Candidate[ \t]*\|[ \t]*Presence[ \t]*\|[ \t]*Disposition[ \t]*\|[ \t]*Evidence[ \t]*\|[ \t]*\r?\n\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*$'
        - '(?i)Documentation/Spec Prose Twin'
        - '(?i)\|\s*Documentation/Spec Prose Twin\s*\|[^\n|]*(documentation|docs)[^\n|]*\|\s*present\s*\|\s*blocked\s*\|'
        - '(?i)\|\s*Opposite Bound\s*\|[^\n|]*maxRetries[^\n|]*\|\s*present\s*\|\s*fix-now\s*\|'
        - '(?im)^### Deferred follow-ups[ \t]*\r?\n-[ \t]*None[ \t]*(\r?\n)+### Out-of-scope candidates discovered[ \t]*$'
      not_contains:
        - "### Omitted axes (quick mode only)"
        - "Output depth: quick"
        - "Output depth: exhaustive"
        - 'Gate decision:'
        - 'Adversarial tests:'
        - 'Egress policy:'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/equivalence-class-audit/check-report.py
        - positive-edge-005
      timeout: 60
