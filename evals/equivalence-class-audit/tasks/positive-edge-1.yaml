# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: No candidate axes must be explicit n/a rows
description: |
  Even when an axis has no candidates or cannot structurally apply, the report
  must record that fact instead of omitting the axis.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use equivalence-class-audit.

    Triggering finding: bug BUG-221 found that the `timeoutSeconds` field in a
    single-file YAML configuration accepted `0` and made the health checker
    spin.

    Locked audit scope: only `config/healthcheck.yml` and its "Health check
    timeout" docs section.

    Known facts:
    - This artifact has no inverse operation, no async/sync variants, no cache
      or projection, no allocated resource, and no authorization surface.
    - There is only one field in the locked scope.
    - The docs still mention `0` as allowed.

    Return the audit. Do not omit axes just because there are no candidates;
    every catalogue axis must appear at least once, either with one row per
    candidate or with an explicit n/a row and reason.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/equivalence-class-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - equivalence-class-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Equivalence-Class Audit Report'
        - '(?is)### Defects to fix now.*### Deferred follow-ups.*### Out-of-scope candidates discovered.*### Blocking questions.*### Test/doc implications'
        - '(?im)^Output depth:\s*standard\s*$'
        - '(?im)^Verdict:\s*(BLOCK|CONCERNS)\s*$'
        - '(?im)^Severity:\s*(CRITICAL|HIGH|MEDIUM|LOW)\s*$'
        - '(?im)^\|[ \t]*Axis[ \t]*\|[ \t]*Candidate[ \t]*\|[ \t]*Presence[ \t]*\|[ \t]*Disposition[ \t]*\|[ \t]*Evidence[ \t]*\|[ \t]*\r?\n\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*$'
        - '(?i)Presence'
        - '(?i)Disposition'
        - '(?i)Evidence'
        - '(?i)\|\s*Opposite Bound\s*\|'
        - '(?i)\|\s*Sibling Parameter/Field\s*\|'
        - '(?i)\|\s*Mirror Call Site/Use Site\s*\|'
        - '(?i)\|\s*Inverse Operation\s*\|'
        - '(?i)\|\s*Type/Schema Narrowing\s*\|'
        - '(?i)\|\s*Validation vs Normalization/Sanitization\s*\|'
        - '(?i)\|\s*Happy/Error/Retry/Cancel Path Twin\s*\|'
        - '(?i)\|\s*Race/Shared-State Twin\s*\|'
        - '(?i)\|\s*Permission/Authorization Class\s*\|'
        - '(?i)\|\s*Observability Twin\s*\|'
        - '(?i)\|\s*Resource Cleanup\s*\|'
        - '(?i)\|\s*Contract Symmetry\s*\|'
        - '(?i)\|\s*Equivalence by Naming\s*\|'
        - '(?i)\|\s*Test Mirror\s*\|'
        - '(?i)\|\s*Empty/Sentinel Equivalence\s*\|'
        - '(?i)\|\s*Async/Sync or Mode Twin\s*\|'
        - '(?i)\|\s*Documentation/Spec Prose Twin\s*\|[^\n]*\|\s*present\s*\|'
        - '(?i)\|\s*Cache/Projection/Source-of-Truth Twin\s*\|'
      not_contains:
        - "### Omitted axes (quick mode only)"
        - "Output depth: quick"
        - "Output depth: exhaustive"
        - "Gate decision:"
        - "Checklist evidence"
        - "Egress policy:"
        - "Adversarial tests:"
        - "PLAN-READY"
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/equivalence-class-audit/check-report.py
        - positive-edge-001
      timeout: 60
