# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the equivalence-class-audit skill.
tags:
  - negative-trigger
inputs:
  prompt: "Give me three low-effort weeknight dinner ideas using rice, eggs, and frozen vegetables."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/equivalence-class-audit/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Equivalence-Class Audit Report"
        - "Triggering finding:"
        - "Locked audit scope:"
        - "| Axis | Candidate | Presence | Disposition | Evidence |"
        - "|------|-----------|----------|-------------|----------|"
        - "Output depth:"
        - "Omitted axes"
        - "Defects to fix now"
        - "Deferred follow-ups"
        - "Out-of-scope candidates"
        - "Blocking questions"
        - "Test/doc implications"