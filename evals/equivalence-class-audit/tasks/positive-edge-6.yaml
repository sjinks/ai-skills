# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-006
name: Missing triggering finding blocks before enumeration
description: |
  A locked scope without a triggering finding must return the complete report
  shell without inventing candidates or emitting the audit table.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Apply equivalence-class-audit in quick mode.

    Locked audit scope: `src/pagination.ts` and `tests/pagination.test.ts`.

    No concrete defect, incident, review finding, test failure, or bug report is
    supplied. Produce the reduced report, omit the table and candidate rows, and
    ask for the smallest missing triggering finding needed to proceed.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/equivalence-class-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - equivalence-class-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Equivalence-Class Audit Report'
        - '(?is)### Defects to fix now.*### Deferred follow-ups.*### Out-of-scope candidates discovered.*### Blocking questions.*### Test/doc implications'
        - '(?m)^Triggering finding:[ \t]+(missing|not provided|not supplied|required|needed)[ \t]*$'
        - '(?im)^Locked audit scope:[ \t]+\S[^\r\n]*$'
        - '(?im)^Output depth:\s*quick\s*$'
        - '(?im)^Verdict:\s*BLOCK\s*$'
        - '(?im)^Severity:\s*UNASSESSED\s*$'
        - '(?im)^### Defects to fix now[ \t]*\r?\n-[ \t]*None[ \t]*$'
        - '(?im)^### Deferred follow-ups[ \t]*\r?\n-[ \t]*None[ \t]*$'
        - '(?im)^### Out-of-scope candidates discovered[ \t]*\r?\n-[ \t]*None[ \t]*$'
        - '(?im)^### Test/doc implications[ \t]*\r?\n-[ \t]*None[ \t]*$'
        - '(?i)Defects to fix now'
        - '(?i)Deferred follow-ups'
        - '(?i)Out-of-scope candidates discovered'
        - '(?i)Blocking questions'
        - '(?i)Test/doc implications'
      not_contains:
        - "|"
        - "Output depth: standard"
        - "Output depth: exhaustive"
        - "| Axis | Candidate | Presence | Disposition | Evidence |"
        - "|------|-----------|----------|-------------|----------|"
        - "Opposite Bound"
        - "Sibling Parameter/Field"
        - "Mirror Call Site/Use Site"
        - "Inverse Operation"
        - "Type/Schema Narrowing"
        - "Validation vs Normalization/Sanitization"
        - "Happy/Error/Retry/Cancel Path Twin"
        - "Race/Shared-State Twin"
        - "Permission/Authorization Class"
        - "Observability Twin"
        - "Resource Cleanup"
        - "Contract Symmetry"
        - "Equivalence by Naming"
        - "Test Mirror"
        - "Empty/Sentinel Equivalence"
        - "Async/Sync or Mode Twin"
        - "Documentation/Spec Prose Twin"
        - "Cache/Projection/Source-of-Truth Twin"
        - "Gate decision:"
        - "Adversarial tests:"
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/equivalence-class-audit/check-report.py
        - positive-edge-006
      timeout: 60
