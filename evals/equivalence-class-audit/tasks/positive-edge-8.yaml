# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-008
name: Partial deferral metadata blocks each candidate
description: |
  Explicit deferrals with only an owner or only a reason must each block and
  request the missing metadata rather than becoming fix-now or deferred.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Apply equivalence-class-audit.

    Triggering finding: `maxRetries` accepts `0`, which disables retries.

    Locked audit scope: `config/retry.yml`, the Retry Configuration section of
    `docs/api.md`, and the Retry Operations section of `docs/operations.md`.

    Required disposition boundary:
    - The `docs/api.md` defect must be deferred to owner Platform Docs, but no
      reason for deferral is supplied.
    - The `docs/operations.md` defect must be deferred because it is maintained
      outside this change, but no owner or owning team is supplied.

    Return the standard audit. Block each documentation disposition separately
    and ask for its missing metadata.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/equivalence-class-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - equivalence-class-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Equivalence-Class Audit Report'
        - '(?is)### Defects to fix now.*### Deferred follow-ups.*### Out-of-scope candidates discovered.*### Blocking questions.*### Test/doc implications'
        - '(?im)^Output depth:\s*standard\s*$'
        - '(?im)^Verdict:\s*BLOCK\s*$'
        - '(?im)^Severity:\s*MEDIUM\s*$'
        - '(?im)^\|[ \t]*Axis[ \t]*\|[ \t]*Candidate[ \t]*\|[ \t]*Presence[ \t]*\|[ \t]*Disposition[ \t]*\|[ \t]*Evidence[ \t]*\|[ \t]*\r?\n\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*$'
        - '(?im)^### Deferred follow-ups[ \t]*\r?\n-[ \t]*None[ \t]*(\r?\n)+### Out-of-scope candidates discovered[ \t]*$'
      not_contains:
        - "### Omitted axes (quick mode only)"
        - "Output depth: quick"
        - "Output depth: exhaustive"
        - "Gate decision:"
        - "Adversarial tests:"
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/equivalence-class-audit/check-report.py
        - positive-edge-008
      timeout: 60
