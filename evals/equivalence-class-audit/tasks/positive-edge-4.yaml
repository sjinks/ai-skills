# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-004
name: Quick output depth keeps audit focused
description: |
  The quick output-depth control should keep the audit to target-specific
  blockers and concerns instead of enumerating the full axis checklist, while
  summarizing which non-expanded axes were omitted.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Apply equivalence-class-audit in quick mode.

    Triggering finding: `maxItems` rejects negative values but still accepts
    zero, which crashes pagination.

    Locked audit scope: `src/pagination.ts` and `tests/pagination.test.ts`.

    Known fact: `tests/pagination.test.ts` does not cover zero values.

    Only report target-specific blockers and concerns; do not enumerate the
    full axis checklist. Summarize omitted axes without listing every axis as
    a table row.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/equivalence-class-audit/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - equivalence-class-audit
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Equivalence-Class Audit Report'
        - '(?ims)\A(?!.*^[ \t]*Output depth:[^\r\n]*\r?\n[\s\S]*^[ \t]*Output depth:).*\Z'
        - '(?im)^### Defects to fix now[ \t]*\r?\n-[ \t]*\S[^\r\n]*$'
        - '(?im)^### Deferred follow-ups[ \t]*\r?\n-[ \t]*\S[^\r\n]*$'
        - '(?im)^### Out-of-scope candidates discovered[ \t]*\r?\n-[ \t]*\S[^\r\n]*$'
        - '(?im)^### Blocking questions[ \t]*\r?\n-[ \t]*\S[^\r\n]*$'
        - '(?im)^### Test/doc implications[ \t]*\r?\n-[ \t]*\S[^\r\n]*$'
        - '(?im)^Output depth:\s*quick\s*$'
        - '(?im)^\|[ \t]*Axis[ \t]*\|[ \t]*Candidate[ \t]*\|[ \t]*Presence[ \t]*\|[ \t]*Disposition[ \t]*\|[ \t]*Evidence[ \t]*\|[ \t]*\r?\n\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*-{3,}[ \t]*\|[ \t]*$'
        - '(?im)^### Omitted axes \(quick mode only\)[ \t]*$'
        - '(?i)Omitted axes[^\n]*(scope|inapplicable|material)|Omitted axes[\s\S]{0,300}(scope|inapplicable|material)'
        - '(?i)Locked audit scope'
        - '(?is)(zero.*pagination|pagination.*zero)'
        - '(?im)^\|[ \t]*Opposite Bound[ \t]*\|[^\r\n|]*(zero|maxItems)[^\r\n|]*\|[ \t]*present[ \t]*\|[ \t]*fix-now[ \t]*\|(?![ \t]*<!--)(?![ \t]*(?:&nbsp;|&#160;|&#xA0;)[ \t]*\|)(?=[^\r\n|]*(?:src/pagination\.ts|tests/pagination\.test\.ts|triggering finding))[^\r\n|]+\|[ \t]*$'
        - '(?im)^\|[ \t]*Test Mirror[ \t]*\|[^\r\n|]*zero[^\r\n|]*\|[ \t]*present[ \t]*\|[ \t]*fix-now[ \t]*\|(?![ \t]*<!--)(?![ \t]*(?:&nbsp;|&#160;|&#xA0;)[ \t]*\|)(?=[^\r\n|]*(?:tests/pagination\.test\.ts|triggering finding))[^\r\n|]+\|[ \t]*$'
        - '(?ims)\A(?!.*^[ \t]*\|(?=[^\r\n|]*(?:Sibling[^\r\n|]*Parameter|Mirror[^\r\n|]*Call|Inverse|Type[^\r\n|]*Schema|Validation|Happy[^\r\n|]*Error|Race[^\r\n|]*Shared|Cache[^\r\n|]*Projection|Permission[^\r\n|]*Authorization|Resource[^\r\n|]*Cleanup|Observability|Contract[^\r\n|]*Symmetry|Equivalence[^\r\n|]*Naming|Empty[^\r\n|]*Sentinel|Async[^\r\n|]*Sync|Documentation[^\r\n|]*Spec))[^\r\n]*).*\Z'
      not_contains:
        - "Output depth: standard"
        - "Output depth: exhaustive"
        - "Egress policy:"
        - "Trusted root:"
        - "Adversarial tests:"