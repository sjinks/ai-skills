# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: auth-claim-contract-review-eval
description: |
  Evaluates the auth-claim-contract-review skill: it activates for auth and
  security claim-contract reviews involving optional claims, missing-vs-invalid
  semantics, issuer-validator-consumer drift, role/scope/permission/tenant
  mapping, origin markers, propagation, serialization/cache/session restore,
  revocation/freshness, fallback defaults, and confused-deputy risks; stays
  silent on auth-adjacent prompts with no claim-contract question; is invoked
  when expected; and emits the skill's required output (verdict, target/claim
  contract context, findings with severity/classification/evidence/risk/fix/tests,
  checklist status, assumptions/unverified areas, and residual risk).
skill: auth-claim-contract-review
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output carries the auth claim contract review contract and identifies the specific claim risks the prompt asks about.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required claim-contract risk judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 12000
tasks:
  - "tasks/*.yaml"