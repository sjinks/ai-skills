# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Auth and password-reset UX copy with no claim semantics
description: |
  Auth-adjacent login and password-reset copy work with no token, session,
  claim, validation, mapping, propagation, or authorization semantics should
  not activate the skill.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Help me polish the empty-state copy on our sign-in and password-reset
    screens. The product team wants friendlier text for "Your session expired,
    please sign in again", "Check your email for a reset link", and button
    labels for retrying login. There is no code review, token handling, claim
    parsing, or authorization behavior involved.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/auth-claim-contract-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Target/claim contract context:"
        - "Missing-vs-invalid semantics"
        - "Checklist status:"
        - "Residual risk:"