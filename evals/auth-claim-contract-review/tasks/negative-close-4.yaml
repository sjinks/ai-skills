# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-004
name: Synthetic token decoding example without claim-contract review
description: |
  A synthetic/redacted token-decoding education prompt should not activate the
  skill and must not request raw tokens, auth headers, private keys,
  credentials, PII, private raw data, or live auth testing.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    For a training slide, explain at a high level how base64url decoding works
    on this synthetic and fully redacted JWT-like example:

    header.eyJzdWIiOiJzeW50aGV0aWMtdXNlciIsInNjb3BlIjoiZXhhbXBsZSJ9.signature

    Use the sample only to explain the encoding shape. Do not inspect secrets,
    request or decode real tokens, request production auth headers, ask for
    private keys, credentials, customer PII, private raw data, or perform live
    auth testing. This is not a claim-contract review or security decision.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/auth-claim-contract-review/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Findings:"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Target/claim contract context:"
        - "Missing-vs-invalid semantics"
        - "Checklist status:"
        - "Residual risk:"
        - "send me the token"
        - "paste the token"
        - "paste the Authorization header"
        - "send the Authorization header"
        - "share your private key"
        - "send credentials"
        - "share credentials"
        - "send customer PII"
        - "share customer PII"
        - "send private raw data"
        - "share private raw data"
        - "run this against production"
        - "test against live auth"