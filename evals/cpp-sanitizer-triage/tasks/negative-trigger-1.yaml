# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic houseplant question
description: Unrelated everyday question must not activate the sanitizer-triage skill.
tags:
  - negative-trigger
inputs:
  prompt: "Why are the leaves on my monstera turning yellow at the edges?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-sanitizer-triage/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Sanitizer:"
        - "Root cause:"
        - "Checklist status:"
