# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Core dump debugging without sanitizers
description: |
  Plain core-dump/gdb debugging with no sanitizer involved is out of scope;
  the skill must not activate.
tags:
  - negative-close
inputs:
  prompt: |
    Our release binary (no sanitizers, -O2, stripped) dumped core in
    production. Walk me through loading the core in gdb with separate debug
    symbols, picking the right thread, and inspecting the crashed frame's
    locals.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-sanitizer-triage/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Sanitizer:"
        - "Root cause:"
        - "Checklist status:"
