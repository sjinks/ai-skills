# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-008
name: Approved applied edits stay minimal and claim-tied
description: Explicit applied-edit approval should correct only contradicted claims and preserve accurate sentences.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck on this short draft. I explicitly approve applied edits for
    inaccurate factual claims only. Leave accurate sentences intact; do not
    style-edit, rewrite the whole draft, or improve the wording beyond the
    fact-tied correction.

    Draft: "The North River tram opened to riders in 2018. It connects Harbor
    Station with Pine Market."

    Evidence:
    - City transit authority history page: "The North River tram opened to
      riders on May 6, 2020."
    - Current route map excerpt: "North River tram: Harbor Station to Pine
      Market."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Evidence Reviewed"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Claims Checked[\s\S]{0,480}- C2:'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?i)Findings[\s\S]{0,240}- C1[\s\S]{0,240}Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?i)Findings[\s\S]{0,480}- C2[\s\S]{0,240}Verdict:[^\S\r\n]*(SUPPORTED|MOSTLY_SUPPORTED)'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Recommended Corrections[\s\S]{0,480}C2:[^\S\r\n]*\S'
        - "(?i)Fact-Check Summary"
        - '(?i)Mode:[^\S\r\n]*applied edits approved'
        - "(?i)Claims Checked"
        - "(?i)Findings"
        - "(?i)Recommended Corrections"
        - "(?i)(2020|May 6, 2020)"
        - '(?i)Harbor Station(?:[^\S\r\n]*|[\s\S]{0,80})Pine Market'
        - "(?i)(applied edit|applied edits|change summary|minimal correction)"
      not_contains:
        - "Mode: report-only"
        - "Mode: correction proposals approved"
        - "Here is the full rewritten draft"
        - "Here is a polished version"
        - "more polished"
        - "improved flow"
        - "style-edited"
        - "rewrote the whole draft"
        - "rewritten for clarity"
        - "I improved the wording"
        - "I changed the accurate sentence"