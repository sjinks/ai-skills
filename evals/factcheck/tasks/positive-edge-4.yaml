# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-004
name: Report-only mode does not rewrite the draft
description: Explicit report-only request should avoid rewritten copy.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Fact-check this draft paragraph, but do not rewrite it or apply edits.

    Draft: "Venus is the closest planet to the Sun. It has a thick atmosphere
    dominated by carbon dioxide."

    Evidence:
    - Planetary fact sheet excerpt: "Mercury is the closest planet to the
      Sun. Venus has a thick atmosphere made primarily of carbon dioxide."

    Return only the fact-check report and any minimal correction proposal tied
    to claim IDs. Use only the supplied evidence; do not fill gaps from memory.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Evidence Reviewed"
        - "(?i)Findings"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Claims Checked[\s\S]{0,480}- C2:'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?i)Findings[\s\S]{0,240}- C1[\s\S]{0,240}Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?i)Findings[\s\S]{0,480}- C2[\s\S]{0,240}Verdict:[^\S\r\n]*(SUPPORTED|MOSTLY_SUPPORTED)'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Recommended Corrections[\s\S]{0,480}C2:[^\S\r\n]*\S'
        - "(?i)Fact-Check Summary"
        - '(?i)Mode:[^\S\r\n]*report-only'
        - "(?i)Claims Checked"
        - "(?i)Recommended Corrections"
        - '(?i)Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?i)Verdict:[^\S\r\n]*(SUPPORTED|MOSTLY_SUPPORTED)'
        - "(?i)(Mercury|closest planet|carbon dioxide)"
      not_contains:
        - "Rewritten draft:"
        - "Corrected draft:"
        - "Edited paragraph:"
        - "Here is the revised paragraph"
        - "I have rewritten"