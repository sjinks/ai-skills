# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-003
name: Conflicting sources are surfaced with source taxonomy
description: Conflicting official and news evidence should not become a flat supported verdict.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck to verify this launch-date claim. Report only.

    Claim: "Acme Search announced general availability of Atlas Search on
    April 1, 2026."

    Evidence:
    - Acme official release notes dated May 2, 2026: "Atlas Search is now
      generally available. The April 1 preview remains available to beta users."
    - Reputable Tech Daily article dated April 1, 2026: "Acme launches Atlas
      Search today," based on a preview briefing.
    - Acme product blog dated April 1, 2026: "Public preview begins today."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Mode:[^\S\r\n]*report-only'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Claims Checked"
        - "(?i)Recommended Corrections"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - "(?i)Fact-Check Summary"
        - "(?i)Evidence Reviewed"
        - "(?i)Findings"
        - '(?i)Verdict:[^\S\r\n]*(MIXED|CONTRADICTED|MOSTLY_SUPPORTED)'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - "(?i)(official|reputable-news|conflicted|secondary|primary)"
        - "(?i)(April 1|May 2|general availability|preview)"
        - "(?i)(conflict|conflicting|source|release notes)"
      not_contains:
        - "Verdict: SUPPORTED"
        - "Rewritten draft:"