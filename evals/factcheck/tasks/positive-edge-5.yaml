# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Approved minimal corrections remain claim-tied
description: Correction proposals should be minimal and tied to claim IDs when approved.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck on these two product claims. I approve minimal correction
    proposals after the report, but do not rewrite the whole paragraph.

    Draft claims:
    - "The service launched in 2024."
    - "The free tier includes unlimited storage."

    Evidence:
    - Official changelog: "The service reached public launch on January 15,
      2025."
    - Pricing page excerpt: "Free tier includes 5 GB storage. Paid plans add
      higher storage limits."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Claims Checked"
        - "(?i)Evidence Reviewed"
        - "(?i)Findings"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Claims Checked[\s\S]{0,480}- C2:'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?i)Findings[\s\S]{0,240}- C1[\s\S]{0,240}Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?i)Findings[\s\S]{0,480}- C2[\s\S]{0,240}Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Recommended Corrections[\s\S]{0,480}C2:[^\S\r\n]*\S'
        - "(?i)Fact-Check Summary"
        - '(?i)Mode:[^\S\r\n]*correction proposals approved'
        - "(?i)Recommended Corrections"
        - '(?i)Verdict:[^\S\r\n]*CONTRADICTED'
        - "(?i)(2025|January 15, 2025|5 GB|not unlimited)"
        - "(?i)(minimal|proposal|correction)"
      not_contains:
        - "Rewritten draft:"
        - "Here is the full rewritten paragraph"
        - "Edited paragraph:"