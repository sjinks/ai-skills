# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Approved minimal corrections remain claim-tied
description: Correction proposals should be minimal and tied to claim IDs when approved.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck on these two product claims. I approve minimal correction
    proposals after the report, but do not rewrite the whole paragraph.

    Draft claims:
    - "The service launched in 2024."
    - "The free tier includes unlimited storage."

    Evidence:
    - Official changelog: "The service reached public launch on January 15,
      2025."
    - Pricing page excerpt: "Free tier includes 5 GB storage. Paid plans add
      higher storage limits."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)Scope"
        - "(?i)Claims Checked"
        - "(?i)Evidence Reviewed"
        - "(?i)Findings"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:\s*\S'
        - '(?i)Date/currentness:\s*\S'
        - '(?i)Limitation:\s*\S'
        - '(?i)Checkability:\s*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:\s*\S'
        - '(?i)Evidence:\s*\S'
        - '(?i)Reasoning:\s*\S'
        - '(?i)Recommended Corrections[\s\S]{0,240}C1:'
        - "(?i)Fact-Check Summary"
        - '(?i)Mode:\s*correction proposals approved'
        - "(?i)Recommended Corrections"
        - "(?i)C1"
        - "(?i)C2"
        - '(?i)Verdict:\s*CONTRADICTED'
        - "(?i)(2025|January 15, 2025|5 GB|not unlimited)"
        - "(?i)(minimal|proposal|correction)"
      not_contains:
        - "Rewritten draft:"
        - "Here is the full rewritten paragraph"
        - "Edited paragraph:"