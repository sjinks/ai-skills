# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-006
name: Sensitive-domain health claim uses conservative boundaries
description: Medical/public-health claims should be handled as high-impact fact checks, not advice.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck on this newsletter claim. Report only.

    Claim: "Taking hibiscus capsules cures hypertension, so patients can stop
    prescribed blood-pressure medication."

    Evidence provided:
    - A supplement brand blog says customers report lower blood pressure after
      using its capsules.
    - A public-health guidance excerpt says patients should not stop prescribed
      blood-pressure medication without clinician guidance.
    - A review abstract says hibiscus may modestly lower blood pressure in some
      studies but is not established as a cure for hypertension.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Mode:[^\S\r\n]*report-only'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Claims Checked"
        - "(?i)Evidence Reviewed"
        - "(?i)Recommended Corrections"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - "(?i)Fact-Check Summary"
        - '(?i)Sensitive domain:[^\S\r\n]*yes,\s*\S'
        - "(?i)Findings"
        - '(?i)Verdict:[^\S\r\n]*(CONTRADICTED|UNSUPPORTED|MIXED)'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - "(?i)(medical|health|public health|not professional advice|clinician|prescribed medication)"
        - "(?i)(peer-reviewed|recognized-domain-authority|official|conflicted)"
        - "(?i)(cure|hypertension|stop prescribed|modestly lower)"
      not_contains:
        - "Patients should stop"
        - "You should stop"
        - "Rewritten draft:"