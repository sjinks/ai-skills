# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Unavailable evidence is marked unverifiable
description: Private or inaccessible evidence should produce UNVERIFIABLE and limits.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck for this report sentence. Stay report-only.

    Sentence: "Our internal 2025 incident memo shows that product outages fell
    by 73% after the migration."

    Evidence available to you: a citation placeholder named "Internal Memo Q4"
    with no excerpt, no file, no date, and no accessible URL. Do not use outside
    search; only assess the evidence I provided.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Mode:[^\S\r\n]*report-only'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Claims Checked"
        - "(?i)Recommended Corrections"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - "(?i)Fact-Check Summary"
        - "(?i)Evidence Reviewed"
        - "(?i)Findings"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - '(?i)Verdict:[^\S\r\n]*UNVERIFIABLE'
        - '(?i)Confidence:[^\S\r\n]*low'
        - "(?i)(unavailable|inaccessible|not provided|placeholder|no excerpt|no external search)"
      not_contains:
        - "Verdict: SUPPORTED"
        - "Verdict: CONTRADICTED"
        - "Rewritten draft:"