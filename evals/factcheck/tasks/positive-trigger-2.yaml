# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Citation support review for a draft paragraph
description: Citation/source-support review should trigger factcheck.
tags:
  - positive-trigger
inputs:
  prompt: |
    Use factcheck to review whether this citation supports the sentence. Return
    a report only; do not rewrite.

    Draft sentence: "Malaria is caused by a virus, according to the World
    Health Organization."

    Citation excerpt supplied by the author: "The World Health Organization
    describes malaria as a life-threatening disease caused by Plasmodium
    parasites that are transmitted to people through the bites of infected
    female Anopheles mosquitoes."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Mode:[^\S\r\n]*report-only'
        - '(?i)Sensitive domain:[^\S\r\n]*yes,\s*(medical|public health)'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - "(?i)Fact-Check Summary"
        - "(?i)Claims Checked"
        - "(?i)Evidence Reviewed"
        - "(?i)Findings"
        - "(?i)Recommended Corrections"
        - '(?i)Verdict:[^\S\r\n]*(CONTRADICTED|UNSUPPORTED)'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - "(?i)(official|recognized-domain-authority|user-provided)"
        - "(?i)(WHO|World Health Organization|Plasmodium|parasites|virus)"
        - "(?i)(citation|source|supports?)"
        - "(?i)(not professional advice|fact-?check.*not.*advice)"
      not_contains:
        - "Rewritten draft:"
        - "Verdict: CLEAN"
        - "license-risk"