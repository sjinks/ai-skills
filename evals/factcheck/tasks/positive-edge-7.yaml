# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-007
name: Opinion and factual claims are separated
description: Opinion-vs-fact handling should mark non-factual claims explicitly.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck on this restaurant blurb. Report only.

    Blurb: "North Pier Cafe is the best coffee shop in town. It opened in
    2018 and won the 2023 City Roasters award."

    Evidence:
    - Business registry excerpt: "North Pier Cafe opened March 2019."
    - City Roasters award list: "2023 winner: North Pier Cafe."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Mode:[^\S\r\n]*report-only'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Evidence Reviewed"
        - "(?i)Recommended Corrections"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Claims Checked[\s\S]{0,480}- C2:'
        - '(?i)Claims Checked[\s\S]{0,720}- C3:'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?i)Findings[\s\S]{0,240}- C1[\s\S]{0,240}Verdict:[^\S\r\n]*NOT_A_FACTUAL_CLAIM'
        - '(?i)Findings[\s\S]{0,480}- C2[\s\S]{0,240}Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?i)Findings[\s\S]{0,720}- C3[\s\S]{0,240}Verdict:[^\S\r\n]*(SUPPORTED|MOSTLY_SUPPORTED)'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Recommended Corrections[\s\S]{0,480}C2:[^\S\r\n]*\S'
        - '(?i)Recommended Corrections[\s\S]{0,720}C3:[^\S\r\n]*\S'
        - "(?i)Fact-Check Summary"
        - "(?i)Claims Checked"
        - "(?i)Findings"
        - "(?i)(best coffee shop|opinion|preference|2019|2023 City Roasters)"
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
      not_contains:
        - "Verdict: BLOCK"
        - "Rewritten draft:"