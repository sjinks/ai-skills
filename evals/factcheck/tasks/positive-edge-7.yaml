# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-007
name: Opinion and factual claims are separated
description: Opinion-vs-fact handling should mark non-factual claims explicitly.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck on this restaurant blurb. Report only.

    Blurb: "North Pier Cafe is the best coffee shop in town. It opened in
    2018 and won the 2023 City Roasters award."

    Evidence:
    - Business registry excerpt: "North Pier Cafe opened March 2019."
    - City Roasters award list: "2023 winner: North Pier Cafe."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)Fact-Check Summary"
        - "(?i)Claims Checked"
        - "(?i)Findings"
        - '(?i)Verdict:\s*NOT_A_FACTUAL_CLAIM'
        - '(?i)Verdict:\s*CONTRADICTED'
        - '(?i)Verdict:\s*(SUPPORTED|MOSTLY_SUPPORTED)'
        - "(?i)(best coffee shop|opinion|preference|2019|2023 City Roasters)"
        - '(?i)Confidence:\s*(high|medium|low)'
      not_contains:
        - "Verdict: BLOCK"
        - "Rewritten draft:"