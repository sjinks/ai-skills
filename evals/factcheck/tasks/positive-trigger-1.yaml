# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Direct fact-check request on mixed factual claims
description: Explicit fact-check request should trigger and produce claim-level verdicts.
tags:
  - positive-trigger
inputs:
  prompt: |
    Use factcheck to verify these claims for a short museum label. Stay in
    report-only mode.

    Claims:
    1. The Eiffel Tower opened to the public in 1889.
    2. It remained the tallest man-made structure in the world until the
       Chrysler Building surpassed it in 1930.
    3. The Eiffel Tower is located in Berlin.

    Evidence:
    - Reference excerpt A: "The Eiffel Tower opened to the public in 1889."
    - Reference excerpt B: "At 300 metres, the Eiffel Tower remained the
      world's tallest man-made structure until the Chrysler Building was
      completed in 1930."
    - Reference excerpt C: "The Eiffel Tower stands on the Champ de Mars in
      Paris, France."

    Use only the supplied evidence; do not fill gaps from general historical
    knowledge or rewrite the label.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Mode:[^\S\r\n]*report-only'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Claims Checked[\s\S]{0,480}- C2:'
        - '(?i)Claims Checked[\s\S]{0,720}- C3:'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?i)Findings[\s\S]{0,240}- C1[\s\S]{0,240}Verdict:[^\S\r\n]*(SUPPORTED|MOSTLY_SUPPORTED)'
        - '(?i)Findings[\s\S]{0,480}- C2[\s\S]{0,240}Verdict:[^\S\r\n]*(SUPPORTED|MOSTLY_SUPPORTED)'
        - '(?i)Findings[\s\S]{0,720}- C3[\s\S]{0,240}Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - '(?i)Recommended Corrections[\s\S]{0,480}C2:[^\S\r\n]*\S'
        - '(?i)Recommended Corrections[\s\S]{0,720}C3:[\s\S]{0,240}(Paris|France)'
        - "(?i)Fact-Check Summary"
        - "(?i)Scope"
        - "(?i)Claims Checked"
        - "(?i)Evidence Reviewed"
        - "(?i)Findings"
        - "(?i)Recommended Corrections"
        - "(?i)Open Questions"
        - "(?i)Verification Limits"
        - "(?i)Residual Uncertainty"
        - '(?i)Verdict:[^\S\r\n]*(SUPPORTED|MOSTLY_SUPPORTED)'
        - '(?i)Verdict:[^\S\r\n]*CONTRADICTED'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - "(?i)(Paris|Berlin)"
      not_contains:
        - "Verdict: BLOCK"
        - "Gate decision:"
        - "Rewritten label:"
        - "Rewritten draft:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response correctly fact-checks the three claims:
        - It extracts each claim with claim IDs.
        - It marks the 1889 public opening and tallest-structure claim as supported or mostly supported.
        - It marks the Berlin location claim as contradicted and ties the correction to Paris/France.
        - It stays in report-only mode and does not rewrite the label.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or misses one required boundary.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent