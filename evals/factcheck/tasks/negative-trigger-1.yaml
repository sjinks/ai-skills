# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: General research background request
description: General research without a specific claim should not activate factcheck.
tags:
  - negative-trigger
inputs:
  prompt: |
    Research the history of urban bicycle infrastructure and give me a short
    overview with a few themes I could explore in an essay.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Fact-Check Summary\n- Overall result:"
        - "Claims Checked\n- C1:"
        - "Evidence Reviewed\n- E1:"
        - "Findings\n- C1\n  Verdict:"
        - "Recommended Corrections\n- C1:"
        - "Verification Limits\n- "
        - "Residual Uncertainty\n- "