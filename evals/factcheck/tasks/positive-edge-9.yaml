# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-009
name: Inaccessible evidence is UNVERIFIABLE not UNSUPPORTED
description: When evidence could not be accessed rather than failing to support, the verdict is UNVERIFIABLE.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Use factcheck on this claim. Report only. You have no external search and
    cannot open the cited link.

    Claim: "The agency's 2022 report found that wait times fell by 30%."

    Evidence:
    - The only citation is a link to the agency's report portal, which is not
      provided as text and cannot be opened in this session.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/factcheck/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - factcheck
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Fact-Check Summary$[\s\S]*^Scope$[\s\S]*^Claims Checked$[\s\S]*^Evidence Reviewed$[\s\S]*^Findings$[\s\S]*^Recommended Corrections$[\s\S]*^Open Questions$[\s\S]*^Verification Limits$[\s\S]*^Residual Uncertainty$'
        - '(?i)Overall result:[^\S\r\n]*\S'
        - '(?i)Mode:[^\S\r\n]*report-only'
        - '(?i)Sensitive domain:[^\S\r\n]*no'
        - '(?i)Target:[^\S\r\n]*\S'
        - '(?i)In scope:[^\S\r\n]*\S'
        - '(?i)Out of scope:[^\S\r\n]*\S'
        - '(?i)Time frame / jurisdiction / domain:[^\S\r\n]*\S'
        - "(?i)Scope"
        - "(?i)Evidence Reviewed"
        - "(?i)Recommended Corrections"
        - "(?i)Open Questions"
        - "(?i)Residual Uncertainty"
        - '(?i)E1:'
        - '(?i)Type:[^\S\r\n]*\S'
        - '(?i)Date/currentness:[^\S\r\n]*\S'
        - '(?i)Relevance:[^\S\r\n]*\S'
        - '(?i)Limitation:[^\S\r\n]*\S'
        - '(?i)Location:[^\S\r\n]*\S'
        - '(?i)Checkability:[^\S\r\n]*(factual|partly factual|not factual)'
        - '(?i)Confidence reason:[^\S\r\n]*\S'
        - '(?i)Evidence:[^\S\r\n]*\S'
        - '(?i)Reasoning:[^\S\r\n]*\S'
        - '(?m)^Claims Checked$(?:(?!^Evidence Reviewed$)[\s\S])*^- C1:[^\r\n]+'
        - '(?m)^Findings$(?:(?!^Recommended Corrections$)[\s\S])*^- C1\n(?:(?!^- C[0-9]+$)[\s\S])*^  Verdict:'
        - '(?m)^Recommended Corrections$(?:(?!^Open Questions$)[\s\S])*^- C1:[^\r\n]+'
        - "(?i)Fact-Check Summary"
        - "(?i)Claims Checked"
        - "(?i)Findings"
        - '(?i)Verdict:[^\S\r\n]*UNVERIFIABLE'
        - '(?i)Confidence:[^\S\r\n]*(high|medium|low)'
        - "(?i)Verification Limits"
        - "(?i)(could not|cannot|unavailable|inaccessible|not provided)"
      not_contains:
        - "Verdict: BLOCK"
        - "Verdict: UNSUPPORTED"
        - "Rewritten draft:"
