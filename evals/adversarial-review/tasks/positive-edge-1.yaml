# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Unreadable artifact triggers BLOCK
description: |
  Per the skill, an empty or unreadable target must produce a BLOCK verdict with
  one Open question finding whose Suggested fix requests the exact missing
  artifact or context, not a fabricated review.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Adversarial-review this spec:

    [REDACTED — only the title was shared; body unavailable]

    Produce a verdict.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Target:'
        - '(?i)Intended behavior:'
        - '(?i)Evidence basis:'
        - '(?i)What works:\s*Pending - target unavailable'
        - '(?i)Assumptions:'
        - '(?i)Findings:'
        - '(?im)^[ \t]*Artifact:[^\n]+\n[ \t]*Category:[^\n]+\n[ \t]*Severity:[ \t]*(CRITICAL|HIGH|MEDIUM|LOW)[ \t]*\n[ \t]*Confidence:[ \t]*(high|medium|low)[ \t]*\n[ \t]*Classification:[ \t]*Open question[ \t]*\n[ \t]*Trigger:[^\n]+\n[ \t]*Risk:[^\n]+\n[ \t]*Evidence:[^\n]+\n[ \t]*Suggested fix:[^\n]+'
        - '(?i)Adversarial tests:\s*Pending - target unavailable'
        - '(?i)Mitigations / acceptance criteria:\s*Pending - target unavailable'
        - '(?i)Residual risk:'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the missing-target response emits exactly one finding,
        classifies it as Open question, explains that the target is unavailable,
        and does not invent any substantive defect or additional finding. The
        finding's Suggested fix must explicitly request the exact missing
        material needed to continue; for this prompt, that is the specification
        body or equivalent target content.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.

        Full success: exactly one blocker finding, an exact request in Suggested fix, and no fabricated claims.
        Partial completion (fail): the request is vague or in the wrong field, but the blocker is otherwise correct.
        Failure: no context request, additional findings, or fabricated target claims are present.
      mode: independent
