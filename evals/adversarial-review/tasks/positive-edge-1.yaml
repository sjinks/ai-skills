# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Unreadable artifact triggers BLOCK
description: |
  Per the skill, an empty or unreadable target must produce a BLOCK verdict with
  one Open question finding whose Suggested fix requests the exact missing
  artifact or context, not a fabricated review.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Adversarial-review this spec:

    [REDACTED — only the title was shared; body unavailable]

    Produce a verdict.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:[ \t]*BLOCK[ \t]*\r?$'
        - '(?im)^Target:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Intended behavior:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Evidence basis:[ \t]*[^\r\n]+\r?$'
        - '(?im)^What works:[ \t]*Pending - target unavailable[ \t]*\r?$'
        - '(?im)^Assumptions:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Findings:[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*1\.[^\r\n]+\r?\n[ \t]+Artifact:[^\r\n]+\r?\n[ \t]+Category:[ \t]*(requirements-clarity|contract-logic|input-handling|error-rollback|state-concurrency|auth-tenancy|data-integrity|resource-lifecycle|user-workflow|verification-gap)[ \t]*\r?\n[ \t]+Severity:[ \t]*(CRITICAL|HIGH|MEDIUM|LOW)[ \t]*\r?\n[ \t]+Confidence:[ \t]*(high|medium|low)[ \t]*\r?\n[ \t]+Classification:[ \t]*Open question[ \t]*\r?\n[ \t]+Trigger:[^\r\n]+\r?\n[ \t]+Risk:[^\r\n]+\r?\n[ \t]+Evidence:[^\r\n]+\r?\n[ \t]+Suggested fix:[^\r\n]+'
        - '(?im)^Adversarial tests:[ \t]*Pending - target unavailable[ \t]*\r?$'
        - '(?im)^Mitigations / acceptance criteria:[ \t]*Pending - target unavailable[ \t]*\r?$'
        - '(?im)^Residual risk:[ \t]*[^\r\n]+\r?$'
      not_contains:
        - "Gate decision:"
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the missing-target response emits exactly one finding,
        classifies it as Open question, explains that the target is unavailable,
        and does not invent any substantive defect or additional finding. The
        finding's Suggested fix must explicitly request the exact missing
        material needed to continue; for this prompt, that is the specification
        body or equivalent target content.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = exactly one blocker finding, an exact request in Suggested fix, and no fabricated claims.
        0.5 = the request is vague or in the wrong field, but the blocker is otherwise correct.
        0.0 = no context request, additional findings, or fabricated target claims are present.
      mode: independent
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/_helpers/check-adversarial-review-report.py
      timeout: 30
