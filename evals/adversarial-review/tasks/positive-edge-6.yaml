# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-006
name: Matching immutable revision retains prior verdict
description: |
  Matching immutable revision identifiers establish the same target revision
  even when the caller names that revision explicitly.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Do another adversarial-review pass on notification spec revision
    `sha256:4fd2`. The prior pass reviewed that exact immutable revision and
    produced:

      Verdict: BLOCK
      Target: notification-retry spec revision sha256:4fd2
      Findings:
      1. Retry has no idempotency key
        Artifact: spec section "Retry"
        Category: error-rollback
        Trigger: a timeout after acceptance re-sends the same notification
        Severity: HIGH

    Your new review observation is that fixed one-second backoff without jitter
    could cause a bounded thundering herd. Do not duplicate the prior finding.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:[ \t]*BLOCK[ \t]*\r?$'
        - '(?im)^Target:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Intended behavior:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Evidence basis:[ \t]*[^\r\n]+\r?$'
        - '(?im)^What works:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Assumptions:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Findings:[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*1\.[^\r\n]+\r?\n[ \t]+Artifact:[^\r\n]+\r?\n[ \t]+Category:[ \t]*(requirements-clarity|contract-logic|input-handling|error-rollback|state-concurrency|auth-tenancy|data-integrity|resource-lifecycle|user-workflow|verification-gap)[ \t]*\r?\n[ \t]+Severity:[ \t]*(CRITICAL|HIGH|MEDIUM|LOW)[ \t]*\r?\n[ \t]+Confidence:[ \t]*(high|medium|low)[ \t]*\r?\n[ \t]+Classification:[ \t]*(Confirmed issue|Likely risk|Open question|Accepted tradeoff|Test gap)[ \t]*\r?\n[ \t]+Trigger:[^\r\n]+\r?\n[ \t]+Risk:[^\r\n]+\r?\n[ \t]+Evidence:[^\r\n]+\r?\n[ \t]+Suggested fix:[^\r\n]+'
        - '(?im)^Adversarial tests:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Mitigations / acceptance criteria:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Residual risk:[ \t]*[^\r\n]+\r?$'
        - '(?i)(jitter|backoff|thundering)'
      not_contains:
        - "Gate decision:"
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response treats the matching immutable identifier as
        sufficient same-revision evidence when no revised-target evidence is
        supplied. It must retain BLOCK for the unresolved prior HIGH finding,
        reference that prior finding without duplicating it as fresh, and report
        the no-jitter review observation as net-new.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response retains BLOCK, deduplicates, and reports the new finding.
        0.5 = response gets two of those three behaviors right.
        0.0 = response treats the matching revision as revised or misses the core behavior.
      mode: independent
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/_helpers/check-adversarial-review-report.py
      timeout: 30