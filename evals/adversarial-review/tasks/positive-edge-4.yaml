# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-004
name: Revised target may weaken a prior verdict
description: |
  A revised target that resolves every prior blocking finding is reviewed on
  current evidence rather than permanently inheriting the old verdict.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Adversarial-review this revised notification-retry spec. The prior revision
    received Verdict: BLOCK because retries had no idempotency key and the retry
    counter existed only in memory.

    Revised spec: Every notification has a server-generated stable idempotency
    key persisted with its payload. Every retry reuses that key. The downstream
    service atomically records accepted keys and returns the original result for
    duplicates. Retry count and next-attempt time are persisted transactionally.
    Tests cover timeout-after-acceptance, worker restart, duplicate delivery,
    and exhausted retries. Alerts track retry exhaustion and duplicate rates.

    Review the revised artifact on its current evidence. Do not retain BLOCK
    merely because the prior revision was blocked.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*(CLEAN|CONCERNS)'
        - '(?i)Target:'
        - '(?i)Intended behavior:'
        - '(?i)Evidence basis:'
        - '(?i)What works:'
        - '(?i)Assumptions:'
        - '(?i)Findings:'
        - '(?i)Adversarial tests:'
        - '(?i)Mitigations / acceptance criteria:'
        - '(?i)Residual risk:'
      not_contains:
        - "Verdict: BLOCK"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response reviews the revised artifact on current
        evidence rather than applying verdict monotonicity across revisions.
        It should acknowledge that the prior idempotency and durable-state
        findings are resolved, avoid re-reporting them as current defects, and
        emit CLEAN or CONCERNS rather than BLOCK. A CLEAN response must use
        Findings: None. A CONCERNS response must include at least one complete
        current finding with Artifact, Category, Severity, Confidence,
        Classification, Trigger, Risk, Evidence, and Suggested fix.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly reviews the revised artifact and weakens the verdict.
        0.5 = response reaches CLEAN or CONCERNS but incompletely explains remediation.
        0.0 = response retains BLOCK or treats resolved prior findings as current defects.
      mode: independent