# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic coffee-brewing question
description: Unrelated everyday question must not activate adversarial-review.
tags:
  - negative-trigger
inputs:
  prompt: "What's a good way to brew pour-over coffee at home for two cups?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: negative
      threshold: 0.3
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/_helpers/check-adversarial-review-report.py
        - --reject
      timeout: 30
