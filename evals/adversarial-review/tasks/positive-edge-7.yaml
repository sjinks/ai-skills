# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-007
name: Changed context overrides matching revision identifier
description: |
  Changed target-defining context establishes a revised target even when the
  artifact carries the same immutable identifier.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Adversarial-review notification spec revision `sha256:8ac1` again. A prior
    pass on that identifier produced:

      Verdict: BLOCK
      Target: notification spec revision sha256:8ac1
      Findings:
      1. Tenant ownership is not enforced
        Artifact: spec section "Download"
        Category: auth-tenancy
        Trigger: a tenant requests another tenant's notification export
        Severity: HIGH

    The artifact text and identifier are unchanged, but target-defining context
    has changed: deployment evidence now confirms the gateway enforces tenant
    ownership before this handler and integration tests cover cross-tenant
    denial. Your new review observation is that fixed retry backoff has no jitter.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:[ \t]*(CONCERNS|BLOCK)[ \t]*\r?$'
        - '(?im)^Target:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Intended behavior:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Evidence basis:[ \t]*[^\r\n]+\r?$'
        - '(?im)^What works:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Assumptions:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Findings:[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*1\.[^\r\n]+\r?\n[ \t]+Artifact:[^\r\n]+\r?\n[ \t]+Category:[ \t]*(requirements-clarity|contract-logic|input-handling|error-rollback|state-concurrency|auth-tenancy|data-integrity|resource-lifecycle|user-workflow|verification-gap)[ \t]*\r?\n[ \t]+Severity:[ \t]*(CRITICAL|HIGH|MEDIUM|LOW)[ \t]*\r?\n[ \t]+Confidence:[ \t]*(high|medium|low)[ \t]*\r?\n[ \t]+Classification:[ \t]*(Confirmed issue|Likely risk|Open question|Accepted tradeoff|Test gap)[ \t]*\r?\n[ \t]+Trigger:[^\r\n]+\r?\n[ \t]+Risk:[^\r\n]+\r?\n[ \t]+Evidence:[^\r\n]+\r?\n[ \t]+Suggested fix:[^\r\n]+'
        - '(?im)^Adversarial tests:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Mitigations / acceptance criteria:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Residual risk:[ \t]*[^\r\n]+\r?$'
        - '(?i)(context|gateway|ownership|revised)'
        - '(?i)(jitter|backoff)'
      not_contains:
        - "Gate decision:"
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether changed target-defining context overrides the matching
        immutable identifier. The response must treat the prior ownership
        finding as resolved context rather than inherit its BLOCK verdict, state
        the revision assumption, and report the current no-jitter finding.
        Expect CONCERNS. Accept BLOCK only for a complete independent current
        HIGH or CRITICAL finding, not because the prior pass was BLOCK.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response applies precedence, avoids inherited BLOCK, and reports the current finding.
        0.5 = response reviews current context but leaves precedence unclear.
        0.0 = response lets the matching identifier retain the prior BLOCK verdict.
      mode: independent
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/_helpers/check-adversarial-review-report.py
      timeout: 30