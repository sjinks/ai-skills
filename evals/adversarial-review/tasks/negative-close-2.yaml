# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: negative-close-002
name: Best-practices style review request
description: |
  Asks for general "is this idiomatic?" style review on a small helper — not a red-team / failure-mode framing. Adversarial-review should not activate.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Take a quick look at this helper and tell me whether it follows reasonable best practices for a small Node script.

    ```js
    function formatUser(u) {
      return `${u.firstName} ${u.lastName}`.trim();
    }
    module.exports = { formatUser };
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: negative
      threshold: 0.3
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
        - "Adversarial tests:"
        - "Mitigations / acceptance criteria:"
