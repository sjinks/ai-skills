# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-003
name: Second pass applies severity rules and dedups
description: |
  A second adversarial-review pass on the same target revision must apply current
  severity rules to unresolved prior findings, treat the strongest still-supported
  prior verdict as a lower bound, and avoid re-reporting an equivalent prior
  finding. This case upgrades prior CONCERNS to BLOCK because an unresolved HIGH
  finding has no documented control or accepted tradeoff.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Do a second adversarial-review pass on the same spec below. A prior
    adversarial-review pass already produced this output:

      Verdict: CONCERNS
      Target: notification-retry spec
      Findings:
      1. Retry has no idempotency key
        Artifact: spec section "Retry"
        Category: error-rollback
        Trigger: a retried POST after a timeout re-sends the same notification
        Severity: HIGH

    Spec: A worker POSTs notifications to a downstream webhook. On a 5xx or
    timeout it retries up to 3 times with fixed 1s backoff. There is no
    idempotency key on the request. The retry counter is held in memory only.

    Your new observation: the fixed 1s backoff (no jitter) could cause a mild
    thundering-herd on recovery — a real but bounded concern. You should still
    report the missing idempotency key only if you have something new to add
    about it; otherwise do not re-report it.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:[ \t]*BLOCK[ \t]*\r?$'
        - '(?im)^Target:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Intended behavior:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Evidence basis:[ \t]*[^\r\n]+\r?$'
        - '(?im)^What works:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Assumptions:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Findings:[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*1\.[^\r\n]+\r?\n[ \t]+Artifact:[^\r\n]+\r?\n[ \t]+Category:[ \t]*(requirements-clarity|contract-logic|input-handling|error-rollback|state-concurrency|auth-tenancy|data-integrity|resource-lifecycle|user-workflow|verification-gap)[ \t]*\r?\n[ \t]+Severity:[ \t]*(CRITICAL|HIGH|MEDIUM|LOW)[ \t]*\r?\n[ \t]+Confidence:[ \t]*(high|medium|low)[ \t]*\r?\n[ \t]+Classification:[ \t]*(Confirmed issue|Likely risk|Open question|Accepted tradeoff|Test gap)[ \t]*\r?\n[ \t]+Trigger:[^\r\n]+\r?\n[ \t]+Risk:[^\r\n]+\r?\n[ \t]+Evidence:[^\r\n]+\r?\n[ \t]+Suggested fix:[^\r\n]+'
        - '(?im)^Adversarial tests:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Mitigations / acceptance criteria:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Residual risk:[ \t]*[^\r\n]+\r?$'
        - '(?i)(jitter|backoff|thundering)'
      not_contains:
        - "Gate decision:"
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        The response is a second adversarial-review pass on a target whose prior
        pass emitted Verdict: CONCERNS over a missing idempotency key. Grade
        whether the response:
        - Emits BLOCK because the unresolved prior HIGH finding has no documented
          compensating control or owner-accepted tradeoff. The bounded MEDIUM/LOW
          no-jitter finding does not weaken that required verdict.
        - Does NOT re-report the missing idempotency key as a fresh finding with
          the same trigger (a retried POST re-sending the notification); it may
          reference the prior finding in Evidence basis but must not duplicate it.
        - Surfaces the no-jitter backoff observation as its net-new finding.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response emits BLOCK and correctly performs both paired-review behaviors.
        0.5 = response is partially correct or violates one paired-review rule.
        0.0 = response misses the required verdict, deduplication, or net-new finding.
      mode: independent
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/_helpers/check-adversarial-review-report.py
      timeout: 30
