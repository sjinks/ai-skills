# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Failure-mode analysis of a migration runbook
description: Failure-mode / red-team framing on an ops artifact should trigger the skill.
tags:
  - positive-trigger
inputs:
  prompt: |
    Red-team this database migration runbook for failure modes, rollback gaps,
    and verification holes.

    Runbook:
    1. Put the app in read-only mode.
    2. Run `ALTER TABLE orders ADD COLUMN region TEXT NOT NULL DEFAULT 'us';`
       in production.
    3. Deploy the new app version that writes `region` on every insert.
    4. Re-enable writes.
    5. Backfill historical rows with a script that loops over orders and sets
       `region` from the related `customer.country` column.

    The runbook has no rollback step, no estimate of how long the ALTER will
    hold a lock, and no verification that the backfill completed before the
    next release.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*(BLOCK|CONCERNS)'
        - '(?i)Target:'
        - '(?i)Intended behavior:'
        - '(?i)Evidence basis:'
        - '(?i)What works:'
        - '(?i)Assumptions:'
        - '(?i)Findings:'
        - '(?im)^[ \t]*Artifact:[^\n]+\n[ \t]*Category:[^\n]+\n[ \t]*Severity:[ \t]*(CRITICAL|HIGH|MEDIUM|LOW)[ \t]*\n[ \t]*Confidence:[ \t]*(high|medium|low)[ \t]*\n[ \t]*Classification:[ \t]*(Confirmed issue|Likely risk|Open question|Accepted tradeoff|Test gap)[ \t]*\n[ \t]*Trigger:[^\n]+\n[ \t]*Risk:[^\n]+\n[ \t]*Evidence:[^\n]+\n[ \t]*Suggested fix:[^\n]+'
        - '(?i)Adversarial tests:'
        - '(?i)Mitigations / acceptance criteria:'
        - '(?i)Residual risk:'
        - '(?i)(no\s+rollback|missing\s+rollback|rollback\s+(plan|step)\s+(missing|absent)|long[-\s]running|lock\s+(duration|contention|wait)|ACCESS\s+EXCLUSIVE|order\s+of\s+operations)'
      not_contains:
        - "Gate decision:"
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
