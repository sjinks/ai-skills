# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Failure-mode analysis of a migration runbook
description: Failure-mode / red-team framing on an ops artifact should trigger the skill.
tags:
  - positive-trigger
inputs:
  prompt: |
    Red-team this database migration runbook for failure modes, rollback gaps,
    and verification holes.

    Runbook:
    1. Put the app in read-only mode.
    2. Run `ALTER TABLE orders ADD COLUMN region TEXT NOT NULL DEFAULT 'us';`
       in production.
    3. Deploy the new app version that writes `region` on every insert.
    4. Re-enable writes.
    5. Backfill historical rows with a script that loops over orders and sets
       `region` from the related `customer.country` column.

    The runbook has no rollback step, no estimate of how long the ALTER will
    hold a lock, and no verification that the backfill completed before the
    next release.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:[ \t]*(BLOCK|CONCERNS)[ \t]*\r?$'
        - '(?im)^Target:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Intended behavior:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Evidence basis:[ \t]*[^\r\n]+\r?$'
        - '(?im)^What works:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Assumptions:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Findings:[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*1\.[^\r\n]+\r?\n[ \t]+Artifact:[^\r\n]+\r?\n[ \t]+Category:[ \t]*(requirements-clarity|contract-logic|input-handling|error-rollback|state-concurrency|auth-tenancy|data-integrity|resource-lifecycle|user-workflow|verification-gap)[ \t]*\r?\n[ \t]+Severity:[ \t]*(CRITICAL|HIGH|MEDIUM|LOW)[ \t]*\r?\n[ \t]+Confidence:[ \t]*(high|medium|low)[ \t]*\r?\n[ \t]+Classification:[ \t]*(Confirmed issue|Likely risk|Open question|Accepted tradeoff|Test gap)[ \t]*\r?\n[ \t]+Trigger:[^\r\n]+\r?\n[ \t]+Risk:[^\r\n]+\r?\n[ \t]+Evidence:[^\r\n]+\r?\n[ \t]+Suggested fix:[^\r\n]+'
        - '(?im)^Adversarial tests:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Mitigations / acceptance criteria:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Residual risk:[ \t]*[^\r\n]+\r?$'
        - '(?i)(no\s+rollback|missing\s+rollback|rollback\s+(plan|step)\s+(missing|absent)|long[-\s]running|lock\s+(duration|contention|wait)|ACCESS\s+EXCLUSIVE|order\s+of\s+operations)'
      not_contains:
        - "Gate decision:"
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/_helpers/check-adversarial-review-report.py
      timeout: 30
