# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Tightly-reviewed artifact reaches CLEAN
description: |
  When the target already has explicit guards, tests, and rollback, a CLEAN verdict with residual caveats is a valid outcome.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Adversarial-review this small, bounded change before merge. Review only
    whether introducing this flag can alter default behavior, prevent immediate
    rollback, or leave the changed configuration and request-boundary behavior
    unverified. The ranking algorithm itself is unchanged and out of scope.

    Change: add a feature flag `enable_new_ranking` defaulting to `false`. The flag is read once at request boundary via `ConfigService`. A regression test confirms default-off behaviour matches the previous output for 500 fixture inputs. Toggle is reversible without a deploy. Telemetry counts toggled requests.

    Absence of configuration selects the `false` default, and startup validation
    rejects non-boolean configured values. Tests cover default-off, explicit-off, explicit-on, and runtime
    rollback from on to off. The request-boundary test verifies one stable flag
    value is used for the whole request. No actionable issue is known in this
    bounded scope; do not invent a finding merely to avoid CLEAN.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/adversarial-review/SKILL.md
      mode: positive
      threshold: 0.3
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - adversarial-review
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:[ \t]*CLEAN[ \t]*\r?$'
        - '(?im)^Target:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Intended behavior:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Evidence basis:[ \t]*[^\r\n]+\r?$'
        - '(?im)^What works:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Assumptions:[ \t]*[^\r\n]+\r?$'
        - '(?im)^Findings:[ \t]*(?:None[ \t]*\r?\n|\r?\n[ \t]*None[ \t]*\r?\n)(?:[ \t]*\r?\n)*[ \t]*Adversarial tests:'
        - '(?im)^Adversarial tests:[ \t]*None[ \t]*\r?$'
        - '(?im)^Mitigations / acceptance criteria:[ \t]*None[ \t]*\r?$'
        - '(?im)^Residual risk:[ \t]*[^\r\n]+\r?$'
        - '(?i)(rollback|reversible|feature flag|default)'
      not_contains:
        - "Gate decision:"
        - "Lenses applied:"
        - "Egress policy:"
        - "Verdict: PLAN-READY"
        - "Verdict: PLAN-PARTIAL"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response correctly exercises the clean path for this
        deliberately bounded target. It must emit CLEAN, put None in the Findings
        section (inline or on the next line), identify the strongest supplied
        evidence under What works, and avoid inventing an actionable defect,
        mitigation, or adversarial test after the prompt supplies coverage for
        default behavior, configuration validation, request consistency, and
        immediate rollback.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.

        Full success: CLEAN is emitted with the canonical no-finding representation and grounded What works evidence.
        Partial completion (fail): CLEAN is emitted but the no-finding shape or evidence summary is incomplete.
        Failure: CONCERNS or BLOCK is emitted, or the response invents an actionable finding.
      mode: independent
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/_helpers/check-adversarial-review-report.py
      timeout: 30
