# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: adversarial-review-eval
description: |
  Evaluates the adversarial-review skill: it activates on red-team /
  failure-mode prompts, stays silent on unrelated, explanatory, or style-review questions,
  is actually invoked when expected (and not when not), and produces the
  skill's required output contract (verdict, target, findings, residual
  risk).
skill: adversarial-review
version: "1.1"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.30
    threshold: 0.8
    description: Output carries the skill's required contract and substantive findings the prompt asks for.
  - name: task_completion_substance
    weight: 0.10
    threshold: 0.7
    description: LLM judge verifies verdict logic, finding cardinality, and paired-review behavior on targeted edge cases.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      # max_tokens counts TOTAL tokens (input + output) per task, and input is
      # dominated by fixed harness scaffolding (system prompt, tool definitions,
      # the injected SKILL.md body, and cached multi-turn re-sends) that the
      # skill cannot reduce. Measured on claude-sonnet-4.6, a no-op negative
      # task already floors at ~17k total and a full paired-review pass reaches
      # ~68k, so an 8000 budget was unreachable for every task. max_tool_calls
      # is the real runaway guard; max_tokens is set to the measured worst-case
      # plus headroom so genuine blow-ups still fail.
      max_tool_calls: 8
      max_tokens: 90000
tasks:
  - "tasks/*.yaml"
