# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Implement and verify test-file changes
description: The agent must edit a supplied test file and report its execution result.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Extend the supplied `test/clamp.test.js` in the workspace. The contract for
    `clamp(value, min, max)` returns min below range, max above range, and the
    value within the inclusive range. Keep its existing interior case. Add
    `node:test` cases using `assert.equal` to check that `clamp(-1, 0, 10)` is
    `0` and `clamp(11, 0, 10)` is `10`. Edit the test file; do not merely show
    code in your reply or change `clamp.js`. Run `node --test test/clamp.test.js`,
    then report the cases, contract evidence, and actual
    verification result and the defect each case catches. No dedicated testing
    workflow is available for this framework. Node is available; execute the final
    tests with the supplied command and report the successful result.
    Keep package.json unchanged; do not install dependencies or create package/install artifacts.
    Execute the final edited tests. If diagnosis changes tests, rerun them and
    report the latest outcome; a run before those changes is not final evidence.
    Preserve the supplied file verbatim and append one blank line followed by
    exactly these declarations (this fixture checks exact file contents):

    test('clamps below range', () => {
      assert.equal(clamp(-1, 0, 10), 0);
    });

    test('clamps above range', () => {
      assert.equal(clamp(11, 0, 10), 10);
    });

    Under Designed cases:, use a raw JSON array containing exactly 3 objects,
    with exactly these keys: "behavior", "expected", "defect".
    Each value must be a nonempty string.
    Each object must map its own behavior to its observation and concrete defect;
    do not use a generic defect word, a code fence, or extra case prose.
    Include the retained interior case and both boundary cases separately.
  files:
    - path: package.json
      content: '{"type":"module"}'
    - path: clamp.js
      content: |
        export function clamp(value, min, max) {
          return Math.max(min, Math.min(value, max));
        }
    - path: test/clamp.test.js
      content: |
        import test from 'node:test';
        import assert from 'node:assert/strict';
        import { clamp } from '../clamp.js';

        test('keeps an in-range value', () => {
          assert.equal(clamp(5, 0, 10), 5);
        });
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-design/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - test-design
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Designed cases:'
        - '(?m)^Design evidence:'
        - '(?m)^Test execution: Ran: node --test test/clamp\.test\.js => passed$'
        - '(?ims)^Designed cases:.*(?:(below|min|lower).{0,120}(above|max|upper)|(above|max|upper).{0,120}(below|min|lower)).*\nDesign evidence:'
        - '(?ims)^Designed cases:.*(?:(defect|bug|regress|incorrect|wrong|mistake)).*\nDesign evidence:'
      not_contains:
        - 'Test execution: Not run; no tests changed.'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/test-design/check-report.py
        - implement
        - --case-count
        - "3"
      timeout: 30
  - type: diff
    name: changed_test_file
    config:
      context_dir: evals/test-design
      update_snapshots: false
      expected_files:
        - path: test/clamp.test.js
          snapshot: snapshots/clamp.test.js
  - type: diff
    name: production_unchanged
    config:
      context_dir: evals/test-design
      update_snapshots: false
      expected_files:
        - path: clamp.js
          snapshot: snapshots/clamp.js
        - path: package.json
          snapshot: snapshots/package.json
  - type: prompt
    name: case_substance
    config:
      mode: independent
      prompt: |
        Judge the selected-case JSON records against this task's contract. Examine
        EVERY record separately, not the aggregate keyword coverage. Each must
        identify a concrete behavior/input, the correct expected observation, and
        a plausible implementation defect that THAT test would catch. Reject
        generic defect words, assertions of correctness without a failure mechanism,
        swapped defect mappings, tautologies, expectations copied from buggy code,
        and missing normal/boundary/error observations required by the task.
        A standalone or unrelated defect statement cannot repair incomplete records.
        Also reject omitted required cases or an invented hardware verification claim.
        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.
  - type: program
    name: workspace_integrity
    config:
      command: python3
      args:
        - evals/test-design/check-workspace.py
      timeout: 30
