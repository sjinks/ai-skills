# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-005
name: One preselected test authoring
description: Writing one already-selected test belongs to isolated test authoring.
tags:
  - negative-close
inputs:
  prompt: |
    Write one preselected, framework-neutral test for assertion quality.
    The selected behavior is double(4), and the selected expected result is 8.
    Return only the test code and its quality judgement; do not select other
    cases or assess feature coverage. No dedicated framework testing workflow
    is available. Use an assertion that fails if double(4) returns 7.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-design/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Designed cases:"
        - "Design evidence:"
        - "Test execution:"
        - "Case set:"
        - "Design basis:"
        - "Run record:"
        - "test-design"
