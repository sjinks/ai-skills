# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Rename a CSS class
description: Off-topic source edit.
tags:
  - negative-trigger
inputs:
  prompt: |
    Rename the CSS class .sidebar-link to .nav-link in this stylesheet and
    update its two HTML references. Keep the colors and layout the same.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-design/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Test cases:"
        - "Evidence:"
        - "Verification:"
        - "test-design"
