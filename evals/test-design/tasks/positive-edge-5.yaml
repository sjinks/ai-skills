# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Unavailable hardware has no faithful substitute
description: Implement a hardware measurement case without executing it or claiming a fake verifies
  calibration.
tags:
- positive-trigger
- positive-edge
inputs:
  prompt: |
    Design the smallest meaningful feature case for physical calibration and implement it in test/sensor.test.js. Contract: the physical sensor in a calibrated 20 Celsius chamber reports 20 through readCelsius(). The observation tests actual sensor calibration, not a software wrapper. The SDK, physical sensor and chamber are unavailable, and no emulator or faithful local substitute exists. No dedicated framework testing workflow is available. Do not execute hardware tests, install the SDK, alter package.json, or create dependency/install artifacts. Do not substitute a fake temperature value or change sensor.js. Use the calibrated-chamber case and write exactly the following test file, then report the case, expected observation, defect caught and environment limitation:

    import test from 'node:test';
    import assert from 'node:assert/strict';
    import { readCelsius } from '../sensor.js';

    test('reads the calibrated chamber', async () => {
      assert.equal(await readCelsius(), 20);
    });
    Under Designed cases:, use a raw JSON array containing exactly 1 object,
    with exactly these keys: "behavior", "expected", "defect".
    Each value must be a nonempty string.
    Each object must map its own behavior to its observation and concrete defect;
    do not use a generic defect word, a code fence, or extra case prose.
  files:
  - path: package.json
    content: '{"type":"module"}'
  - path: sensor.js
    content: |
      import { readCelsius } from '@lab/calibrated-sensor';
      export { readCelsius };
  - path: test/sensor.test.js
    content: ''
expected:
  should_trigger: true
graders:
- type: trigger
  name: trigger_accuracy
  config:
    skill_path: skills/test-design/SKILL.md
    mode: positive
    threshold: 0.45
- type: skill_invocation
  name: skill_invocation
  config:
    required_skills:
    - test-design
    mode: any_order
- type: program
  name: report_contract
  config:
    command: python3
    args:
    - evals/test-design/check-report.py
    - implement
    - --case-count
    - "1"
    timeout: 30
- type: text
  name: task_completion
  config:
    regex_match:
    - '(?m)^Designed cases:'
    - '(?m)^Design evidence:'
    - '(?m)^Test execution: Unverified: \S[^\n]*$'
    - '(?ims)^Design evidence:.*(?:(sensor|hardware|chamber).{0,150}(unavailable|missing|absent)|(unavailable|missing|absent).{0,150}(sensor|hardware|chamber)).*\nTest execution:'
    - '(?ims)^Designed cases:.*(?:(calibrat|wrong|incorrect|defect)).*\nDesign evidence:'
    not_contains:
    - 'Test execution: Ran:'
    - 'Designed cases: Blocked.'
- type: diff
  name: changed_test_file
  config:
    context_dir: evals/test-design
    update_snapshots: false
    expected_files:
    - path: test/sensor.test.js
      snapshot: snapshots/sensor.test.js
- type: diff
  name: production_unchanged
  config:
    context_dir: evals/test-design
    update_snapshots: false
    expected_files:
    - path: sensor.js
      snapshot: snapshots/sensor.js
    - path: package.json
      snapshot: snapshots/package.json
- type: prompt
  name: case_substance
  config:
    mode: independent
    prompt: |
      Judge the selected-case JSON records against this task's contract. Examine
      EVERY record separately, not the aggregate keyword coverage. Each must
      identify a concrete behavior/input, the correct expected observation, and
      a plausible implementation defect that THAT test would catch. Reject
      generic defect words, assertions of correctness without a failure mechanism,
      swapped defect mappings, tautologies, expectations copied from buggy code,
      and missing normal/boundary/error observations required by the task.
      A standalone or unrelated defect statement cannot repair incomplete records.
      Also reject omitted required cases or an invented hardware verification claim.
      Return one reasoning sentence, then only 1.0 (all records complete and correct),
      0.5 (partially correct), or 0.0 (incorrect or mappings absent) on the last line.
- type: program
  name: workspace_integrity
  config:
    command: python3
    args:
    - evals/test-design/check-workspace.py
    timeout: 30
