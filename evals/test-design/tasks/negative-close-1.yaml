# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Isolated NestJS test audit and fix
description: Review and rewrite one NestJS test without selecting a feature-level case set.
tags:
  - negative-close
inputs:
  prompt: |
    In a NestJS app, review and rewrite only this existing Jest test for
    `UsersService.create`. The contract requires `ConflictException` when
    `findByEmail` finds a user. Does this test detect the wrong behavior?
    Give one corrected test, not a feature-level case plan.

    ```ts
    it('rejects a duplicate email', async () => {
      users.findByEmail.mockResolvedValue({ id: '1' });
      await service.create({ email: 'a@b.c' });
      expect(users.findByEmail).toHaveBeenCalled();
    });
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-design/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Test cases:"
        - "Evidence:"
        - "Verification:"
        - "Case set:"
        - "Design basis:"
        - "Run record:"
        - "test-design"
