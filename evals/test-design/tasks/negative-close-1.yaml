# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Isolated test quality audit
description: Audit one existing test without a framework-precedence cue.
tags:
  - negative-close
inputs:
  prompt: |
    Review only this existing test for assertion quality. The contract says
    `double(4)` returns `8`. Does the test detect a wrong implementation?
    No dedicated framework testing workflow is available. Do not select a
    feature-level case set; explain the quality defect in this test.

    ```js
    test('doubles', () => {
      const result = double(4);
      expect(result).toBe(result);
    });
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-design/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Designed cases:"
        - "Design evidence:"
        - "Test execution:"
        - "Case set:"
        - "Design basis:"
        - "Run record:"
        - "test-design"
