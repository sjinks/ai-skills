# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: Missing contract blocks case selection
description: No target behavior can be inferred from the supplied request.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Design tests for my new feature. I cannot provide the feature's behavior,
    code, interface, or repository yet. Do not assume what it does. Tell me the
    minimum information you need before selecting test cases. Use exactly these
    report labels in order: `Case set:`, `Design basis:`, `Run record:`.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-design/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - test-design
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Case set: Blocked\.$'
        - '(?m)^Design basis:'
        - '(?m)^Run record: Not run; no tests changed\.$'
        - '(?i)(behavior|contract|interface|specification)'
      not_contains:
        - 'Designed cases:'
        - 'Design evidence:'
        - 'Test execution:'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/test-design/check-report.py
        - blocked
        - 'Case set:'
        - 'Design basis:'
        - 'Run record:'
      timeout: 30
  - type: program
    name: workspace_unchanged
    config:
      command: python3
      args:
        - evals/_helpers/check-empty-workspace.py
      timeout: 30
