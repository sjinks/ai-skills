# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-003
name: Assess suite-level missing behavior
description: Identify a distinct high-risk gap in an existing feature suite.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Assess the suite-level gaps for a batch importer. Contract: valid rows
    are persisted atomically; if any row is invalid, the import reports the
    offending row and persists none. The current suite tests a fully valid
    batch and an empty batch only. Propose the smallest material missing case.
    Give the expected observation and defect caught. This is a
    read-only assessment; do not inspect files or run tests. Select exactly one
    missing case. The repository requires 90% coverage; retain that gate as an
    explicit requirement, without inventing a measured coverage result.
    Retry behavior is undecided. Assess the supported invalid-row behavior and
    identify the missing retry decision; do not block all selection or invent
    retry expectations. Under Designed cases:, use a JSON array containing
    exactly one object with exactly these keys: "behavior", "expected", "defect".
    Each value must be a nonempty string. Do not use a code fence or additional
    case prose. Put coverage constraints and the missing retry decision under
    Design evidence:.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/test-design/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - test-design
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?m)^Designed cases:'
        - '(?m)^Design evidence:'
        - '(?m)^Test execution: Not run; no tests changed\.'
        - '(?ims)^Designed cases:.*(?:(invalid|malformed).{0,180}(row|batch)).*\nDesign evidence:'
        - '(?ims)^Designed cases:.*(?:(none|nothing|zero).{0,90}(persist|saved|written)|(persist|saved|written).{0,90}(none|nothing|zero)).*\nDesign evidence:'
        - '(?ims)^Designed cases:.*(?:(partial|atomic|rollback|all-or-nothing)).*\nDesign evidence:'
        - '(?ims)^Designed cases:.*(?:(report|identify|return|error|offending).{0,100}(invalid|offending|malformed|index|row)|(invalid|offending|malformed).{0,100}(row|index).{0,100}(report|identify|return|error)).*\nDesign evidence:'
        - '(?ims)^Design evidence:.*(?:90%.{0,100}(requir|gate|retain|honor)|(requir|gate|retain|honor).{0,100}90%).*\nTest execution: [^\n]*$'
        - '(?ims)^Design evidence:.*(?:retry.{0,100}(undecided|unspecified|unknown|missing|decision)|(undecided|unspecified|unknown|missing|decision).{0,100}retry).*\nTest execution: [^\n]*$'
      not_contains:
        - 'Designed cases: Blocked.'
  - type: program
    name: report_contract
    config:
      command: python3
      args:
        - evals/test-design/check-report.py
        - assessment
        - --case-count
        - "1"
      timeout: 30
  - type: prompt
    name: case_substance
    config:
      mode: independent
      prompt: |
        Judge the selected-case JSON records against this task's contract. Examine
        EVERY record separately, not the aggregate keyword coverage. Each must
        identify a concrete behavior/input, the correct expected observation, and
        a plausible implementation defect that THAT test would catch. Reject
        generic defect words, assertions of correctness without a failure mechanism,
        swapped defect mappings, tautologies, expectations copied from buggy code,
        and missing normal/boundary/error observations required by the task.
        A standalone or unrelated defect statement cannot repair incomplete records.
        Also reject omitted required cases or an invented hardware verification claim.
        Return one reasoning sentence, then only 1.0 (all records complete and correct),
        0.5 (partially correct), or 0.0 (incorrect or mappings absent) on the last line.
  - type: program
    name: workspace_unchanged
    config:
      command: python3
      args:
        - evals/_helpers/check-empty-workspace.py
      timeout: 30
