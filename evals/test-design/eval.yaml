# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: test-design-eval
description: Checks feature-level test selection, implementation or gap assessment, blocked input, and boundaries with neighboring test tasks.
skill: test-design
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.35
    threshold: 0.8
    description: Prompt and skill trigger alignment.
  - name: skill_invocation
    weight: 0.20
    threshold: 0.9
    description: Positive tasks invoke the skill.
  - name: task_completion
    weight: 0.20
    threshold: 0.8
    description: Cases identify behavior, expected observation, defect, evidence, and verification status.
  - name: report_contract
    weight: 0.10
    threshold: 0.9
    description: Program validator enforces label order, cardinality, blocked branch, and final verification status.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool and token budget.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 7000
tasks:
  - "tasks/*.yaml"
