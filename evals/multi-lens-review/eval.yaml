# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: multi-lens-review-eval
description: |
  Evaluates the multi-lens-review skill: it activates on multi-concern
  reviews, stays silent on single-lens questions a focused skill would own,
  is actually invoked when expected (and not when not), and produces the
  skill's required contract (verdict, lenses applied, lens findings,
  required actions, residual risk).
skill: multi-lens-review
version: "1.1"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positives and not invoked on negatives.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the skill's required contract and the substantive lens reasoning the prompt asks for.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 12000
tasks:
  - "tasks/*.yaml"
