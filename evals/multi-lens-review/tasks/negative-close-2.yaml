# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: negative-close-002
name: Single-lens security question
description: |
  A single-lens security question; multi-lens-review should defer to a focused security review skill and not activate.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Is `password.match(/^.{8,}$/)` a sufficient strength check for a login form?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/multi-lens-review/SKILL.md
      mode: negative
      threshold: 0.4
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Lenses applied:"
        - "Lens findings:"
        - "Required actions:"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
