# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic hike recommendation
description: Unrelated everyday question must not activate multi-lens-review.
tags:
  - negative-trigger
inputs:
  prompt: "Give me three ideas for a weekend hike near a coastal city."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/multi-lens-review/SKILL.md
      mode: negative
      threshold: 0.4
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Findings:"
        - "Lenses applied:"
        - "Lens findings:"
        - "Verdict: BLOCK"
        - "Verdict: CONCERNS"
        - "Verdict: CLEAN"
