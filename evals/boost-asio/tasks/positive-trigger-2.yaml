# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: Design Asio shutdown for background tasks
description: |
  Design task requiring explicit Asio ownership, tracked tasks, cancellation,
  work guard, and deterministic shutdown policy.
tags:
  - positive-trigger
inputs:
  prompt: |
    Design the shutdown model for a Boost.Asio service with one accept loop,
    many socket sessions, a certificate reload timer, and a small pool of
    `co_spawn` background maintenance coroutines. The `io_context` runs on four
    threads. Answer concisely from the scenario only; do not inspect files.
    Use these section labels exactly: Executor model, Ownership and lifetime,
    Cancellation, Backpressure, Verification. Include concrete decisions under
    each.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/boost-asio/SKILL.md
      mode: positive
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)Executor model"
        - "(?i)(strand|serialization|multi-threaded)"
        - "(?i)(Ownership and lifetime|session registry|tracked tasks)"
        - "(?i)(cancellation|shutdown|operation_aborted)"
        - "(?i)(backpressure|bounded|write queue)"
        - "(?i)(Verification|tests|sanitizer)"
