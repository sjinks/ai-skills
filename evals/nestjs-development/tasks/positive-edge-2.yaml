# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Validate env with schema before bootstrap
description: |
  Adding env validation via the skill's Config-validation pattern (Zod/Joi) so the app fails fast on misconfiguration.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Add Joi-based env validation to a NestJS 10 app via `ConfigModule.forRoot`. Required env: `DATABASE_URL` (URI), `JWT_SECRET` (string, min 32 chars), `PORT` (number, default 3000), `NODE_ENV` (enum: development, test, production). Show `app.module.ts` ConfigModule wiring and the Joi schema.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/nestjs-development/SKILL.md
      mode: positive
      threshold: 0.5
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - nestjs-development
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - "(?i)ConfigModule\\.forRoot"
        - "(?i)(validationSchema|Joi\\.object|validate:)"
        - "(?i)JWT_SECRET"
        - "(?i)(isGlobal:\\s*true|@nestjs/config)"
