# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: vip-dev-env-eval
description: |
  Evaluates the vip-dev-env skill: it activates on WordPress VIP Local
  Development Environment (LDE) tasks using `vip dev-env` (create, update,
  load app code, inspect services/logs, troubleshoot startup or 500
  errors), stays silent on generic Docker Compose questions, remote VIP
  production deploys, and off-topic prompts, and produces slug-first,
  message-driven, safety-aware guidance grounded in VIP-CLI commands.
skill: vip-dev-env
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output gives slug-first, message-driven, command-grounded VIP dev-env guidance.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
