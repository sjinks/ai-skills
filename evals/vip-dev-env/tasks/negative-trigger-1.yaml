# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic sourdough question
description: Unrelated everyday question must not activate vip-dev-env.
tags:
  - negative-trigger
inputs:
  prompt: "What is a simple schedule for feeding a sourdough starter kept at room temperature?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/vip-dev-env/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - 'vip dev-env'
        - '--slug'
        - 'COMMAND LOG FILE'
