# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the review-finding-quality skill.
tags:
  - negative-trigger
inputs:
  prompt: "Suggest a simple weekly meal-prep plan for someone who dislikes reheated pasta."
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/review-finding-quality/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Finding Quality Report"
        - "Resolved when"
        - "needs-author-input"
        - "Dropped (non-findings)"
        - "Scope Slice Plan"
