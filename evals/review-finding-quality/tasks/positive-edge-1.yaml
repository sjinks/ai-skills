# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-001
name: needs-author-input instead of invented anchors
description: |
  A finding without any locatable anchor must be marked needs-author-input
  with the missing information named, never given an invented anchor.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Apply review-finding-quality to this single draft comment:

    "Somewhere in this PR the cache invalidation is wrong — I saw stale data
    once while testing but I don't remember which screen or which call."

    No diff or code context is available. Format it properly or tell me what
    is missing; do not make up a file or line.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/review-finding-quality/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - review-finding-quality
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Finding Quality Report'
        - '(?i)needs-author-input'
        - '(?i)Needs author input'
        - '(?i)(anchor|file|line|location|screen|call)'
      not_contains:
        - "Gate decision:"
        - "Scope Slice Plan"
