# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Rewrite vague draft review comments
description: |
  Canonical case: vague draft findings are rewritten into the five-field
  contract with severities, anchors, and Resolved when lines.
tags:
  - positive-trigger
inputs:
  prompt: |
    Apply review-finding-quality to my draft review comments before I post
    them.

    Draft comments:
    1. "This error handling looks sketchy." (about src/upload/handler.ts
       lines 40-55, where a failed S3 put is caught and logged but the
       endpoint still returns 200)
    2. "Naming could be better, and also you should add a timeout here."
       (about the `doStuff` function and the fetch call inside it, in
       src/upload/client.ts)
    3. "Why did you pick a linked list for this?"

    Code context: the diff adds an upload endpoint; the S3 failure path is
    observable by the caller only through the misleading 200.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/review-finding-quality/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - review-finding-quality
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Finding Quality Report'
        - '(?i)\|\s*#\s*\|\s*Status\s*\|\s*Severity\s*\|\s*Anchor\s*\|'
        - '(?i)rewritten'
        - '(?is)(blocker|should-fix).{0,400}(200|error|S3)'
        - '(?i)Resolved when'
        - '(?i)Questions \(not findings\)'
        - '(?i)(linked list)'
        - '(?i)Verdict:\s*CONCERNS'
      not_contains:
        - "Gate decision:"
        - "Pre-Review Self-Audit Report"
        - "Scope Slice Plan"
        - "Thread disposition:"
