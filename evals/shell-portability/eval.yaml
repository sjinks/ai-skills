# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: shell-portability-eval
description: |
  Evaluates the shell-portability skill: it activates for cross-shell and
  cross-OS shell script review (POSIX sh vs bash, dash/busybox, GNU vs
  BSD/macOS utilities), bashism detection, non-portable utility flags, and
  shebang targeting; stays silent on shell command safety and non-shell
  languages; and emits the skill's `Portability verdict`, `Portability target`,
  `Portability interpreter`, `Portability findings`, `Portability checklist status`,
  and `Portability residual risk` fields when a normal candidate is available;
  reduced `BLOCK` output retains `Portability verdict`, `Portability target`, and
  `Portability findings`, while
  omitting the normal-only `Portability interpreter`, `Portability checklist status`,
  and `Portability residual risk` fields.
skill: shell-portability
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output applies bashism/utility/shebang portability analysis with severity/verdict mapping and a verification path.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required portability judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: code
    name: output_contract
    config:
      language: python
      assertions:
        # Once a portability report activates, legacy generic report labels must
        # not be mixed with the distinctive cross-skill handoff contract.
          - '(not re.search(r"(?im)^Portability verdict:", output) or re.search(r"(?im)^(?:Verdict|Target|Interpreter|Findings|Checklist status|Residual risk):", output) is None)'
        # The normal template ends at residual risk; later prose would make the
        # report ambiguous to the handoff consumer. Reduced BLOCK output omits
        # that normal-only field and is governed by its task-specific envelope.
          - '(not re.search(r"(?im)^Portability verdict:", output) or re.search(r"(?im)^Portability residual risk:[^\r\n]*(?:\r?\n[ \t]*)*\r?\n[ \t]*\S", output) is None)'
        # Regression self-tests for the two distinctive-label envelope rules.
          - '(re.search(r"(?im)^(?:Verdict|Target|Interpreter|Findings|Checklist status|Residual risk):", "Verdict: CLEAN") is not None and re.search(r"(?im)^(?:Verdict|Target|Interpreter|Findings|Checklist status|Residual risk):", "Portability findings: None") is None)'
          - '(re.search(r"(?im)^Portability residual risk:[^\r\n]*(?:\r?\n[ \t]*)*\r?\n[ \t]*\S", "Portability residual risk: None" + chr(10) + chr(10) + "  Extra prose") is not None and re.search(r"(?im)^Portability residual risk:[^\r\n]*(?:\r?\n[ \t]*)*\r?\n[ \t]*\S", "Portability residual risk: None" + chr(10)) is None)'
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
