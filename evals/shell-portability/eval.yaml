# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: shell-portability-eval
description: |
  Evaluates the shell-portability skill: it activates for cross-shell and
  cross-OS shell script review (POSIX sh vs bash, dash/busybox, GNU vs
  BSD/macOS utilities), bashism detection, non-portable utility flags, and
  shebang targeting; stays silent on shell command safety and non-shell
  languages; and emits the skill's verdict, target, interpreter, findings,
  checklist status, and residual risk when a normal candidate is available;
  reduced `BLOCK` output omits those normal-only fields.
skill: shell-portability
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.25
    threshold: 0.8
    description: Output applies bashism/utility/shebang portability analysis with severity/verdict mapping and a verification path.
  - name: task_completion_substance
    weight: 0.15
    threshold: 0.7
    description: LLM judge verifies representative positive tasks make the required portability judgement.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 10
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
