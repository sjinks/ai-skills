# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-005
name: Mixed request without construction result
description: |
  A mixed construction and portability request without a separate construction
  result must defer portability rather than repairing or judging the command.
tags:
  - positive-edge
inputs:
  prompt: |
    In Bash, repair `tool run $label` so label remains one argument, then tell
    me whether it is portable for POSIX sh on Ubuntu and macOS. No separate
    shell-command-construction result has been supplied.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-portability/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-portability
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?is)\AVerdict:\s*BLOCK\s*\r?\nTarget:\s*[^\r\n]+\r?\n\r?\nFindings:\s*\r?\n1\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*LOW\s*\r?\n[ \t]+Classification:\s*Open question\s*\r?\n[ \t]+Evidence:\s*(?=[^\r\n]*(?:exact|constructed|construction))(?=[^\r\n]*(?:candidate|command))(?=[^\r\n]*(?:unavailable|missing|absent|not supplied|not provided))[^\r\n]+\r?\n[ \t]+Rule:\s*(?:interpreter-shebang|bashisms|utilities-flags|output-behavior|verification)\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*(?=[^\r\n]*(?:obtain|request|provide|supply|complete))(?=[^\r\n]*(?:construction review|construction result|exact candidate))(?=[^\r\n]*(?:first|before portability|prior))[^\r\n]+\r?\n[ \t]+Verification:\s*N/A\s*\r?\n?\z'
      regex_not_match:
        - '(?i)Verdict:\s*(?:CLEAN|CONCERNS)'
        - '(?i)tool run "\$label"'
        - '(?im)^(?:Interpreter|Checklist status|Residual risk):'
        - '(?im)^(?:Construction result|Construction assessment|Candidate|Execution authority|Next step):'
      not_contains:
        - 'compatible with POSIX sh'
        - 'works on macOS'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response uses shell-portability's reduced insufficient-context
        BLOCK template, requests a separate construction result first, does not repair
        `tool run $label`, makes no compatibility conclusion, and makes no construction claim.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
      mode: independent