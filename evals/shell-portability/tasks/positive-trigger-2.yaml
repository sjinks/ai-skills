# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-002
name: GNU-only utility flags on a macOS target
description: |
  Review must activate when GNU coreutils flags are used in a script that
  must also run on macOS/BSD.
tags:
  - positive-trigger
inputs:
  prompt: |
    We need this to run on both Ubuntu and macOS. Are these commands
    portable?

    ```bash
    sed -i 's/foo/bar/' config.txt
    grep -P '\d{3}' data.txt
    files=$(find . -printf '%f\n')
    ```

    macOS is an explicitly named required target, and each shown command has
    been demonstrated to fail there because the GNU-only option is unavailable
    or incompatible.

    Give me the verdict, findings, checklist status, and how to verify. List the
    findings in this order: 1. `sed -i`, 2. `grep -P`, 3. `find -printf`.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-portability/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-portability
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:\s*BLOCK\s*$'
        - '(?im)^Target:\s*[^\r\n]*Ubuntu[^\r\n]*macOS[^\r\n]*$'
        - '(?im)^Interpreter:\s*[^\r\n]+$'
        - '(?im)^Findings:\s*$'
        - '(?ims)^1\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*CRITICAL\s*\r?\n[ \t]+Classification:\s*Confirmed issue\s*\r?\n[ \t]+Evidence:\s*[^\r\n]*sed -i[^\r\n]*\r?\n[ \t]+Rule:\s*utilities-flags\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]+\r?\n[ \t]+Verification:\s*[^\r\n]+\r?$'
        - '(?ims)^2\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*CRITICAL\s*\r?\n[ \t]+Classification:\s*Confirmed issue\s*\r?\n[ \t]+Evidence:\s*[^\r\n]*grep -P[^\r\n]*\r?\n[ \t]+Rule:\s*utilities-flags\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?:grep -E|ERE|awk)[^\r\n]*\r?\n[ \t]+Verification:\s*[^\r\n]+\r?$'
        - '(?ims)^3\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*CRITICAL\s*\r?\n[ \t]+Classification:\s*Confirmed issue\s*\r?\n[ \t]+Evidence:\s*[^\r\n]*find[^\r\n]*-printf[^\r\n]*\r?\n[ \t]+Rule:\s*utilities-flags\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?:-exec|-print)[^\r\n]*\r?\n[ \t]+Verification:\s*[^\r\n]+$'
        - '(?ims)^1\.\s+[^\r\n]+(?:\r?\n[ \t]+[^\r\n]+)*?\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?i:(?:temp|mktemp)[^\r\n]*\bmv\b|(?:GNU[^\r\n]*BSD|BSD[^\r\n]*GNU)[^\r\n]*(?:branch|case|condition|detect))[^\r\n]*$'
        - '(?ims)^2\.\s+[^\r\n]+(?:\r?\n[ \t]+[^\r\n]+)*?\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?i:grep -E|ERE|awk)[^\r\n]*(?:\[0-9\]\{3\}|\[\[:digit:\]\]\{3\}|\[0-9\]\[0-9\]\[0-9\])[^\r\n]*$'
        - '(?ims)^3\.\s+[^\r\n]+(?:\r?\n[ \t]+[^\r\n]+)*?\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?i:-exec[^\r\n]*basename|basename[^\r\n]*-exec)[^\r\n]*$'
        - '(?i)sed -i'
        - '(?i)(grep -P|PCRE|grep -E|ERE)'
        - '(?i)(printf|-exec|find -printf|GNU)'
        - '(?i)Checklist status:'
        - '(?im)^- Interpreter and shebang:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Bashisms:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Utilities and flags:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Output and behavior:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Verification:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^Residual risk:\s*[^\r\n]+$'
      not_contains:
        - "Compatibility promise:"
        - "Dependency policy:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response identifies these issues:
        - `sed -i` differs between GNU (no backup arg) and BSD/macOS
          (requires `-i ''`); the portable fix preserves the in-place result
          with a temp file + mv (or an explicit GNU/BSD branch).
        - `grep -P` (PCRE) is GNU-only and must be rewritten with `grep -E`
          (ERE) or awk while replacing `\d{3}` semantics with `[0-9]{3}` or
          equivalent.
        - `find -printf` is GNU-only; preserve basename output with `find ...
          -exec basename ...`, not bare `-print`.
        Because macOS is an explicitly named required target, all three complete
        findings are CRITICAL Confirmed issues. A correct response uses the
        skill's structured sections.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or hedges substantially.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent
