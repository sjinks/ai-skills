# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-004
name: Raw mixed request without construction result
description: |
  A raw mixed construction and portability request belongs to construction review
  first and must not activate portability review.
tags:
  - negative-close
inputs:
  prompt: |
    In Bash, repair `tool run $label` so label remains one argument, then tell
    me whether it is portable for POSIX sh on Ubuntu and macOS. No separate
    construction result has been supplied.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-portability/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      regex_not_match:
        - '(?im)^(?:Verdict|Target|Interpreter|Findings|Checklist status|Residual risk):'