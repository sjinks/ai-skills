# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic developer task
description: An unrelated developer task must not activate the shell-portability skill.
tags:
  - negative-trigger
inputs:
  prompt: |
    Write a SQL query that finds duplicate email addresses in a `users` table.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-portability/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Portability verdict:"
        - "Portability findings:"
        - "Portability checklist status:"
        - "Portability interpreter:"
        - "Portability target:"
        - "Portability residual risk:"
