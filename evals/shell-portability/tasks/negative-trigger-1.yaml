# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Non-shell Python portability question
description: Python portability language without shell code must not activate the shell-portability skill.
tags:
  - negative-trigger
inputs:
  prompt: |
    Will this Python 3.11 script behave the same on Ubuntu and macOS, and what
    portability changes should I make?

    ```python
    from pathlib import Path
    print(Path.cwd())
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-portability/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Checklist status:"
        - "Interpreter:"
        - "Target:"
        - "Residual risk:"
