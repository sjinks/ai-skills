# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: Bashisms in a /bin/sh script
description: |
  Review must activate on bash-only constructs in a POSIX sh script and on a
  GNU-only utility flag.
tags:
  - positive-trigger
inputs:
  prompt: |
    This script has #!/bin/sh but our CI runs it on both Alpine (busybox)
    and macOS. Is it portable?

    ```sh
    #!/bin/sh
    if [[ "$1" == start* ]]; then
      target=$(readlink -f "$2")
      echo -n "resolving: "
      echo "$target"
    fi
    ```

    No divergent `echo -n` output has been demonstrated on the named current
    targets. Exact `readlink -f` canonicalization, including resolving a symlink
    in the final path component, must be preserved. A scoped GNU coreutils
    dependency providing `grealpath` is approved on both targets.

    Return the verdict, target, interpreter, findings, checklist status, and
    residual risk. List the findings in this order: 1. `[[ ... ]]` bashism,
    2. `readlink -f`, 3. `echo -n`.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-portability/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-portability
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:\s*BLOCK\s*$'
        - '(?im)^Target:\s*[^\r\n]+$'
        - '(?im)^Interpreter:\s*#!/bin/sh\s*$'
        - '(?im)^Findings:\s*$'
        - '(?ims)^1\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*CRITICAL\s*\r?\n[ \t]+Classification:\s*Confirmed issue\s*\r?\n[ \t]+Evidence:\s*[^\r\n]*(?:\[\[|bashism)[^\r\n]*\r?\n[ \t]+Rule:\s*bashisms\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]+\r?\n[ \t]+Verification:\s*[^\r\n]+\r?$'
        - '(?ims)^2\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*CRITICAL\s*\r?\n[ \t]+Classification:\s*Confirmed issue\s*\r?\n[ \t]+Evidence:\s*[^\r\n]*readlink -f[^\r\n]*\r?\n[ \t]+Rule:\s*utilities-flags\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]+\r?\n[ \t]+Verification:\s*[^\r\n]+\r?$'
        - '(?ims)^3\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*MEDIUM\s*\r?\n[ \t]+Classification:\s*Likely risk\s*\r?\n[ \t]+Evidence:\s*[^\r\n]*echo -n[^\r\n]*\r?\n[ \t]+Rule:\s*output-behavior\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]*printf[^\r\n]*\r?\n[ \t]+Verification:\s*[^\r\n]+$'
        - '(?ims)^1\.\s+[^\r\n]+(?:\r?\n[ \t]+[^\r\n]+)*?\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?i:case)[ \t]+"\$1"[ \t]+(?i:in)[ \t]+start\*\)[^\r\n]*$'
        - '(?ims)^2\.\s+[^\r\n]+(?:\r?\n[ \t]+[^\r\n]+)*?\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?i:grealpath)[^\r\n]*$'
        - '(?ims)^2\.\s+[^\r\n]+(?:\r?\n[ \t]+[^\r\n]+)*?\r?\n[ \t]+Portable fix:\s*[^\r\n]*\$2[^\r\n]*$'
        - '(?ims)^2\.\s+[^\r\n]+(?:\r?\n[ \t]+[^\r\n]+)*?\r?\n[ \t]+Portable fix:\s*[^\r\n]*(?i:dependency|GNU|coreutils|approved)[^\r\n]*$'
        - '(?i)(\[\[|bashism|not POSIX|case)'
        - '(?i)readlink'
        - '(?i)(printf|echo -n)'
        - '(?i)Checklist status:'
        - '(?im)^- Interpreter and shebang:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Bashisms:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Utilities and flags:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Output and behavior:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^- Verification:\s*(?:covered|missing|n/a)\s*$'
        - '(?im)^Residual risk:\s*[^\r\n]+$'
      not_contains:
        - "Compatibility promise:"
        - "Dependency policy:"
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response identifies these issues:
        - `[[ ... == start* ]]` is a bashism that fails under busybox/dash;
          it should be a POSIX `case` statement preserving the `start*` prefix match.
        - `readlink -f` is GNU-only; macOS/BSD readlink lacks `-f`. Exact
          canonicalization includes resolving a symlink in the final component,
          so the approved scoped GNU coreutils `grealpath` dependency must be
          used on `"$2"`; a `cd`/`pwd -P` plus basename function is not equivalent.
        - `echo -n` is unspecified across shells; because no divergent output
          is demonstrated on the named current targets, it is a MEDIUM Likely
          risk, and `printf` is the portable form.
        A correct response uses the skill's structured sections.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or hedges substantially.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent
