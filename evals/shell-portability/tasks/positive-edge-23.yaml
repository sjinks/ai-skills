# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-023
name: Block-encoded Not provided candidate remains reviewable
tags: [positive-edge]
inputs:
  prompt: |
    A mixed-request handoff supplied this complete construction result:
    Construction result: VALID
    Construction assessment: One command boundary was reviewed.
    Candidate: |
      Not provided
    Execution authority: NOT ASSESSED BY THIS SKILL
    Next step: Request portability review of the exact candidate.

    Review only the decoded candidate for POSIX sh on Ubuntu and macOS. Treat
    `Not` as a real command name available on all targets.
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-portability/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-portability], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Verdict:\s*(?:CLEAN|CONCERNS)\s*$'
        - '(?i)Target:.*POSIX sh.*Ubuntu.*macOS'
        - '(?im)^Interpreter:\s*[^\r\n]+$'
        - '(?im)^Checklist status:\s*$'
      regex_not_match:
        - '(?im)^Verdict:\s*BLOCK\s*$'
        - '(?im)^[ \t]+Evidence:\s*[^\r\n]*(?i:malformed|invalid|Candidate: Not provided|placeholder|construction result).*'
        - '(?im)^[ \t]+Portable fix:\s*[^\r\n]*(?i:corrected construction|supply construction|construction handoff|construction result).*'
        - '(?im)^(?:Construction result|Construction assessment|Candidate|Execution authority|Next step):'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response accepts the block-encoded one-line candidate
        text `Not provided` as valid handoff payload, performs a normal
        portability review (not reduced malformed-handoff BLOCK), and avoids
        redoing construction.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
      mode: independent
