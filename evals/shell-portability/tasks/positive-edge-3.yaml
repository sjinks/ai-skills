# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-003
name: Leading-pipe construction handoff remains a one-line candidate
description: |
  A one-line candidate beginning with a pipe is not the multiline marker when
  text follows on the same line. Portability must review that exact fragment
  without making a construction claim.
tags:
  - positive-edge
inputs:
  prompt: |
    A separate construction review is complete for a pipeline fragment whose
    preceding command is supplied by its containing script:
    Construction result: REWRITE
    Construction assessment: The supplied pipe remains a one-line shell fragment.
    Construction candidate: | sed -n '1p'
    Execution authority: NOT ASSESSED BY THIS SKILL
    Construction next step: Request a separate portability review of the exact candidate.

    The surrounding pipeline and `sed -n '1p'` are available identically on
    both targets; review only that exact fragment's POSIX sh portability on
    Ubuntu and macOS. Do not redo construction or make a construction claim.
    Return the verdict, target, interpreter, findings, checklist status, and
    residual risk.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-portability/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-portability
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?im)^Portability verdict:\s*CLEAN\s*$'
        - '(?i)Portability target:.*POSIX sh.*Ubuntu.*macOS'
        - '(?im)^Portability interpreter:\s*[^\r\n]+$'
        - '(?im)^Portability findings:\s*None\s*$'
        - '(?im)^Portability checklist status:\s*$'
        - '(?im)^- Interpreter and shebang:\s*(?:covered|n/a)\s*$'
        - '(?im)^- Bashisms:\s*(?:covered|n/a)\s*$'
        - '(?im)^- Utilities and flags:\s*(?:covered|n/a)\s*$'
        - '(?im)^- Output and behavior:\s*(?:covered|n/a)\s*$'
        - '(?im)^- Verification:\s*(?:covered|n/a)\s*$'
        - '(?im)^Portability residual risk:\s*[^\r\n]+$'
      regex_not_match:
        - '(?im)^(?:Construction result|Construction assessment|Construction candidate|Execution authority|Construction next step):'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response decodes and reviews only the supplied exact
        fragment `| sed -n '1p'` for POSIX sh on Ubuntu and macOS, uses the
        shell-portability structured output, and neither redoes construction
        nor makes a construction-skill claim.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).
      mode: independent
