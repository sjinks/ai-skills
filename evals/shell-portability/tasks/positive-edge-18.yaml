# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-018
name: Blank construction next step blocks review
tags: [positive-edge]
inputs:
  prompt: |
    Inspect the supplied mixed-request construction handoff. Its `Construction next step` field is blank.
    Review it for POSIX sh on Ubuntu and macOS only if the handoff is valid.
  files:
    - path: construction-result.txt
      content: "Construction result: REWRITE\nConstruction assessment: One command boundary was reviewed.\nConstruction candidate: echo hello\nExecution authority: NOT ASSESSED BY THIS SKILL\nConstruction next step: \n"
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-portability/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-portability], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?is)\AVerdict:\s*BLOCK\s*\r?\nTarget:\s*[^\r\n]+\r?\n\r?\nFindings:\s*\r?\n1\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*LOW\s*\r?\n[ \t]+Classification:\s*Open question\s*\r?\n[ \t]+Evidence:\s*[^\r\n]+\r?\n[ \t]+Rule:\s*(?:interpreter-shebang|bashisms|utilities-flags|output-behavior|verification)\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]+\r?\n[ \t]+Verification:\s*N/A\s*\r?\n?\z'
        - '(?im)^[ \t]+Evidence:\s*[^\r\n]*(?i:blank|empty|missing|nonblank)[^\r\n]*(?i:Construction next step|field|construction|handoff)[^\r\n]*$'
        - '(?im)^[ \t]+Portable fix:\s*[^\r\n]*(?i:provide|supply|correct|replace)[^\r\n]*(?i:nonblank|Construction next step|construction|handoff|construction result|field)[^\r\n]*$'
      regex_not_match:
        - '(?i)Verdict:\s*(?:CLEAN|CONCERNS)'
        - '(?im)^(?:Interpreter|Checklist status|Residual risk):'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response detects the blank Construction next step field, returns
        reduced BLOCK, requests a nonblank corrected construction result, and makes no
        portability conclusion. End with only 1.0, 0.5, or 0.0 on the last line.
      mode: independent
