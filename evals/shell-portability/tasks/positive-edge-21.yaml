# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-021
name: Two complete construction results block review
tags: [positive-edge]
inputs:
  prompt: |
    A mixed-request handoff supplied two complete construction results:
    Construction result: REWRITE
    Construction assessment: One command boundary was reviewed.
    Construction candidate: echo first
    Execution authority: NOT ASSESSED BY THIS SKILL
    Construction next step: Request portability review of the exact candidate.
    Construction result: VALID
    Construction assessment: The second candidate preserves the same boundary.
    Construction candidate: echo second
    Execution authority: NOT ASSESSED BY THIS SKILL
    Construction next step: Request portability review of the second candidate.

    Review it for POSIX sh on Ubuntu and macOS.
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-portability/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-portability], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?is)\APortability verdict:\s*BLOCK\s*\r?\nPortability target:\s*[^\r\n]+\r?\n\r?\nPortability findings:\s*\r?\n1\.\s+[^\r\n]+\r?\n[ \t]+Severity:\s*LOW\s*\r?\n[ \t]+Classification:\s*Open question\s*\r?\n[ \t]+Evidence:\s*[^\r\n]+\r?\n[ \t]+Rule:\s*(?:interpreter-shebang|bashisms|utilities-flags|output-behavior|verification)\s*\r?\n[ \t]+Risk:\s*[^\r\n]+\r?\n[ \t]+Portable fix:\s*[^\r\n]+\r?\n[ \t]+Verification:\s*N/A\s*\r?\n?\z'
        - '(?im)^[ \t]+Evidence:\s*[^\r\n]*(?i:two|multiple|more than one|exactly one)[^\r\n]*(?i:complete|construction result|handoff|result)[^\r\n]*$'
        - '(?im)^[ \t]+Portable fix:\s*[^\r\n]*(?i:provide|supply|correct|replace)[^\r\n]*(?i:one|single|exactly one)[^\r\n]*(?i:construction|handoff|construction result|result)[^\r\n]*$'
      regex_not_match:
        - '(?i)Portability verdict:\s*(?:CLEAN|CONCERNS)'
        - '(?im)^(?:Portability interpreter|Portability checklist status|Portability residual risk):'
        - '(?i)(?:\A|[:.!?][ \t]+)(?:(?:the[ \t]+)?(?:candidate|command|it|this)[ \t]+(?:is[ \t]+(?:portable|compatible|valid|suitable|supported)|conforms?|works?|runs?)[^\r\n]*(?:POSIX|Ubuntu|macOS)|(?:POSIX|Ubuntu|macOS)[^\r\n]{0,80}(?:portability|compatibility)[ \t]+(?:is|was|has[ \t]+been)[ \t]+(?:confirmed|verified|established))'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response detects that two individually complete
        construction results were supplied, returns reduced BLOCK, requests one
        corrected construction result, and makes no portability conclusion.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
      mode: independent
