# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: SOLID coaching without enforceable contracts
description: SOLID and design-pattern advice without type-level contracts should not activate type-safe-design.
tags:
  - negative-close
inputs:
  prompt: |
    Explain whether this notification service violates SRP and OCP, and suggest
    a cleaner Strategy-pattern refactor. This is a mentoring question about OOP
    style and class responsibilities, not about type systems, validation states,
    compiler-enforced contracts, reflection, or runtime data boundaries.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/type-safe-design/SKILL.md
      mode: negative
      threshold: 0.60
  - type: text
    name: task_completion
    config:
      not_contains:
        - 'Current contract risk'
        - 'Recommended contract shape'
        - 'Change-locality impact'
        - 'validation-as-types'
        - 'Validated'
        - 'generic misuse'
        - 'reflection boundary'
        - 'compiler-enforced'
        - 'Rule:'
        - 'Verification:'