# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Routine TypeScript compiler error
description: A narrow syntax/type-error explanation should not activate type-safe-design.
tags:
  - negative-trigger
inputs:
  prompt: |
    Why does TypeScript say `Type 'string' is not assignable to type 'number'`
    here, and what is the smallest code fix?

    ```ts
    let count: number = "3";
    ```
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/type-safe-design/SKILL.md
      mode: negative
      threshold: 0.60
  - type: text
    name: task_completion
    config:
      not_contains:
        - 'Current contract risk'
        - 'Change-locality impact'
        - 'Rule:'
        - 'Verification:'
        - 'Validated'
        - 'OCP'
        - 'No material findings'