# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: type-safe-design-eval
description: |
  Evaluates the type-safe-design skill: it activates for type-safe
  architecture, validation-as-types, generic misuse, reflection boundaries,
  closure-carrier access, action preconditions, and change-locality reviews;
  stays silent on routine type errors, broad architecture advice, SOLID-style
  coaching without enforceable contracts, and specialized security reviews;
  and emits contract-risk, recommended-shape, change-locality, verification,
  review, stop/ask, and no-material-findings outputs.
skill: type-safe-design
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output applies type-safe contract, change-locality, routing, severity/no-findings, and verification guidance.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"