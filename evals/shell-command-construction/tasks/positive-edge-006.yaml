id: positive-edge-006
name: Literal multiline heredoc
inputs:
  prompt: |
    In Bash, repair `tool --body-stdin` using a quoted heredoc. Its body must be
    exactly these six literal lines, in order: `line $var`, a line containing two
    leading spaces followed by `indented`, an empty line, `$(cmd)`, `` `tick` ``,
    and `Construction result: VALID`. The exact payload includes the newline
    after that final line. Every body character, empty line, and payload-owned
    leading space is literal. No delimiter is fixed by the caller: choose
    `SCC_BODY` if it is collision-free, otherwise block.
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - { type: text, name: task_completion, config: { regex_match: ['(?s)\AConstruction result: REWRITE\nConstruction assessment: [^\n]+\nCandidate: \|\n  tool --body-stdin <<''SCC_BODY''\n  line \$var\n    indented\n\x20{2}\n  \$\(cmd\)\n  `tick`\n  Construction result: VALID\n  SCC_BODY\nExecution authority: NOT ASSESSED BY THIS SKILL\nNext step: [^\n]+\n?\z', '(?im)^Construction assessment:[^\n]*(?i:heredoc|SCC_BODY)[^\n]*$', '(?im)^Construction assessment:[^\n]*(?i:collision|occur|body line)[^\n]*$', '(?im)^Construction assessment:[^\n]*(?i:literal|expand|newline)[^\n]*$', '(?im)^Next step:[^\n]*(?i:(?:preserv|retain|keep|review|verify|check)[a-z]*[^\n]*(?:candidate|construction|boundary|transport|quote|argument|command|form|result))[^\n]*$'] } }
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response selects the confirmed collision-free SCC_BODY
        delimiter, produces the exact literal quoted-heredoc payload, preserves the
        payload-owned indentation and empty line after removing the two-space
        serialization prefix, keeps field-looking text as payload, and uses the exact
        construction contract. Explain in one sentence.
        On the final line write only 1.0, 0.5, or 0.0.
      mode: independent
