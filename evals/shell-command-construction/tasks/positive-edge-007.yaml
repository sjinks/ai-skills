id: positive-edge-007
name: Repair JSON stdin and output redirection order
inputs: { prompt: "In POSIX sh, repair `tool --json < payload.json 2>&1 > result.json`; `payload.json` is the supplied literal JSON input, stdout must go to `result.json`, and stderr must follow that stdout destination. Preserve the stdin transport and correct only the redirection order." }
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
