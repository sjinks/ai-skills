# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-020
name: Confirmed remote parsers without transport contract
inputs:
  prompt: |
    In local Bash, construct the exact remote invocation for the two remote argv
    entries `tool` and `alpha beta`. The remote side uses confirmed POSIX sh, but
    no boundary-preserving transport or serialization contract has been provided.
expected:
  should_trigger: true
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?s)\AConstruction result: BLOCKED\nConstruction assessment: [^\n]*(?i:remote)[^\n]*\nCandidate: Not provided\nExecution authority: NOT ASSESSED BY THIS SKILL\nNext step: [^\n]*(?i:(?:request|provide|specify|clarify))[^\n]*(?i:transport|serialization)[^\n]*\n?\z'
        - '(?im)^Construction assessment:[^\n]*(?i:remote)[^\n]*$'
        - '(?im)^Construction assessment:[^\n]*(?i:posix|sh|parser)[^\n]*$'
        - '(?im)^Construction assessment:[^\n]*(?i:argv)[^\n]*$'
        - '(?im)^Construction assessment:[^\n]*(?i:boundar)[^\n]*$'
        - '(?im)^Construction assessment:[^\n]*(?i:transport|serializ)[^\n]*$'
        - '(?im)^Construction assessment:[^\n]*(?i:missing|absent|unavailable|unknown|not (?:provided|supplied|confirmed)|no (?:confirmed )?(?:transport|serialization))[^\n]*$'
        - '(?im)^Next step:[^\n]*(?i:transport|serializ)[^\n]*$'
        - '(?im)^Next step:\s*(?i:(?:request|provide|specify|clarify)\s+(?:only\s+)?(?:the\s+)?(?:remote\s+)?(?:boundary-preserving\s+)?(?:transport|serialization)(?:\s*/\s*(?:transport|serialization))?\s+contract\.?)\s*$'
      regex_not_match:
        - '(?im)^Next step:[^\n]*(?i:parser|interpreter)[^\n]*$'
        - '(?im)^Construction assessment:[^\n]*\b(?i:not|isn''t)\s+(?i:missing|absent|unavailable|unknown)\b[^\n]*$'