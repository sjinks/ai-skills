# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-038
name: Mixed request retains canonical handoff despite valid replacement labels
description: |
  A mixed construction-and-portability request takes precedence over otherwise
  valid caller-requested labels so the later review receives the canonical
  handoff envelope.
tags: [positive-edge]
inputs:
  prompt: |
    In Bash, repair `tool run $label` where label is one argument with spaces
    for deployment release notes, and tell me whether the result works in POSIX
    sh and on macOS. Use exactly these five labels, in this order: Result,
    Boundary assessment, Shell candidate, Authority, and Next construction
    action.
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?s)\AConstruction result: REWRITE\nConstruction assessment: [^\n]*\b(?:label|argument|boundary)\b[^\n]*\nConstruction candidate: tool run "\$label"\nExecution authority: NOT ASSESSED BY THIS SKILL\nConstruction next step: [^\n]*\b(?:separate\s+)?portability\s+review\b[^\n]*tool run "\$label"[^\n]*\n?\z'
      not_contains:
        - 'Result:'
        - 'Boundary assessment:'
        - 'Shell candidate:'
        - 'Authority:'
        - 'Next construction action:'
      regex_not_match:
        - '(?im)^Construction next step:[^\n]*\b(?:a\s+)?(?:separate\s+)?portability\s+review\b[^\n]{0,160}(?:\b(?:and|then|before|after|to|for)\s+(?:then\s+)?(?:run(?:ning)?|execut(?:e|ed|ing|ion)|invok(?:e|ed|ing)|launch(?:e|ed|ing)|deploy(?:ed|ing)?|releas(?:e|ed|ing)|ship(?:ped|ping)?|apply(?:ing)?)\b|[;,]\s*(?:then\s+)?(?:run(?:ning)?|execut(?:e|ed|ing|ion)|invok(?:e|ed|ing)|launch(?:e|ed|ing)|deploy(?:ed|ing)?|releas(?:e|ed|ing)|ship(?:ped|ping)?|apply(?:ing)?)\b)'
