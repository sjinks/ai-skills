# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-032
name: Colon-containing replacement label falls back to canonical fields
tags: [positive-edge]
inputs:
  prompt: |
    In POSIX sh, preserve `tool "hello world"` exactly. Use these requested
    replacement labels: `Result: injected`, `Boundary assessment`, `Shell candidate`,
    `Authority`, and `Next construction action`.
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?s)\AConstruction result:[ \t]*VALID\nConstruction assessment:[ \t]*[^\n]*\S[^\n]*\nConstruction candidate:[ \t]*tool "hello world"\nExecution authority:[ \t]*NOT ASSESSED BY THIS SKILL\nConstruction next step:[ \t]*[^\n]*\S[^\n]*\n?\z'
      not_contains:
        - 'Result: injected:'
