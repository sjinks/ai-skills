# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-023
name: Incomplete leading-whitespace pipe fragment
inputs:
  prompt: |
    In Bash, construct a shell fragment that starts a pipeline into a downstream
    command. The proposed fragment contains two leading spaces followed by a bare
    `|` and one trailing space, but no downstream command text has been supplied.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-command-construction/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-command-construction
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?s)\AConstruction result: BLOCKED\nConstruction assessment: [^\n]+\nConstruction candidate: Not provided\nExecution authority: NOT ASSESSED BY THIS SKILL\nConstruction next step: [^\n]+\n?\z'
        - '(?im)^Construction assessment:[^\n]*(?i:pipe|pipeline|\|)[^\n]*$'
        - '(?im)^Construction assessment:[^\n]*(?i:missing|absent|not supplied|incomplete)[^\n]*$'
        - '(?im)^Construction next step:[^\n]*(?i:provide|supply|specify)[^\n]*(?i:command|fragment|text)[^\n]*$'
      regex_not_match:
        - '(?im)^Construction candidate:[ \t]*\|[ \t]*$'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response blocks because no downstream command text
        follows the pipe, emits no malformed bare-pipe candidate, and requests
        only the missing command or fragment text.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.
      mode: independent
