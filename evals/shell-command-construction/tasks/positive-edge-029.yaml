# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-029
name: Caller-requested direct-response labels take precedence
description: |
  An explicit caller label set changes a direct construction response without
  changing its five-field semantics. Such a response is not a canonical
  handoff for a later review.
tags: [positive-edge]
inputs:
  prompt: |
    In POSIX sh, preserve the bytes between `BEGIN CANDIDATE` and `END
    CANDIDATE` exactly; the delimiter lines and the newline immediately before
    `END CANDIDATE` are framing, not candidate data:

    BEGIN CANDIDATE
    tool "hello world"
    END CANDIDATE

    Use exactly these five labels, in this order, with no preamble or trailing
    prose: Result, Boundary assessment, Shell candidate, Authority, and Next
    construction action. Do not use the default labels. The next action must
    preserve, review, or verify the candidate boundary.
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?s)\AResult:\s*VALID\nBoundary assessment:\s*[^\n]*\S[^\n]*\nShell candidate:\s*tool "hello world"\nAuthority:\s*NOT ASSESSED BY THIS SKILL\nNext construction action:\s*[^\n]*\S[^\n]*\n?\z'
        - '(?im)^Next construction action:[^\n]*(?i:preserve|retain|keep|review|verify|validate|check|confirm)[^\n]*(?i:candidate|boundary|argument|command|form)[^\n]*$'
      regex_not_match:
        - '(?im)^(?:Boundary assessment|Next construction action):[^\n]*(?:\b(?:it|this|that|(?:the\s+)?(?:candidate|command|operation|work|change|update|task|script|job|patch|deployment|rollout|release|shipping|deploy|execution|system|process|run))\s+(?:(?:is|was|has\s+been|is\s+now|is\s+already|has|had)\s+(?:successfully\s+)?(?:deployed|released|shipped|executed|run|live|done|in\s+production|completed|finished|performed|carried\s+out|put\s+into\s+production|put\s+live|applied|complete|successful|updated)|(?:has\s+)?(?:completed|finished|succeeded|concluded|ended)|ran\s+successfully|ran\s+to\s+completion|finished\s+running|took\s+place|happened|occurred|proceeded\s+successfully)\b|\b(?:i|we|(?:the\s+)?(?:operator|reviewer|team|user|someone|anyone))\s+(?:rolled\s+out|completed|performed|ran|executed|invoked|launched|deployed|released|shipped)\s+(?:it|this|that|(?:the\s+)?(?:candidate|command|operation|work|change|update|task|script|job|patch|deployment|rollout|release|shipping|deploy|execution|system|process|run))\b)'
        - '(?im)^Next construction action:[^\n]*(?:\b(?:later|eventually|subsequently|tomorrow|tonight)\b|\bas\s+soon\s+as\b|\bat\s+(?:your\s+convenience|the\s+(?:earliest|next)\s+(?:opportunity|time|date)|(?:a\s+)?(?:later|future)\s+(?:time|date))\b|\bin\s+due\s+course\b|\b(?:when|once|after|until|upon|pending|following|during)\s+(?:(?:the|a|an)\s+)?(?:approval|approved|authorization|authorized|clearance|cleared|confirmation|confirmed|completion|complete|release|review|window|cycle|iteration|feasibility|availability|readiness|ready|feasible|practicable|possible|(?:circumstances|conditions)\s+(?:permit|allow)|(?:the\s+)?change\s+window\s+opens|(?:the\s+)?next\s+(?:release|review|window|cycle|iteration|week|month))\b)'
        - '(?im)^(?:Boundary assessment|Next construction action):[^\n]*(?:\b(?:safe|unsafe|authoriz(?:ed|ation)?|approv(?:ed|al)?|unapproved|allow(?:ed)?|permit(?:ted)?|portable|compatible|run|execut(?:e|ed|ing)|invok(?:e|ed|ing)|launch(?:ed|ing)|deploy(?:ed|ing)?|releas(?:e|ed|ing)|ship(?:ped|ping))\b|\b(?:works?|runs?)\b[^\n]{0,40}\b(?:on|under|across|with|for|in)\b|\b(?:candidate|command|operation)\s+(?:was|is|has\s+been)\s+(?:run|executed|invoked|launched|deployed|released|shipped)\b)'
      not_contains:
        - 'Construction result:'
        - 'Construction assessment:'
        - 'Construction candidate:'
        - 'Construction next step:'
