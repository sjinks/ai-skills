id: negative-close-003
name: Execution-safety-only command review
inputs: { prompt: "The exact Bash command is `rm -- /tmp/scc-fixture/old.log`. Do not review or change its shell construction. Assess only whether executing it is safe and authorized." }
expected: { should_trigger: false }
