# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-006
name: General shell grammar defect outside catalog
inputs:
  prompt: |
    Fix the missing `then` in this Bash script:

    ```bash
    if true
      echo hello
    fi
    ```

    This is general shell syntax debugging; no literal/expansion, argv, stream,
    heredoc, redirection, multiline-data, or payload-transport boundary is at issue.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-command-construction/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - 'Construction result:'
        - 'Construction assessment:'
        - 'Candidate:'
        - 'Execution authority:'
        - 'Next step:'
