id: positive-edge-011
name: NUL payload without supplied NUL-capable transport
inputs: { prompt: "In POSIX sh, construct `tool --query` with exactly one literal scalar containing U+0000 NUL between `alpha` and `beta` (symbolically: `alpha` + U+0000 NUL + `beta`; do not render a raw NUL). Only argv or a heredoc are available; no NUL-capable file or binary interface is supplied." }
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - { type: text, name: task_completion, config: { regex_match: ['(?s)\AConstruction result: BLOCKED\nConstruction assessment: (?=[^\n]*\S)(?=[^\n]*(?i:NUL|U\+0000))(?=[^\n]*(?i:argv))(?=[^\n]*(?i:heredoc))(?=[^\n]*(?i:cannot|unable|not represent|unsupported))[^\n]+\nCandidate: Not provided\nExecution authority: NOT ASSESSED BY THIS SKILL\nNext step: (?=[^\n]*\S)(?=[^\n]*(?i:NUL|U\+0000))(?=[^\n]*(?i:non-argv|file|binary))(?=[^\n]*(?i:transport|interface))[^\n]+\n?\z'] } }
