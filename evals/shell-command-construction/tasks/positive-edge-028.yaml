# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-028
name: Reserved placeholder literal uses block serialization
inputs:
  prompt: |
    In POSIX sh, preserve this supplied one-line command fragment exactly:
    `Not provided`

    The text is literal command data and already has the intended single
    boundary. Do not block solely because it matches the reserved BLOCKED
    placeholder text.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/shell-command-construction/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - shell-command-construction
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?s)\AConstruction result: VALID\nConstruction assessment: [^\n]+\nConstruction candidate: \|\n  Not provided\nExecution authority: NOT ASSESSED BY THIS SKILL\nConstruction next step: [^\n]+\n?\z'
        - '(?im)^Construction assessment:[^\n]*(?i:placeholder|reserved|one-line|literal|boundary)[^\n]*$'
        - '(?im)^Construction next step:[^\n]*(?i:preserve|keep|review|verify|validate|confirm|check)[^\n]*$'
      regex_not_match:
        - '(?im)^Construction result:\s*(?:REWRITE|BLOCKED)\s*$'
        - '(?im)^Construction candidate:\s*Not provided\s*$'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response preserves literal one-line candidate text
        equal to `Not provided` by using the canonical block serialization,
        keeps the result VALID, and avoids collapsing to the BLOCKED placeholder.

        Call set_waza_grade_pass exactly once only when all full-success criteria
        in this prompt hold. Otherwise, including partial completion, call
        set_waza_grade_fail exactly once. Put the reasoning in the tool call's
        reason argument; do not return a numeric grade as response text.
      mode: independent
