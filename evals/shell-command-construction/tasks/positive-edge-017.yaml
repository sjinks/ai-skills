id: positive-edge-017
name: Mixed construction portability
inputs: { prompt: "In Bash, repair `tool run $label` where label is one argument with spaces for deployment release notes, and tell me whether the result works in POSIX sh and on macOS." }
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - { type: text, name: task_completion, config: { regex_match: ['(?s)\AConstruction result: REWRITE\nConstruction assessment: (?=[^\n]*\S)The run subcommand receives one label argument for deployment release notes\.\nCandidate: tool run "\$label"\nExecution authority: NOT ASSESSED BY THIS SKILL\nNext step: Have a separate portability review of this exact candidate before any cross-target compatibility claim\.\n?\z'], regex_not_match: ['(?im)^(?:Construction assessment|Next step):[^\n]*(?:\b(?:I|we)\s+(?:approve|authorize|permit|allow|clear)\b|\b(?:candidate|command|execution|operation)\s+(?:approved|authorized|allowed|permitted|cleared|executable)\b)', '(?im)^(?:Construction assessment|Next step):[ \t]*(?:Approved|Authorized|Unauthorized|Executable|Safe[ \t]+to[ \t]+run|Unsafe|Allowed|Permitted)\.?[ \t]*$'], not_contains: ['compatible', 'works in POSIX sh', 'macOS'] } }
