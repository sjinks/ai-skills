# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-030
name: Custom labels retain the BLOCKED placeholder branch
description: |
  Replacement labels retain the semantic BLOCKED candidate placeholder and a
  focused clarification next step.
tags: [positive-edge]
inputs:
  prompt: |
    In POSIX sh, I cannot tell whether $items is one scalar value or a list of
    separate argv values. Use exactly these five labels, in this order, with no
    preamble or trailing prose: Result, Boundary assessment, Shell candidate,
    Authority, and Next construction action. Do not use the default labels.
expected: { should_trigger: true }
graders:
  - { type: trigger, name: trigger_accuracy, config: { skill_path: skills/shell-command-construction/SKILL.md, mode: positive, threshold: 0.45 } }
  - { type: skill_invocation, name: skill_invocation, config: { required_skills: [shell-command-construction], mode: any_order } }
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?s)\AResult:\s*BLOCKED\nBoundary assessment:\s*[^\n]*\b(?:scalar|one|single)\b[^\n]*\b(?:list|multiple|argv)\b[^\n]*\nShell candidate:\s*Not provided\nAuthority:\s*NOT ASSESSED BY THIS SKILL\nNext construction action:\s*[^\n]*\b(?:scalar|one|single)\b[^\n]*\b(?:list|multiple|argv)\b[^\n]*\n?\z'
      regex_not_match:
        - '(?im)^(?:Boundary assessment|Next construction action):[^\n]*(?:\b(?:it|this|that|(?:the\s+)?(?:candidate|command|operation|work|change|update|task|script|job|patch|deployment|rollout|release|shipping|deploy|execution|system|process|run))\s+(?:(?:is|was|has\s+been|is\s+now|is\s+already|has|had)\s+(?:successfully\s+)?(?:deployed|released|shipped|executed|run|live|done|in\s+production|completed|finished|performed|carried\s+out|put\s+into\s+production|put\s+live|applied|complete|successful|updated)|(?:has\s+)?(?:completed|finished|succeeded|concluded|ended)|ran\s+successfully|ran\s+to\s+completion|finished\s+running|took\s+place|happened|occurred|proceeded\s+successfully)\b|\b(?:i|we|(?:the\s+)?(?:operator|reviewer|team|user|someone|anyone))\s+(?:rolled\s+out|completed|performed|ran|executed|invoked|launched|deployed|released|shipped)\s+(?:it|this|that|(?:the\s+)?(?:candidate|command|operation|work|change|update|task|script|job|patch|deployment|rollout|release|shipping|deploy|execution|system|process|run))\b)'
        - '(?im)^(?:Boundary assessment|Next construction action):[^\n]*(?:\b(?:safe|unsafe|authoriz(?:ed|ation)?|approv(?:ed|al)?|unapproved|allow(?:ed)?|permit(?:ted)?|portable|compatible|run|execut(?:e|ed|ing)|invok(?:e|ed|ing)|launch(?:ed|ing)|deploy(?:ed|ing)?|releas(?:e|ed|ing)|ship(?:ped|ping))\b|\b(?:works?|runs?)\b[^\n]{0,40}\b(?:on|under|across|with|for|in)\b|\b(?:candidate|command|operation)\s+(?:was|is|has\s+been)\s+(?:run|executed|invoked|launched|deployed|released|shipped)\b)'
      not_contains:
        - 'Construction result:'
        - 'Construction assessment:'
        - 'Construction candidate:'
        - 'Construction next step:'
