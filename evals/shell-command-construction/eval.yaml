# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/eval.schema.json
name: shell-command-construction-eval
description: |
  Evaluates concrete shell construction requests: literal data, argv boundaries,
  multiline transport, fail-closed ambiguity, and construction-only output.
skill: shell-command-construction
version: "1.0"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-5
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Prompt intent matches concrete construction activation or exclusion.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: The skill is invoked on positive construction tasks.
  - name: task_completion
    weight: 0.20
    threshold: 0.8
    description: Activated SCC output has the exact construction-only fields and required semantics.
  - name: task_completion_substance
    weight: 0.10
    threshold: 0.7
    description: Selected representative tasks preserve requested construction semantics.
  - name: output_contract
    weight: 0.10
    threshold: 1.0
    description: Output beginning with any normalized distinctive SCC top-level label satisfies the exact five-field serialization and construction-only contract; ordinary prose with only incidental later generic label mentions remains valid for intentional non-activation tasks.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Response stays within tool-call and total-token budgets.
graders:
  - type: code
    name: output_contract
    config:
      language: python
      assertions:
        # Ordinary prose remains valid unless a normalized distinctive SCC top-level field starts
        # output (after an existing Markdown wrapper). Any such partial contract is
        # invalid; positive tasks separately require Construction result.
          - '("\x00" not in output and (not re.search(r"(?i)\A[ \t]*(?:(?:[-*+]|[0-9]+[.)])[ \t]+|>[ \t]*)*(?:#{1,6}[ \t]+)?(?:(?:`{3,}|~{3,})[^\n]*\n[ \t]*(?:(?:[-*+]|[0-9]+[.)])[ \t]+|>[ \t]*)*)?(?:construction[ _-]*(?:result|assessment|candidate|next[ _-]*step)|execution[ _-]*authority)[ \t]*:", output) or re.fullmatch(r"Construction result: (VALID|REWRITE|BLOCKED)\nConstruction assessment: (?=[^\n]*\S)[^\n]+\nConstruction candidate: (?:[^\S\n]*[^\s|\n][^\n]*\n|[^\S\n]*\|[^\S\n]*\S[^\n]*\n|\|\n(?=(?:  [^\n]*\n)*?  [^\n]*\S)(?:  [^\n]*\n)+)Execution authority: NOT ASSESSED BY THIS SKILL\nConstruction next step: (?=[^\n]*\S)[^\n]+\n?", output) is not None))'
          - '(not re.search(r"(?i)\A[ \t]*(?:(?:[-*+]|[0-9]+[.)])[ \t]+|>[ \t]*)*(?:#{1,6}[ \t]+)?(?:(?:`{3,}|~{3,})[^\n]*\n[ \t]*(?:(?:[-*+]|[0-9]+[.)])[ \t]+|>[ \t]*)*)?(?:construction[ _-]*(?:result|assessment|candidate|next[ _-]*step)|execution[ _-]*authority)[ \t]*:", output) or ((output.startswith("Construction result: BLOCKED\n") and "\nConstruction candidate: Not provided\n" in output) or (not output.startswith("Construction result: BLOCKED\n") and re.search(r"(?m)^Construction candidate: Not provided[ \t]*$", output) is None)))'
        # Enforce the output-contract semantic policy against ordered custom fields;
        # only candidate payload text remains outside those claim checks.
          - '(lambda active, custom: not active or (custom is not None and len({custom.group(name).lower() for name in ("result_label", "assessment_label", "candidate_label", "authority_label", "next_label")}) == 5 and all(custom.group(name).lower() not in {"construction result", "construction assessment", "construction candidate", "execution authority", "construction next step"} for name in ("result_label", "assessment_label", "candidate_label", "authority_label", "next_label")) and custom.group("authority") == "NOT ASSESSED BY THIS SKILL" and ((custom.group("result") == "BLOCKED" and custom.group("candidate") == "Not provided") or (custom.group("result") != "BLOCKED" and (custom.group("candidate") is None or custom.group("candidate").rstrip() != "Not provided"))) and re.search(r"(?i)\b(?:safe|unsafe|authoriz(?:ed|ation)?|approv(?:e|ed|al)?|unapproved|allow(?:ed)?|permit(?:ted)?|portable|compatible|cleared)\b|\b(?:i|we)\s+(?:approve|authorize|permit|allow|clear)\b|\b(?:it|this|you)\s+(?:is\s+|are\s+)?(?:okay|allowed|permitted)\s+to\s+(?:use|execute|run|invoke|launch|deploy|release|ship)\b|\byou\s+(?:may|can|should)\s+(?:now\s+)?(?:use|execute|run|invoke|launch|deploy|release|ship)\b|\b(?:works?|runs?)\b[^\n]{0,40}\b(?:on|under|across|with|for|in)\b|\b(?:candidate|command|operation)\s+(?:was|is|has\s+been)\s+(?:run|executed|invoked|launched|deployed|released|shipped)\b|\b(?:operator|reviewer|team|user|someone|anyone)\s+(?:may|can|should|did|has)\b[^\n]{0,48}\b(?:run|execute|invoke|launch|deploy|release|ship)\b|\b(?:run|execute|invoke|launch|deploy|release|ship)\s+(?:it|this|that|(?:the\s+)?(?:candidate|command|operation))\b|\b(?:go\s+ahead|proceed)\b|\b(?:query|json|yaml|xml|sql|regex|payload|document|message|body|content)\b[^\n]{0,80}\b(?:well-formed|parseable|syntactically\s+valid|semantically\s+correct|valid|correct|invalid|incorrect|malformed|unparseable)\b|\b(?:query|json|yaml|xml|sql|regex|payload|document|message|body|content)\b[^\n]{0,80}\b(?:has|have|with|matches?)\s+(?:the\s+)?(?:intended|expected|desired)\s+(?:meaning|semantics?|result|behavior)\b|\b(?:the\s+)?(?:deployment|rollout|release|shipping)\s+(?:took\s+place|has\s+(?:completed|finished)|finished(?:\s+successfully)?|went\s+live|occurred|is\s+complete|was\s+completed|is\s+live)\b|\b(?:the\s+)?(?:candidate|command|operation)\s+(?:(?:was|has\s+been)\s+(?:run|executed|invoked|launched|deployed|released|shipped)|is\s+(?:now\s+|already\s+)?(?:deployed|live|in\s+production))\b", custom.group("assessment") + "\n" + custom.group("next")) is None and re.search(r"(?i)\b(?:later|eventually|subsequently|tomorrow|tonight)\b|\bas\s+soon\s+as\b|\bat\s+(?:your\s+convenience|the\s+(?:earliest|next)\s+(?:opportunity|time|date))\b|\b(?:a\s+)?(?:later|future)\s+(?:time|date)\b|\bin\s+due\s+course\b|\b(?:when|once|after|until|upon|pending|following|during)\s+(?:(?:the|a|an)\s+)?(?:approval|authorization|clearance|confirmation|completion|release|review|window|cycle|iteration|feasibility|availability|readiness|ready|feasible|practicable|possible)\b|\b(?:do\s+not|don''t|never)\s+(?:preserv|retain|keep|review|verify|validate|check|confirm|apply)[a-z]*\b", custom.group("next")) is None and (custom.group("result") == "BLOCKED" or re.search(r"(?i)(?:\b(?:preserv|retain|keep|review|verify|validate|check|confirm)[a-z]*\b[^\n]*(?:candidate|construction|boundary|transport|quote|argument|command|form|result)\b|\bapply\b[^\n]*\brewrite\b)", custom.group("next")) is not None)))(re.match(r"(?s)\A(?!(?i:construction result|construction assessment|construction candidate|execution authority|construction next step)[ \t]*:)[^\n]*:[ \t]*(?:VALID|REWRITE|BLOCKED)\b[^\n]*\n", output) is not None, re.fullmatch(r"(?s)(?P<result_label>[A-Za-z0-9](?:[A-Za-z0-9 ]*[A-Za-z0-9])?):[ \t]*(?P<result>VALID|REWRITE|BLOCKED)\n(?P<assessment_label>[A-Za-z0-9](?:[A-Za-z0-9 ]*[A-Za-z0-9])?):[ \t]*(?P<assessment>[^\n]*\S[^\n]*)\n(?P<candidate_label>[A-Za-z0-9](?:[A-Za-z0-9 ]*[A-Za-z0-9])?):[ \t]*(?:(?P<candidate>(?![ \t]*\|[ \t]*\n)(?:Not provided|[^\n]*\S[^\n]*))\n|\|\n(?=(?:  [^\n]*\n)*?  [^\n]*\S)(?:  [^\n]*\n)+)(?P<authority_label>[A-Za-z0-9](?:[A-Za-z0-9 ]*[A-Za-z0-9])?):[ \t]*(?P<authority>[^\n]+)\n(?P<next_label>[A-Za-z0-9](?:[A-Za-z0-9 ]*[A-Za-z0-9])?):[ \t]*(?P<next>[^\n]*\S[^\n]*)\n?", output))'
        # Malformed replacement-style result labels still activate the guard; the
