# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Unrelated everyday prompt
description: Unrelated everyday request must not activate the architecture-decision-record skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's the difference between French press and pour-over coffee?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/architecture-decision-record/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Architecture Decision Record"
        - "Revisit triggers"
        - "Decision drivers"
        - "Verdict: BLOCK"
        - "Smallest addition to proceed"
