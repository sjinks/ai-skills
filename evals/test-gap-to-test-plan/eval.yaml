# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: test-gap-to-test-plan-eval
description: |
  Evaluates the test-gap-to-test-plan skill: it activates when review
  findings need to become a concrete test plan, stays silent on initial
  review requests or unrelated questions, is actually invoked when expected
  (and not when not), and emits the skill's required output (verdict, test
  cases with required fields, coverage summary, handoff).
skill: test-gap-to-test-plan
version: "1.1"
config:
  trials_per_task: 2
  timeout_seconds: 300
  parallel: true
  workers: 4
  executor: copilot-sdk
  model: claude-sonnet-4.6
  max_attempts: 2
metrics:
  - name: trigger_accuracy
    weight: 0.30
    threshold: 0.8
    description: Heuristic prompt-vs-SKILL.md keyword alignment matches the task's expected mode.
  - name: skill_invocation
    weight: 0.15
    threshold: 0.9
    description: Skill is invoked on positive tasks that should activate it.
  - name: task_completion
    weight: 0.40
    threshold: 0.8
    description: Output carries the test-plan contract and applies the severity-to-priority mapping correctly.
  - name: efficiency
    weight: 0.15
    threshold: 0.7
    description: Stays within tool-call and total-token budgets.
graders:
  - type: behavior
    name: efficiency
    config:
      max_tool_calls: 8
      max_tokens: 8000
tasks:
  - "tasks/*.yaml"
