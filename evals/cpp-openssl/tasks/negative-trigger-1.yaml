# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic baking question
description: Unrelated everyday question must not activate the cpp-openssl skill.
tags:
  - negative-trigger
inputs:
  prompt: "What's the ideal hydration percentage for a beginner sourdough loaf?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-openssl/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "SSL_CTX_set_verify"
        - "SSL_VERIFY_PEER"
        - "drain the error queue"
        - "EVP_EncryptInit_ex"
