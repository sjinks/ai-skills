# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: No actionable work item blocks
description: |
  A handoff request with no work item and no source context should emit the
  reduced BLOCK template instead of fabricating a continuation note.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Please create a handoff note, but I have not told you what we were
    working on and there is no source context attached.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/handoff-note/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - handoff-note
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Handoff Note'
        - '(?i)Verdict: BLOCK'
        - '(?i)Missing input:'
        - '(?i)Smallest addition to proceed:'
      not_contains:
        - "## Current State"
        - "## Completed Work"
        - "## Next Steps"
