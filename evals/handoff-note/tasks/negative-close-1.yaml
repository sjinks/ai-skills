# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Manager status report is not continuation handoff
description: |
  A status report to management may mention progress and blockers, but
  it should not use the cold-resume handoff output contract.
tags:
  - negative-trigger
  - close-domain
inputs:
  prompt: |
    Draft a weekly status report for leadership about the billing CSV
    export project. Keep it high level: accomplishments, risks, and
    whether we are on track.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/handoff-note/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "# Handoff Note"
        - "Handoff Note:"
        - "# Handoff Audit"
        - "## Goal"
        - "## Current State"
        - "## Completed Work"
        - "## Tried and Avoid"
        - "## Next Steps"
        - "## Constraints and Boundaries"
        - "## Open Questions"
        - "## Completeness Findings"
        - "## Required Corrections"
        - "## Ready to Hand Off"
        - "Verdict: BLOCK"
        - "Missing input:"
        - "Smallest addition to proceed:"
