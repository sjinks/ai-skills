# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-001
name: Crash root-cause debugging request
description: |
  Debugging a specific segfault is out of scope; the skill must not activate
  on root-cause analysis of a crash dump.
tags:
  - negative-close
inputs:
  prompt: |
    My program segfaults in libfoo with this backtrace from gdb (frame 3 is
    foo::Bar::tick). Walk me through finding the root cause: which frames to
    inspect, what to print, and how to narrow down the faulting access.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-error-handling-design/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Error policy:"
        - "Checklist status:"
