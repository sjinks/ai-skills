# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-edge-002
name: Insufficient context on a policy-only question
description: |
  A question with no code, no API, and no failure classes must produce the
  reduced BLOCK template.
tags:
  - positive-trigger
  - positive-edge
inputs:
  prompt: |
    Our team is arguing about exception safety guarantees in a module I
    haven't seen — something about rollback in the persistence layer. I can't
    share any code or the API. Which side is right?
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-error-handling-design/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cpp-error-handling-design
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)Open question'
        - '(?i)(code|API|target|module)'
        - '(?i)(unknown|missing|cannot|unavailable|not\s+(shared|provided|supplied|shown|available|seen))'
      not_contains:
        - "Checklist status:"
        - "Residual risk:"
