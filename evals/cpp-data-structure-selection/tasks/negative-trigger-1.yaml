# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-trigger-001
name: Off-topic gardening question
description: Unrelated everyday question must not activate the cpp-data-structure-selection skill.
tags:
  - negative-trigger
inputs:
  prompt: "When is the best time of year to prune apple trees in a temperate climate?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-data-structure-selection/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Access pattern:"
        - "Recommended structure:"
        - "Checklist status:"
