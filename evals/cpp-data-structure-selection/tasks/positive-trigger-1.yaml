# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: positive-trigger-001
name: O(n^2) dedup by re-scan over caller input
description: |
  Review must name the O(n^2) shape of dedup-by-rescan over unbounded
  caller-supplied input and recommend a side hash set while preserving the
  output vector's insertion order.
tags:
  - positive-trigger
inputs:
  prompt: |
    This runs once per inbound HTTP request to deduplicate header fields by
    name. The header count comes straight from the client. As the request
    grows it gets slow. Should the data structure change?

    ```cpp
    std::vector<Field> dedup(const std::vector<Field>& raw) {
      std::vector<Field> out;
      for (const auto& f : raw) {
        auto it = std::find_if(out.begin(), out.end(),
          [&](const Field& g) { return iequals(g.name, f.name); });
        if (it == out.end()) out.push_back(f);
      }
      return out;
    }
    ```

    Return the verdict, access pattern, sizes, recommended structure,
    crossover note, behavior risk, and checklist status.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-data-structure-selection/SKILL.md
      mode: positive
      threshold: 0.45
  - type: skill_invocation
    name: skill_invocation
    config:
      required_skills:
        - cpp-data-structure-selection
      mode: any_order
  - type: text
    name: task_completion
    config:
      regex_match:
        - '(?i)Verdict:\s*BLOCK'
        - '(?i)(CRITICAL|HIGH)'
        - '(?i)O\(n\^?2\)|O\(n²\)|quadratic|n\*n'
        - '(?i)(unordered_set|unordered_map|hash (set|map)).{0,160}(name|key|membership)|(side|auxiliary).{0,40}(hash (set|map)|unordered_(set|map))'
        - '(?i)(insertion order|preserve.{0,30}order|keep.{0,30}vector)'
        - '(?i)(Access pattern|Recommended structure|Crossover note|Checklist status):'
  - type: prompt
    name: task_completion_substance
    config:
      prompt: |
        Grade whether the response correctly judges this dedup loop:
        - It names the current shape as O(n^2) because each element re-scans
          the growing output vector.
        - It recommends keeping the output std::vector (to preserve the
          insertion order callers depend on) and adding a side hash set/map of
          normalized names to make membership O(1) average, giving O(n).
        - It flags the unbounded caller-controlled header count as the reason
          severity is CRITICAL (latency/DoS) and the verdict is BLOCK, and
          notes the small-N crossover where a flat scan still wins.
        A correct response uses the skill's structured output sections.

        Output format (strict):
        - Write one sentence of reasoning on its own line.
        - On the very last line, write only one of: 1.0, 0.5, 0.0
          (no other text on that line).

        1.0 = response correctly performs the substantive judgement defined
              in this rubric.
        0.5 = response is partially correct or hedges substantially.
        0.0 = response is wrong, missing the required judgement, or did not
              perform the skill at all.
      mode: independent
