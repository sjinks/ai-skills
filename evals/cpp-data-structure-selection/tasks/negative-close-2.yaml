# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.33.0/schemas/task.schema.json
id: negative-close-002
name: Struct member padding, same container
description: |
  Shrinking one struct's sizeof by reordering members to remove padding is
  in-memory layout review, not container selection; the skill must not
  activate even though the struct lives in a vector.
tags:
  - negative-close
inputs:
  prompt: |
    These records are stored in a std::vector and the vector is the right
    container — I am not changing it. I just want to shrink each element by
    reordering the members to remove padding so sizeof drops. (x86-64.)

    ```cpp
    struct Record {
      char    flag_a;
      double  weight;
      char    flag_b;
      int     count;
    };
    ```

    What member order minimizes sizeof?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: trigger_accuracy
    config:
      skill_path: skills/cpp-data-structure-selection/SKILL.md
      mode: negative
      threshold: 0.45
  - type: text
    name: task_completion
    config:
      not_contains:
        - "Verdict:"
        - "Findings:"
        - "Access pattern:"
        - "Recommended structure:"
        - "Checklist status:"
